<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#EFF1FB">
<title>果叽跳一跳</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#EFF1FB;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#333;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  #cv{position:absolute;inset:0;display:block}
  .safe{position:absolute;inset:0;pointer-events:none;
    padding:calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right))
            calc(12px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
  #hud{position:absolute;left:calc(16px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));
    pointer-events:none;transition:opacity .2s}
  #score{font-size:44px;font-weight:500;line-height:1;color:#2C2C2A;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  #best{margin-top:6px;font-size:13px;color:#8A8FA8;font-variant-numeric:tabular-nums}
  #combo{margin-top:10px;font-size:15px;font-weight:500;color:#BA7517;opacity:0;transition:opacity .15s}
  #combo.on{opacity:1}
  .iconbtn{position:absolute;width:44px;height:44px;border-radius:50%;
    border:.5px solid rgba(51,51,51,.18);background:rgba(255,255,255,.72);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #pauseBtn{right:calc(16px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));font-size:15px;color:#555}
  #muteBtn{right:calc(16px + env(safe-area-inset-right));top:calc(66px + env(safe-area-inset-top));font-size:15px;color:#555}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;padding:28px 0 calc(28px + env(safe-area-inset-bottom));background:rgba(244,246,253,.94);
    backdrop-filter:blur(10px);z-index:10;opacity:0;pointer-events:none;transition:opacity .22s}
  .screen.on{opacity:1;pointer-events:auto}
  .title{font-size:34px;font-weight:500;color:#2C2C2A;letter-spacing:.02em}
  .subtitle{margin-top:8px;font-size:13px;color:#8A8FA8}
  .card{margin-top:26px;width:min(86vw,430px);background:#fff;border-radius:16px;
    border:.5px solid rgba(51,51,51,.10);padding:18px 20px}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:#5F5E5A;
    padding:7px 0;border-bottom:.5px solid rgba(51,51,51,.07)}
  .row:last-child{border-bottom:0}
  .row b{font-weight:500;color:#2C2C2A;font-variant-numeric:tabular-nums}
  .big{font-size:64px;font-weight:500;color:#2C2C2A;line-height:1;font-variant-numeric:tabular-nums}
  .newrec{margin-top:10px;font-size:14px;font-weight:500;color:#BA7517;height:18px}
  .btn{width:min(86vw,430px);height:60px;border-radius:14px;border:0;font-size:18px;font-weight:500;
    cursor:pointer;margin-top:14px;font-family:inherit;transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.p{background:#534AB7;color:#fff}
  .btn.s{background:#fff;color:#534AB7;border:.5px solid rgba(83,74,183,.35)}
  .btn.ghost{background:transparent;color:#8A8FA8;height:44px;font-size:14px}
  .tips{margin-top:20px;width:min(86vw,430px);font-size:13px;line-height:1.85;color:#8A8FA8;text-align:left}
  .tips b{color:#5F5E5A;font-weight:500}
  .badge{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom));
    font-size:12px;color:#A9AEC4;pointer-events:none;transition:opacity .2s}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
    font-size:15px;color:#5F5E5A;background:rgba(255,255,255,.86);border-radius:999px;padding:9px 18px;
    border:.5px solid rgba(51,51,51,.10);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
  #hint.on{opacity:1}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#534AB7;margin-right:6px;
    vertical-align:middle}

  /* ---------- 屏幕内容容器：矮屏可滚动，内容始终居中 ----------
     注意：这里把 justify-content 从 center 改为 flex-start，改由 .scwrap 的
     margin:auto 做垂直居中。否则内容高于屏幕时 flex 居中会把顶部推出可视区
     且无法滚动到（实测 320x568 下标题页顶部被吃掉 25px）。 */
  .screen{overflow-y:auto;overscroll-behavior:contain;justify-content:flex-start}
  .scwrap{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}

  /* ---------- 角色选择 ---------- */
  .picks{display:flex;gap:12px;margin-top:20px;width:min(86vw,430px)}
  .pick{flex:1 1 0;min-width:0;background:#fff;border:.5px solid rgba(51,51,51,.12);border-radius:18px;
    padding:14px 8px 12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;
    align-items:center;gap:1px;box-shadow:0 4px 14px rgba(51,51,51,.06);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
  .pick:active{transform:scale(.97)}
  @media (hover:hover){.pick:hover{border-color:rgba(83,74,183,.45);transform:translateY(-2px)}}
  .pick.sel{border-color:#534AB7;background:#F7F6FE;box-shadow:0 8px 22px rgba(83,74,183,.18)}
  .pick .pimg{height:100px;display:flex;align-items:flex-end;justify-content:center}
  .pick .pimg img{max-height:96px;max-width:100%;object-fit:contain;display:block}
  .pick strong{font-size:15.5px;font-weight:600;color:#2C2C2A;letter-spacing:.02em;margin-top:6px}
  .pick em{font-style:normal;font-size:12px;color:#8A8FA8}
  .pick.sel em{color:#6C63C8}
  .pick .tag{font-style:normal;font-size:10.5px;color:#fff;background:#534AB7;border-radius:999px;
    padding:2px 8px;line-height:1.5;margin-top:5px;opacity:0;transition:opacity .16s}
  .pick.sel .tag{opacity:1}

  /* ---------- 微信公众号搜索引导 ---------- */
  .wxbox{margin-top:14px;width:min(86vw,430px);background:#F1FBF5;
    border:.5px solid rgba(7,193,96,.20);border-radius:16px;padding:11px 12px 10px}
  .wxbar{display:flex;align-items:center;gap:9px;background:#fff;border:.5px solid rgba(7,193,96,.26);
    border-radius:999px;padding:7px 7px 7px 12px;box-shadow:0 2px 8px rgba(7,193,96,.09)}
  .wxbar svg{display:block;flex:0 0 auto}
  .wxname{flex:1 1 auto;text-align:left;font-size:14px;font-weight:600;color:#2C2C2A;letter-spacing:.05em}
  .wxgo{flex:0 0 auto;font-size:12px;font-weight:600;color:#fff;background:#07C160;border-radius:999px;
    padding:5px 13px;line-height:1.35;letter-spacing:.05em}
  .wxsub{margin:8px 2px 0;font-size:11.5px;line-height:1.6;color:#639777;text-align:left;letter-spacing:.01em;
    text-wrap:balance}
  .wxsub b{color:#0E9C55;font-weight:600}

  /* ---------- 新纪录贴纸 ---------- */
  #sticker{position:absolute;right:calc(14px + env(safe-area-inset-right));
    top:calc(18px + env(safe-area-inset-top));width:92px;height:auto;display:block;z-index:2;
    opacity:0;transform:scale(.6) rotate(-10deg);transform-origin:60% 88%;
    transition:opacity .22s ease,transform .42s cubic-bezier(.2,1.5,.45,1);pointer-events:none}
  #sticker.on{opacity:1;transform:scale(1) rotate(-10deg)}
  @media (prefers-reduced-motion:reduce){
    #sticker{transition:opacity .22s ease}
    #sticker.on{transform:rotate(-10deg)}
  }

  /* ---------- 矮屏（iPhone SE / 小屏安卓）紧凑排版，尽量一屏放完 ---------- */
  @media (max-height:660px){
    .screen{padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    .title{font-size:27px}
    .subtitle{font-size:12.5px;margin-top:6px}
    .card{margin-top:14px;padding:13px 17px}
    .row{padding:5px 0;font-size:13.5px}
    .btn{height:52px;margin-top:10px;font-size:17px}
    .tips{margin-top:11px;font-size:12.5px;line-height:1.6}
    .wxbox{margin-top:10px;padding:9px 11px 8px}
    .wxsub{margin-top:6px;font-size:11px}
    .picks{margin-top:14px}
    .pick{padding:11px 7px 10px}
    .pick .pimg{height:78px}
    .pick .pimg img{max-height:74px}
    .big{font-size:52px}
    #sticker{width:76px}
  }
</style>

<!-- 果叽访问统计 · Umami（匿名、无 cookie、不记录个人信息） -->

<script>
(function () {
  var t0 = Date.now(), sent = false;
  var slug = (location.pathname.split('/').pop() || 'index').replace(/\.html$/, '') || 'index';

  window.guojiTrack = function (name, data) {
    try { if (window.umami && window.umami.track) window.umami.track(name, data || {}); } catch (e) {}
  };

  function leave() {
    if (sent) return;
    sent = true;
    window.guojiTrack('stay', { page: slug, seconds: Math.round((Date.now() - t0) / 1000) });
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') leave();
  });
  window.addEventListener('pagehide', leave);
})();
</script>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="best">最高 0</div>
  <div id="combo"></div>
</div>

<button class="iconbtn" id="pauseBtn" aria-label="暂停">❚❚</button>
<button class="iconbtn" id="muteBtn" aria-label="音效开关">♪</button>
<div id="hint"></div>
<div class="badge" id="badge">按住蓄力 · 松手起跳</div>

<div class="screen on" id="scTitle">
  <div class="scwrap">
  <div class="title">果叽跳一跳</div>
  <div class="subtitle">按住屏幕蓄力，松手让角色跳到下一个平台</div>
  <div class="card">
    <div class="row"><span><span class="dot"></span>按得越久，跳得越远</span><b>140 – 560</b></div>
    <div class="row"><span><span class="dot"></span>最长蓄力 0.9 秒</span><b>0 – 900 ms</b></div>
    <div class="row"><span><span class="dot"></span>落进平台中心完美区</span><b>+2 并连击</b></div>
    <div class="row"><span><span class="dot"></span>落在平台外即坠落</span><b>本局结束</b></div>
    <div class="row"><span>历史最高</span><b id="bestTitle">0</b></div>
  </div>
  <button class="btn p" id="btnStart">开始游戏</button>
  <div class="tips">
    <b>操作：</b>按住任意位置蓄力，松手起跳（也支持空格键）。<br>
    <b>目标：</b>落到下一个平台顶面即得分，越靠中心分越高。
  </div>
  <div class="wxbox">
    <div class="wxbar">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
        <circle cx="10.4" cy="10.4" r="6.6" stroke="#07C160" stroke-width="2.2"/>
        <path d="M15.4 15.4 20.8 20.8" stroke="#07C160" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="wxname">麦次元</span>
      <span class="wxgo">搜索</span>
    </div>
    <p class="wxsub">微信搜索公众号 <b>麦次元</b>，解锁更多可爱的果叽糖蛋</p>
  </div>
  </div>
</div>

<div class="screen" id="scOver">
  <div class="scwrap">
  <img id="sticker" alt="" aria-hidden="true">
  <div class="subtitle" style="margin:0 0 10px">本局得分</div>
  <div class="big" id="finalScore">0</div>
  <div class="newrec" id="newRec"></div>
  <div class="card" style="margin-top:18px">
    <div class="row"><span>历史最高</span><b id="bestOver">0</b></div>
    <div class="row"><span>最高连击</span><b id="bestCombo">0</b></div>
    <div class="row"><span>完美落点</span><b id="perfectCnt">0</b></div>
  </div>
  <button class="btn p" id="btnAgain">再来一局</button>
  <button class="btn ghost" id="btnChangeOver">换个角色</button>
  <div class="wxbox">
    <div class="wxbar">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true">
        <circle cx="10.4" cy="10.4" r="6.6" stroke="#07C160" stroke-width="2.2"/>
        <path d="M15.4 15.4 20.8 20.8" stroke="#07C160" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="wxname">麦次元</span>
      <span class="wxgo">搜索</span>
    </div>
    <p class="wxsub">微信搜索公众号 <b>麦次元</b>，解锁更多可爱的果叽糖蛋</p>
  </div>
  </div>
</div>

<div class="screen" id="scPause">
  <div class="scwrap">
  <div class="title" style="font-size:26px">已暂停</div>
  <button class="btn p" id="btnResume">继续游戏</button>
  <button class="btn s" id="btnRestart">重新开始</button>
  <button class="btn s" id="btnChangePause">换个角色</button>
  <button class="btn ghost" id="btnQuit">返回标题</button>
  </div>
</div>

<div class="screen" id="scSelect">
  <div class="scwrap">
  <div class="title" style="font-size:26px">选个角色</div>
  <div class="subtitle">按住蓄力，松手起跳</div>
  <div class="picks" id="picks">
    <button class="pick sel" data-char="guoji" type="button">
      <span class="pimg"><img id="imgPickGuoji" alt="果叽"></span>
      <strong>果叽</strong>
      <em>经典款</em>
      <i class="tag">已选中</i>
    </button>
    <button class="pick" data-char="egg" type="button">
      <span class="pimg"><img id="imgPickEgg" alt="糖蛋"></span>
      <strong>糖蛋</strong>
      <em>糖葫芦款</em>
      <i class="tag">已选中</i>
    </button>
  </div>
  <button class="btn p" id="btnGo">出发</button>
  <button class="btn ghost" id="btnPickBack">返回标题</button>
  </div>
</div>

  CHAR_W: 120,             /* 角色显示宽度 */
  MIN_EDGE_GAP: 50,        /* 两块平台顶面之间的最小净距，防止重叠 */
  /* 难度曲线：分数段 -> 平台边缘净距区间 / 顶面宽度
     注意「间距」以边缘净距定义，而不是中心距：低分段中心距小于两块半宽之和会
     导致平台互相重叠（原规格以中心距给出的 160 是错的，此处已修正）。 */
  TABLE: [
    { s: 0,   egmin: 60,  egmax: 170, w: 190 },
    { s: 10,  egmin: 70,  egmax: 190, w: 175 },
    { s: 25,  egmin: 80,  egmax: 205, w: 160 },
    { s: 50,  egmin: 90,  egmax: 230, w: 145 },
    { s: 80,  egmin: 110, egmax: 300, w: 130 },
    { s: 120, egmin: 130, egmax: 340, w: 115 }
  ]
};

function charScale() { return CFG.CHAR_W / CFG.CELL_W; }

function bracket(score) {
  var b = CFG.TABLE[0];
  for (var i = 0; i < CFG.TABLE.length; i++) { if (score >= CFG.TABLE[i].s) { b = CFG.TABLE[i]; } }
  return b;
}

/* mulberry32：带种子的确定性伪随机，保证同种子同结果（规格 §4.3） */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 蓄力时长 -> 跳跃距离：严格线性（规格 §3.2） */
function distFromCharge(ms) {
  var u = ms / CFG.T_MAX;
  if (u < 0) { u = 0; } if (u > 1) { u = 1; }
  return CFG.D_MIN + (CFG.D_MAX - CFG.D_MIN) * u;
}
function chargeOfDist(D) {
  return (D - CFG.D_MIN) / (CFG.D_MAX - CFG.D_MIN) * CFG.T_MAX;
}
function flightDuration(D) {
  var u = (D - CFG.D_MIN) / (CFG.D_MAX - CFG.D_MIN);
  if (u < 0) { u = 0; } if (u > 1) { u = 1; }
  return CFG.FLIGHT_MIN + (CFG.FLIGHT_MAX - CFG.FLIGHT_MIN) * u;
}
function apexHeight(D) {
  var u = (D - CFG.D_MIN) / (CFG.D_MAX - CFG.D_MIN);
  if (u < 0) { u = 0; } if (u > 1) { u = 1; }
  return CFG.APEX_MIN + (CFG.APEX_MAX - CFG.APEX_MIN) * u;
}
function spinDegrees(D) {
  var u = (D - CFG.D_MIN) / (CFG.D_MAX - CFG.D_MIN);
  if (u < 0) { u = 0; } if (u > 1) { u = 1; }
  return CFG.SPIN_MAX * u;
}
/* 轨迹解算：p 为飞行进度 0..1 */
function flightAt(x0, dir, D, H, p) {
  return {
    x: x0 + dir * D * p,
    y: -4 * H * p * (1 - p)      /* 相对平台顶面的高度偏移，负值向上 */
  };
}

/* 生成下一个平台。间距以「角色实际站位 + 当前平台边缘」为基准，
   同时满足：物理可达（不超过 D_MAX 的 95%）与不重叠（净距不小于 MIN_EDGE_GAP）。
   方向固定向前：若允许左右双向，新平台会落到已走过的旧平台上方形成重叠
   （实测出现两块中心相距 8px、宽度 190px 的平台相互压盖），画面也被污染。 */
function solveReq(prng, dir, b, charX, curCx, curW, newW, cap) {
  /* 角色到「当前平台朝向 dir 那一侧边缘」的距离 */
  var edgeDist = dir * (curCx + dir * curW / 2 - charX);
  if (edgeDist < 0) { edgeDist = 0; }          /* 角色恰在边缘外时不取负值 */
  var lo = edgeDist + b.egmin + newW / 2;
  var hi = edgeDist + b.egmax + newW / 2;
  if (lo > cap) { return null; }                /* 该方向不可达 */
  if (hi > cap) { hi = cap; }
  return lo + (hi - lo) * prng();
}

function genPlatform(prng, score, charX, curCx, curW) {
  var b = bracket(score);
  var cap = CFG.D_MAX * CFG.REACH_RATIO;
  prng();                                       /* 保留一次抽取，使种子序列与设计一致 */
  var dir = 1;
  var req = solveReq(prng, dir, b, charX, curCx, curW, b.w, cap);
  if (req === null) {
    /* 兜底：贴到净距下限并夹到可达上限（正常数值下不会走到这里） */
    var edgeDist2 = Math.max(0, curCx + curW / 2 - charX);
    req = Math.min(cap, edgeDist2 + b.egmin + b.w / 2 + CFG.MIN_EDGE_GAP);
  }
  return { cx: charX + dir * req, w: b.w, dir: dir, req: req };
}

/* 落点判定（规格 §5.1） */
function judge(landX, target) {
  var d = Math.abs(landX - target.cx);
  if (d <= CFG.PERFECT) { return { ok: true, perfect: true, d: d }; }
  if (d <= target.w / 2) { return { ok: true, perfect: false, d: d }; }
  return { ok: false, perfect: false, d: d };
}

/* 计分（规格 §6.1） */
function scoreFor(perfect, combo) {
  if (!perfect) { return { gain: 1, combo: 0 }; }
  var c = combo + 1;
  return { gain: 2 + Math.min(c - 1, CFG.COMBO_CAP), combo: c };
}

/* 相机取景：把「当前平台 + 下一个平台」整体框进画面（规格 §3.5，本版改为双向取景） */
function cameraTarget(curCx, curW, nextCx, nextW, viewW, pad) {
  var left = Math.min(curCx - curW / 2, nextCx - nextW / 2);
  var right = Math.max(curCx + curW / 2, nextCx + nextW / 2);
  var lo = right + pad - viewW;
  var hi = left - pad;
  if (lo <= hi) { return (lo + hi) / 2; }
  return lo;   /* 放不下时优先保证目标平台完整可见 */
}
/*=== CORE_LOGIC_END===*/


/* ---------- 音频：全部用 WebAudio 现场合成，不依赖任何音频文件 ---------- */
var Sound = {
  ctx: null, co: null, cg: null, muted: false,
  ensure: function () {
    if (!this.ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { this.ctx = new AC(); } catch (e) { this.ctx = null; } }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      try { var pr = this.ctx.resume(); if (pr && pr.catch) { pr.catch(function () {}); } } catch (e) {}
    }
    return this.ctx;
  },
  tone: function (freq, dur, type, vol, slideTo, delay) {
    if (this.muted) { return; }
    var c = this.ensure(); if (!c) { return; }
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) { o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur); }
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  },
  chargeStart: function () {
    if (this.muted) { return; }
    var c = this.ensure(); if (!c || this.co) { return; }
    var o = c.createOscillator(), g = c.createGain();
    o.type = 'triangle'; o.frequency.value = 200;
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.11, c.currentTime + 0.05);
    o.connect(g); g.connect(c.destination); o.start();
    this.co = o; this.cg = g;
  },
  chargePitch: function (u) {
    if (!this.co || !this.ctx) { return; }
    this.co.frequency.setTargetAtTime(200 + 700 * u, this.ctx.currentTime, 0.015);
  },
  chargeStop: function () {
    if (!this.co || !this.ctx) { return; }
    var c = this.ctx, g = this.cg, o = this.co, now = c.currentTime;
    this.co = null; this.cg = null;
    try {
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.06);
      o.stop(now + 0.09);
    } catch (e) {}
  },
  jump: function () { this.tone(520, 0.12, 'square', 0.09, 940); },
  land: function () { this.tone(190, 0.15, 'sine', 0.2, 88); },
  perfect: function (combo) {
    var semi = Math.min(Math.max(combo - 1, 0), 7);
    var f = 784 * Math.pow(2, semi / 12);
    this.tone(f, 0.22, 'sine', 0.18);
    this.tone(f * 1.5, 0.16, 'sine', 0.07, null, 0.02);
  },
  fall: function () { this.tone(430, 0.5, 'sawtooth', 0.11, 70); },
  record: function () {
    var self = this;
    [523, 659, 784, 1046].forEach(function (f, i) { self.tone(f, 0.18, 'sine', 0.15, null, i * 0.09); });
  }
};

/* ---------- 本地存档：file:// 下 localStorage 可能被禁用，降级为内存 ---------- */

  mem: {},
  get: function (k, d) {
    try { var v = window.localStorage.getItem(k); return v === null ? d : v; }
    catch (e) { return (k in this.mem) ? this.mem[k] : d; }
  },
  set: function (k, v) {

  }
};

function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  /* 先按宽度铺满；若画面过高（竖屏手机）则放宽到最少 1100 设计高度 */
  var scale = Math.min(vw / CFG.DW, vh / 1100);
  var H = vh / scale;
  if (H > 1700) { scale = vh / 1700; H = 1700; }
  var W = Math.min(vw / scale, 900);
  var offX = (vw / scale - W) / 2;
  G.scale = scale; G.W = W; G.H = H; G.offX = offX;
  /* 平台顶面高度：始终让「上方天空」与「下方柱体+坠落空间」保持固定比例，
     矮屏/宽屏都不会出现大片空白或平台贴底。 */
  G.topY = Math.round(G.H - Math.max(330, G.H * 0.32));
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * scale * offX, 0);
}

function startRun() {

  G.jump = null; G.restT = 0; G.fallT = 0; G.shake = 0;
  G.camY = 0; G.camYTarget = 0;
  G.seed = (Date.now() ^ (G.runCount * 7919)) >>> 0;
  G.prng = mulberry32(G.seed);
  var first = { cx: Math.round(G.W / 2), w: bracket(0).w, dir: 1, req: 0,
                shape: 'round', col: PALETTE[0], sink: 0, sinkV: 0 };
  G.plats = [first];
  G.cur = 0;
  G.charX = first.cx; G.charY = G.topY;
  G.next = genPlatform(G.prng, 0, G.charX, first.cx, first.w);
  G.next.shape = SHAPES[Math.floor(G.prng() * SHAPES.length)];
  G.next.col = PALETTE[0]; G.next.sink = 0; G.next.sinkV = 0;
  G.plats.push(G.next);
  G.camX = cameraTarget(G.plats[0].cx, G.plats[0].w, G.next.cx, G.next.w, G.W, 40);

      p = G.state === 'PAUSED', s = G.state === 'SELECT';

  document.getElementById('scTitle').classList.toggle('on', t);
  document.getElementById('scOver').classList.toggle('on', o);
  document.getElementById('scPause').classList.toggle('on', p);
  document.getElementById('scSelect').classList.toggle('on', s);
  document.getElementById('hud').style.opacity = hide ? '0' : '1';
  document.getElementById('badge').style.opacity = (G.state === 'IDLE' && G.runCount < 3) ? '1' : '0';

function currentCell() {
  /* 新角色「糖蛋」：12 帧原生摇摆动画，按 80 ms 循环播放；
     蓄力 / 腾空 / 落地这些姿态交给 charTransform() 的程序化形变处理。 */
  if (G.char === 'egg') { return Math.floor(performance.now() / 80) % 12; }
  /* 图集 v2：10 帧，全部为「完好接地帧」，已统一底边对齐到格内接地线 y=180。
     槽位：0-5 由舒展到压扁的待机循环；6 蓄力中段；7 落地深压；8 蓄力到底；9 起跳瞬间。
     注意：v1 的腾空帧（源帧 5-14）头部被裁切窗口削平 51 行，已全部弃用，
     空中位移改由程序化轨迹负责（见 charTransform / flightAt）。 */
  var F = [0, 1, 2, 3, 4, 5, 4, 3, 2, 1];
  var t = performance.now();
  if (G.state === 'CHARGING') {
    var u = G.chargeMs / CFG.T_MAX;
    if (u < 0.34) { return 4; }
    if (u < 0.67) { return 6; }
    return 8;
  }
  if (G.state === 'JUMPING') {
    var p = G.jump ? Math.min(1, G.jumpT / G.jump.Tf) : 0;
    return p < 0.12 ? 9 : 2;                 /* 起跳一瞬压扁，随后舒展 */
  }
  if (G.state === 'FALLING') { return 2; }
  if (G.state === 'REST') {
    var q = G.restT / 180;
    if (q < 0.35) { return 7; }              /* 落地深压 */
    if (q < 0.80) { return 3; }
    return 0;
  }
  return F[Math.floor(t / 110) % F.length];
}

function charTransform() {
  var sx = 1, sy = 1, rot = 0, alpha = 1, anchorFoot = true;
  if (G.state === 'CHARGING') {
    var u = G.chargeMs / CFG.T_MAX;
    sy = 1 - 0.28 * u; sx = 1 + 0.22 * u;
  } else if (G.state === 'JUMPING') {
    var p = G.jump ? Math.min(1, G.jumpT / G.jump.Tf) : 0;
    sy = 1 + 0.08 * Math.sin(Math.PI * p);
    sx = 1 - 0.04 * Math.sin(Math.PI * p);
    rot = (G.jump ? G.jump.spin : 0) * Math.PI / 180 * p;
    anchorFoot = false;
  } else if (G.state === 'REST') {
    var q = G.restT / 180;
    sy = q < 0.33 ? 0.85 : (q < 0.78 ? 1.08 : 1.0);
    sx = 2 - sy;
  } else if (G.state === 'FALLING') {
    var f = Math.min(1, G.fallT / 1200);
    rot = G.fallRot + f * 540 * Math.PI / 180;
    var s = 1 - 0.4 * f;
    sx = s; sy = s; alpha = 1 - 0.8 * f;
    anchorFoot = false;
  }
  return { sx: sx, sy: sy, rot: rot, alpha: alpha, anchorFoot: anchorFoot };
}

function burst(x, y, n, color) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 190;
    G.particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
                       life: 0, max: 0.5 + Math.random() * 0.45, c: color, r: 2 + Math.random() * 3 });
  }
}
function floatText(x, y, text, color) {

}

function press() {
  /* 允许在站稳动画进行到 90ms 后立刻接续下一次蓄力，避免"手感发涩" */
  if (G.state === 'REST' && G.restT >= 90) { afterRest(); }

  Sound.ensure();

function release() {
  if (G.state !== 'CHARGING') { return; }
  var held = G.chargeMs;
  Sound.chargeStop();
  var D = distFromCharge(held);
  var need = G.next.cx - G.charX;
  var dir = need >= 0 ? 1 : -1;
  G.jump = { x0: G.charX, dir: dir, D: D, H: apexHeight(D), Tf: flightDuration(D), spin: spinDegrees(D) };
  G.jumpT = 0;
  /* 平台回弹、角色回到顶面：保证起跳瞬间坐标连续，不出现位置跳变 */
  G.plats[G.cur].sink = 0;
  G.charY = G.topY;
  G.state = 'JUMPING';
  Sound.jump();
  syncScreens();
}

function land(landX) {
  var tgt = G.next;
  var r = judge(landX, tgt);
  G.charX = landX; G.charY = G.topY;
  if (r.ok) {
    var sc = scoreFor(r.perfect, G.combo);
    G.score += sc.gain; G.combo = sc.combo;
    if (G.combo > G.bestCombo) { G.bestCombo = G.combo; }
    if (r.perfect) { G.perfectCnt++; }
    G.plats[G.cur].sink = 0;
    G.shake = r.perfect ? 6 : 3;
    if (r.perfect) {
      Sound.perfect(G.combo);
      burst(tgt.cx, G.topY - 6, 16, '#EF9F27');
      floatText(tgt.cx, G.topY - 130, '完美 +' + sc.gain, '#BA7517');
    } else {
      Sound.land();
      burst(landX, G.topY - 4, 7, '#B4B2A9');
    }
    G.state = 'REST'; G.restT = 0;
  } else {
    Sound.fall();
    G.fallX = landX; G.fallY = G.topY; G.fallT = 0; G.fallRot = 0;
    G.state = 'FALLING';
    G.shake = 9;
  }
  updateHUD();
  syncScreens();
}

function afterRest() {
  G.plats[G.cur].sink = 0;
  G.cur++;
  G.next = genPlatform(G.prng, G.score, G.charX, G.plats[G.cur].cx, G.plats[G.cur].w);
  G.next.shape = SHAPES[Math.floor(G.prng() * SHAPES.length)];
  G.next.col = PALETTE[Math.floor(G.score / 20) % PALETTE.length];
  G.next.sink = 0; G.next.sinkV = 0;
  G.plats.push(G.next);
  while (G.plats.length > 6) { G.plats.shift(); G.cur--; }
  G.camTarget = cameraTarget(G.plats[G.cur].cx, G.plats[G.cur].w, G.next.cx, G.next.w, G.W, 40);
  G.camYTarget = 0;
  G.state = 'IDLE';
  updateHUD(); syncScreens();
}

var last = 0;
function frame(now) {
  var dt = Math.min(50, now - (last || now)); last = now;
  update(dt, now);
  render(now);
  requestAnimationFrame(frame);
}

function update(dt, now) {
  /* 相机 */
  var k = 1 - Math.pow(0.82, dt / 16.667);
  G.camX += (G.camTarget - G.camX) * k;
  G.camY += (G.camYTarget - G.camY) * k;
  if (G.shake > 0) { G.shake = Math.max(0, G.shake - dt * 0.05); }

  var i;
  for (i = 0; i < G.plats.length; i++) {
    var p = G.plats[i];
    if (p.sink && p.sink > 0 && !(G.state === 'CHARGING' && p === G.plats[G.cur])) {
      p.sink = Math.max(0, p.sink - dt * 0.06);
    }
  }

  if (G.state === 'CHARGING') {
    G.chargeMs = Math.min(CFG.T_MAX, G.chargeMs + dt);
    var u = G.chargeMs / CFG.T_MAX;
    G.plats[G.cur].sink = 6 * u;
    G.charY = G.topY + G.plats[G.cur].sink;
    Sound.chargePitch(u);
  } else if (G.state === 'JUMPING') {
    G.jumpT += dt;
    var p = Math.min(1, G.jumpT / G.jump.Tf);
    var pos = flightAt(G.jump.x0, G.jump.dir, G.jump.D, G.jump.H, p);
    G.charX = pos.x; G.charY = G.topY + pos.y;
    if (p >= 1) {
      var lx = G.jump.x0 + G.jump.dir * G.jump.D;
      land(lx);
    }
  } else if (G.state === 'REST') {
    G.restT += dt;
    var rp = G.plats[G.cur];
    if (rp) { G.charY = G.topY + rp.sink; }
    if (G.restT >= 180) { afterRest(); }
  } else if (G.state === 'FALLING') {
    G.fallT += dt;
    var f = Math.min(1, G.fallT / 1200);
    G.charX = G.fallX;
    G.charY = G.fallY + 520 * f * f;
    G.camYTarget = 80 * f;
    if (G.fallT >= 1200) { showOver(); }
  } else if (G.state === 'IDLE' || G.state === 'TITLE' || G.state === 'GAMEOVER') {
    var cp = G.plats[G.cur];
    if (cp) { G.charY = G.topY + (cp.sink || 0); }
  }

  for (i = G.particles.length - 1; i >= 0; i--) {
    var q = G.particles[i];
    q.life += dt / 1000;
    q.x += q.vx * dt / 1000; q.y += q.vy * dt / 1000;
    q.vy += 620 * dt / 1000;
    if (q.life >= q.max) { G.particles.splice(i, 1); }
  }
  for (i = G.floats.length - 1; i >= 0; i--) {
    var fl = G.floats[i];
    fl.life += dt / 1000;
    if (fl.life >= fl.max) { G.floats.splice(i, 1); }
  }
}

/* ---------- 渲染 ---------- */
function roundRect(x, y, w, h, r) {
  var rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.arcTo(x + w, y, x + w, y + rr, rr);
  ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h);
  ctx.lineTo(x, y + rr); ctx.arcTo(x, y, x + rr, y, rr);
  ctx.closePath();
}

/* 背景绘制在「屏幕空间」，横向按 G.offX 外扩以铺满宽屏 */
function drawBg() {
  var x0 = -G.offX - 4, w0 = G.W + G.offX * 2 + 8;
  var g = ctx.createLinearGradient(0, 0, 0, G.H);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.55, '#F4F6FD'); g.addColorStop(1, '#E8ECF9');
  ctx.fillStyle = g;
  ctx.fillRect(x0, -4, w0, G.H + 8);
  var span = G.W + 400;
  var clouds = [[120, 200, 90], [520, 330, 70], [860, 160, 110], [-140, 420, 80], [1240, 380, 95]];
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var x = c[0] - G.camX * 0.25;
    x = ((x + 200) % span + span) % span - 200;
    var r = c[2];
    ctx.beginPath();
    ctx.arc(x, c[1] - G.camY * 0.15, r * 0.55, 0, Math.PI * 2);
    ctx.arc(x + r * 0.5, c[1] - r * 0.18 - G.camY * 0.15, r * 0.4, 0, Math.PI * 2);
    ctx.arc(x - r * 0.52, c[1] + r * 0.1 - G.camY * 0.15, r * 0.38, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlatform(p) {
  if (!p) { return; }
  var topY = G.topY + p.sink;
  var x = p.cx - p.w / 2;
  var h = G.H - topY + 60;
  ctx.lineWidth = 2;
  ctx.strokeStyle = p.col.line;
  ctx.fillStyle = p.col.body;
  if (p.shape === 'cylinder') {
    var ry = p.w * 0.17;
    ctx.beginPath();
    ctx.moveTo(x, topY); ctx.lineTo(x, G.H + 60);
    ctx.lineTo(x + p.w, G.H + 60); ctx.lineTo(x + p.w, topY);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(p.cx, topY, p.w / 2, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = p.col.top; ctx.fill(); ctx.stroke();
  } else if (p.shape === 'sharp') {
    ctx.beginPath(); ctx.rect(x, topY, p.w, h); ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.col.top; ctx.fillRect(x + 1, topY + 1, p.w - 2, 16);
  } else {
    roundRect(x, topY, p.w, h, 16); ctx.fill(); ctx.stroke();
    ctx.save();
    roundRect(x, topY, p.w, 40, 16); ctx.clip();
    ctx.fillStyle = p.col.top; ctx.fillRect(x, topY, p.w, 40);
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(x + 10, topY + 21); ctx.lineTo(x + p.w - 10, topY + 21);
    ctx.stroke();
  }
  /* 完美带：仅新手前 3 局显示，正式对局隐藏（保留"凭感觉"的乐趣） */
  if (G.runCount < 3 && p === G.next) {
    ctx.save();
    ctx.fillStyle = 'rgba(239,159,39,.85)';
    ctx.fillRect(p.cx - CFG.PERFECT, topY + 1, CFG.PERFECT * 2, 10);
    ctx.restore();
  }
}

function drawChar(now) {
  var tf = charTransform();
  var C = curChar();
  var src = C.el;
  var cs = C.charW / C.cellW;
  var dw = C.cellW * cs, dh = C.cellH * cs;
  var groundOff = C.ground * cs;                /* 接地线距精灵顶部 */
  var BODY = C.body;                             /* 身体中心距接地线 */
  var cell = currentCell();
  var col = cell % C.cols, row = Math.floor(cell / C.cols);
  var sx0 = C.gap + col * (C.cellW + C.gap);
  var sy0 = C.gap + row * (C.cellH + C.gap);

  ctx.save();
  ctx.globalAlpha = tf.alpha;
  if (tf.anchorFoot) { ctx.translate(G.charX, G.charY); }
  else { ctx.translate(G.charX, G.charY - BODY); }
  if (tf.rot) { ctx.rotate(tf.rot); }
  ctx.scale(tf.sx, tf.sy);
  var dy = tf.anchorFoot ? -groundOff : -(groundOff - BODY);
  if (C.ready && src && src.naturalWidth) {
    ctx.drawImage(src, sx0, sy0, C.cellW, C.cellH, -dw / 2, dy, dw, dh);
  } else {
    /* 兜底：图集缺失时画一个同色系圆团，保证游戏仍可玩 */
    ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#333333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, dy + groundOff - 46, 48, 44, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFB8BD';
    ctx.beginPath(); ctx.ellipse(-17, dy + groundOff - 50, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(17, dy + groundOff - 50, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  /* 地面投影：只在实体平台上方绘制 */
  if (G.state !== 'FALLING' && G.state !== 'GAMEOVER') {
    var under = null;
    for (var i = 0; i < G.plats.length; i++) {
      var p = G.plats[i];
      if (G.charX >= p.cx - p.w / 2 - 6 && G.charX <= p.cx + p.w / 2 + 6) { under = p; }
    }
    if (under) {
      var hAbove = Math.max(0, G.topY - G.charY);
      var s = Math.max(0.42, 1 - hAbove / 620);
      ctx.save();
      ctx.globalAlpha = 0.22 * s;
      ctx.fillStyle = '#7A81A8';
      ctx.beginPath();
      ctx.ellipse(G.charX, G.topY + under.sink + 3, 46 * s, 11 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawChargeRing(now) {
  if (G.state !== 'CHARGING' || G.runCount >= 3) { return; }
  var u = G.chargeMs / CFG.T_MAX;
  var cx = G.charX, cy = G.charY;
  var R = 76;
  ctx.save();
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(83,74,183,.16)';
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = u > 0.9 ? '#A32D2D' : (u > 0.6 ? '#BA7517' : '#534AB7');
  ctx.beginPath();
  ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * u);
  ctx.stroke();
  /* 目标距离参考线（仅新手期） */
  ctx.strokeStyle = 'rgba(83,74,183,.35)';
  ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(cx, G.topY + 56); ctx.lineTo(cx + (G.next.cx - cx), G.topY + 56);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function render(now) {
  var sx = 0, sy = 0;
  if (G.shake > 0) { sx = (Math.random() - 0.5) * G.shake; sy = (Math.random() - 0.5) * G.shake; }

  /* 1) 背景：屏幕空间 + 抖动 */
  ctx.save();
  ctx.translate(sx, sy);
  drawBg();
  ctx.restore();

  /* 2) 世界：相机变换 */
  ctx.save();
  ctx.translate(-G.camX + sx, -G.camY + sy);
  var i;
  for (i = 0; i < G.plats.length; i++) { drawPlatform(G.plats[i]); }
  if (G.state !== 'BOOT') { drawChar(now); }
  drawChargeRing(now);
  for (i = 0; i < G.particles.length; i++) {
    var q = G.particles[i];
    ctx.globalAlpha = Math.max(0, 1 - q.life / q.max);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (i = 0; i < G.floats.length; i++) {
    var f2 = G.floats[i];
    ctx.globalAlpha = Math.max(0, 1 - f2.life / f2.max);
    ctx.fillStyle = f2.c;
    ctx.font = '500 30px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f2.t, f2.x, f2.y - f2.life * 60);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 3) 前景：坠落时的深渊渐隐 */
  if (G.state === 'FALLING') {
    var top = G.topY + 200 - G.camY;
    var g = ctx.createLinearGradient(0, top, 0, G.H);
    g.addColorStop(0, 'rgba(232,236,249,0)');
    g.addColorStop(1, 'rgba(90,96,130,.55)');
    ctx.fillStyle = g;
    ctx.fillRect(-G.offX - 4, top, G.W + G.offX * 2 + 8, G.H - top + 4);
  }
}

/* ---------- 输入 ---------- */
var activePointer = null;
function onDown(e) {
  if (e.target && e.target.closest && e.target.closest('button')) { return; }
  if (G.state === 'TITLE' || G.state === 'GAMEOVER' ||
      G.state === 'PAUSED' || G.state === 'SELECT') { return; }
  if (activePointer !== null) { return; }
  activePointer = (e.pointerId !== undefined) ? e.pointerId : 'k';
  if (e.preventDefault) { e.preventDefault(); }
  press();
}
function onUp(e) {
  if (activePointer === null) { return; }
  if (e && e.pointerId !== undefined && e.pointerId !== activePointer) { return; }
  activePointer = null;
  release();
}
cv.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' && !e.repeat) { if (e.preventDefault) { e.preventDefault(); } onDown({ pointerId: 'k' }); }
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'Space') { if (e.preventDefault) { e.preventDefault(); } onUp({ pointerId: 'k' }); }
});
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('blur', function () { onUp({}); });
document.addEventListener('visibilitychange', function () {
  if (document.hidden && (G.state === 'IDLE' || G.state === 'CHARGING')) { togglePause(); }
});

function togglePause() {
  if (G.state === 'PAUSED') { G.state = G._prevState || 'IDLE'; syncScreens(); }
  else if (G.state === 'IDLE' || G.state === 'CHARGING') {
    if (G.state === 'CHARGING') { Sound.chargeStop(); }
    G._prevState = G.state;
    G.state = 'PAUSED'; activePointer = null; syncScreens();
  }
}

/* ---------- 角色选择：开始前先挑一个角色 ---------- */
function renderPick() {
  var ps = document.querySelectorAll('#picks .pick');
  for (var i = 0; i < ps.length; i++) {
    ps[i].classList.toggle('sel', ps[i].getAttribute('data-char') === G.char);
  }
}
function openSelect() {
  Sound.ensure();
  Sound.chargeStop();
  activePointer = null;
  var pe = document.getElementById('imgPickEgg');
  if (!pe.getAttribute('src')) { pe.src = 'data:image/gif;base64,' + EGG_GIF_B64; }
  bootScene();                 /* 先把画布恢复成干净的静态场景当背景 */
  G.state = 'SELECT';
  renderPick();
  syncScreens();
}
function backToTitle() {
  bootScene();
  G.state = 'TITLE';
  updateHUD();
  syncScreens();
}
document.getElementById('picks').addEventListener('click', function (e) {
  var b = e.target && e.target.closest ? e.target.closest('.pick') : null;
  if (!b) { return; }
  var id = b.getAttribute('data-char');
  if (!CHARS[id]) { return; }
  if (id !== G.char) {
    G.char = id;
    Store.set('gj_char', G.char);
    Sound.ensure();
    Sound.tone(660, 0.09, 'sine', 0.09, 940);
  }
  renderPick();
});

document.getElementById('btnGo').addEventListener('click', function () { Sound.ensure(); startRun(); });
document.getElementById('btnPickBack').addEventListener('click', backToTitle);
document.getElementById('btnStart').addEventListener('click', function () { openSelect(); });
document.getElementById('btnAgain').addEventListener('click', function () { startRun(); });
document.getElementById('btnResume').addEventListener('click', function () { togglePause(); });
document.getElementById('btnRestart').addEventListener('click', function () { startRun(); });
document.getElementById('btnChangeOver').addEventListener('click', function () { openSelect(); });
document.getElementById('btnChangePause').addEventListener('click', function () { openSelect(); });
document.getElementById('btnQuit').addEventListener('click', backToTitle);
document.getElementById('pauseBtn').addEventListener('click', function () { togglePause(); });
document.getElementById('muteBtn').addEventListener('click', function () {
  Sound.muted = !Sound.muted;
  if (Sound.muted) { Sound.chargeStop(); }
  Store.set('gj_muted', Sound.muted ? '1' : '0');
  document.getElementById('muteBtn').textContent = Sound.muted ? '✕' : '♪';
});

/* ---------- 启动 ---------- */
saves();
Sound.muted = Store.get('gj_muted', '0') === '1';
document.getElementById('muteBtn').textContent = Sound.muted ? '✕' : '♪';
document.getElementById('imgPickGuoji').src = 'data:image/png;base64,' + GUOJI_PNG_B64;
resize();

/* 标题页的静态场景（同时作为画布背景），窗口尺寸变化时重建 */
function bootScene() {
  var keep = G.state;
  G.prng = mulberry32(20260915);
  var f = { cx: Math.round(G.W / 2), w: 190, shape: 'round', col: PALETTE[0], sink: 0 };
  G.plats = [f];
  G.next = { cx: f.cx + 268, w: 175, shape: 'cylinder', col: PALETTE[1], sink: 0 };
  G.plats.push(G.next);
  G.cur = 0;
  G.charX = f.cx; G.charY = G.topY;
  G.camX = cameraTarget(f.cx, f.w, G.next.cx, G.next.w, G.W, 40);
  G.camTarget = G.camX;
  G.camY = 0; G.camYTarget = 0;
  G.particles = []; G.floats = []; G.shake = 0;
  G.chargeMs = 0; G.chargeT = 0; G.jump = null; G.restT = 0; G.fallT = 0;
  if (keep === 'TITLE') { G.state = 'TITLE'; }
}
window.addEventListener('resize', function () {
  var wasTitle = (G.state === 'TITLE');
  resize();
  if (wasTitle) { bootScene(); }
});
bootScene();
G.state = 'TITLE';
updateHUD();
syncScreens();
requestAnimationFrame(frame);
</script>
</body>
