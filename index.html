<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(170deg,#e9f3ff 0%,#f6f0ff 46%,#fdf1f5 100%);
    background-attachment:fixed;
    color:#333;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:560px;margin:0 auto;padding:30px 18px 44px}
  header{text-align:center;margin-bottom:24px}
  .mascot{width:88px;height:88px;margin:0 auto 12px;display:grid;place-items:center}
  .mascot img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 8px 12px rgba(51,51,51,.13));
    animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){.mascot img{animation:none}}
  h1{font-size:27px;letter-spacing:.06em;margin:0 0 6px;font-weight:800}
  .sub{font-size:13px;color:#8b909d;margin:0;letter-spacing:.02em}
  main{margin-top:6px}
  .card{
    position:relative;display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid #eef1f6;border-radius:20px;
    padding:16px 16px 16px 15px;margin-bottom:14px;
    text-decoration:none;color:inherit;
    box-shadow:0 6px 18px rgba(51,51,51,.07);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .card:active{transform:scale(.985)}
  @media (hover:hover){
    .card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(51,51,51,.13)}
    .card:hover .go{transform:translateX(3px)}
  }
  .badge{
    position:absolute;top:11px;right:13px;
    font-size:11px;line-height:1;color:#b8718a;background:#ffeef3;
    padding:4px 9px;border-radius:999px;letter-spacing:.04em;
  }
  .ico{
    flex:0 0 64px;width:64px;height:64px;border-radius:17px;
    background:#f6f8fc;display:grid;place-items:center;overflow:hidden;
  }
  .ico img{width:56px;height:56px;object-fit:contain}
  .ico svg{width:40px;height:40px;display:block}
  .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .txt strong{font-size:17.5px;font-weight:700;letter-spacing:.02em}
  .txt em{font-style:normal;font-size:12.5px;line-height:1.5;color:#8b909d}
  .go{
    flex:0 0 auto;font-size:12.5px;font-weight:700;color:#e06a92;
    transition:transform .18s ease;padding-right:2px;
  }
  footer{text-align:center;font-size:12px;color:#a9aeb9;margin-top:28px;line-height:1.7}
  footer span{color:#d3b6c1}

  /* ---------- 麦次元公众号引导标签 ---------- */
  .mkt-tag{
    display:block;
    background:linear-gradient(180deg,#F5FCF7,#EAF7EF);
    border:1px solid #D7ECDC;border-radius:20px;
    padding:12px 12px 11px;margin:0 0 18px;
    box-shadow:0 6px 18px rgba(52,120,78,.09);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .mkt-tag:active{transform:scale(.99)}
  @media (hover:hover){ .mkt-tag:hover{box-shadow:0 14px 30px rgba(52,120,78,.16)} }
  .mkt-tag:focus-visible{outline:2px solid #34C86E;outline-offset:2px}

  .mkt-box{
    display:flex;align-items:center;gap:11px;
    background:#fff;border-radius:999px;padding:9px 9px 9px 15px;
    box-shadow:0 0 0 1px #E7F4EB, 0 2px 6px rgba(52,120,78,.08);
  }
  .mkt-ico{flex:0 0 auto;width:20px;height:20px;color:#22C55E;display:grid;place-items:center}
  .mkt-ico svg{width:100%;height:100%}
  .mkt-name{
    flex:0 1 auto;min-width:0;
    font-size:18px;font-weight:800;color:#2B3138;letter-spacing:.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .mkt-btn{
    flex:0 0 auto;
    font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.1em;
    padding:8px 19px;border-radius:999px;
    background:linear-gradient(180deg,#35CB70,#1FAF59);
    box-shadow:0 3px 8px rgba(31,175,89,.34), inset 0 -1px 0 rgba(0,0,0,.10);
  }
  .mkt-tip{
    display:block;margin:10px 3px 0;
    font-size:12.5px;line-height:1.5;color:#7E8C83;letter-spacing:.01em;
  }
  .mkt-tip b{color:#17A75A;font-weight:800}
  @media (max-width:430px){
    .mkt-box{gap:9px;padding-left:13px}
    .mkt-name{flex:1 1 auto;font-size:17px}
    .mkt-btn{font-size:13px;padding:8px 16px}
    .mkt-tip{margin-top:8px;font-size:12px}
  }

  .mkt-toast{
    position:fixed;left:50%;bottom:26px;z-index:99;
    transform:translate(-50%,16px);
    background:rgba(34,44,38,.93);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:.02em;
    padding:10px 18px;border-radius:999px;white-space:nowrap;
    box-shadow:0 10px 26px rgba(0,0,0,.22);
    opacity:0;pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;
  }
  .mkt-toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script>
/* 麦次元公众号引导标签：点一下复制公众号名，方便直接去微信粘贴搜索。
   只做轻交互 —— 不抢键盘焦点（tabindex=-1），不影响页面其它操作。 */
(function(){
  var tag = document.getElementById('mktTag');
  var toast = document.getElementById('mktToast');
  if (!tag) return;
  var NAME = '麦次元', timer = null;

  function tip(msg){
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(function(){ toast.classList.remove('on'); }, 2000);
  }
  function fallbackCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  tag.addEventListener('click', function(){
    var done = function(){ tip('已复制「' + NAME + '」，去微信搜索吧'); };
    var miss = function(){ tip('去微信搜索公众号「' + NAME + '」'); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(NAME).then(done, function(){
        fallbackCopy(NAME) ? done() : miss();
      });
    }else{
      fallbackCopy(NAME) ? done() : miss();
    }
  });
})();
</script>
