<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(170deg,#e9f3ff 0%,#f6f0ff 46%,#fdf1f5 100%);
    background-attachment:fixed;
    color:#333;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:560px;margin:0 auto;padding:30px 18px 44px}
  header{text-align:center;margin-bottom:24px}
  .mascot{width:88px;height:88px;margin:0 auto 12px;display:grid;place-items:center}
  .mascot img{width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 8px 12px rgba(51,51,51,.13));
    animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){.mascot img{animation:none}}
  h1{font-size:27px;letter-spacing:.06em;margin:0 0 6px;font-weight:800}
  .sub{font-size:13px;color:#8b909d;margin:0;letter-spacing:.02em}
  main{margin-top:6px}
  .card{
    position:relative;display:flex;align-items:center;gap:14px;
    background:#fff;border:1px solid #eef1f6;border-radius:20px;
    padding:16px 16px 16px 15px;margin-bottom:14px;
    text-decoration:none;color:inherit;
    box-shadow:0 6px 18px rgba(51,51,51,.07);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .card:active{transform:scale(.985)}
  @media (hover:hover){
    .card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(51,51,51,.13)}
    .card:hover .go{transform:translateX(3px)}
  }
  .badge{
    position:absolute;top:11px;right:13px;
    font-size:11px;line-height:1;color:#b8718a;background:#ffeef3;
    padding:4px 9px;border-radius:999px;letter-spacing:.04em;
  }
  .ico{
    flex:0 0 64px;width:64px;height:64px;border-radius:17px;
    background:#f6f8fc;display:grid;place-items:center;overflow:hidden;
  }
  .ico img{width:56px;height:56px;object-fit:contain}
  .ico svg{width:40px;height:40px;display:block}
  .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
  .txt strong{font-size:17.5px;font-weight:700;letter-spacing:.02em}
  .txt em{font-style:normal;font-size:12.5px;line-height:1.5;color:#8b909d}
  .go{
    flex:0 0 auto;font-size:12.5px;font-weight:700;color:#e06a92;
    transition:transform .18s ease;padding-right:2px;
  }
  footer{text-align:center;font-size:12px;color:#a9aeb9;margin-top:28px;line-height:1.7}
  footer span{color:#d3b6c1}
</style>
