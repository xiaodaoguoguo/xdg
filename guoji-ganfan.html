<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FDF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>果叽干饭 · 接住掉下来的食物</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%23fff' stroke='%23333' stroke-width='2.6'/%3E%3Cpath d='M11 12h.01M21 12h.01' stroke='%23333' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M16 23c3 0 5-2 5-4H11c0 2 2 4 5 4z' fill='%23F5808A'/%3E%3C/svg%3E">
<style>
  :root{
    --cream:#FDF6EE; --ink:#4A3B33; --ink2:#8C7A6E;
    --pink:#F5808A; --pink-l:#FBC9CE; --gold:#F5C33B;
    --card:#FFFFFF; --shadow:0 6px 18px rgba(120,90,70,.14);
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--cream);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-text-size-adjust:100%}
  #app{position:fixed;inset:0;overflow:hidden}
  #cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  /* ---------- HUD ---------- */
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 0 calc(var(--sal) + 10px);
    display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
  .pills{display:flex;flex-direction:column;gap:5px}
  .row{display:flex;gap:5px;align-items:center}
  .pill{background:var(--card);border-radius:999px;padding:5px 11px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:5px;line-height:1;font-weight:700;font-size:13px;white-space:nowrap}
  .pill .lbl{font-size:10px;color:var(--ink2);font-weight:600}
  .pill .val{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  #scoreVal{color:var(--pink)}
  #comboPill{background:linear-gradient(135deg,#FFE9A8,#FFD166);display:none}
  #comboPill .val{color:#8A5A12}
  #lifeBox{display:flex;gap:2px;align-items:center}
  #lifeBox img{width:20px;height:20px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}
  #lifeBox .dead{filter:grayscale(1) opacity(.28)}
  #rushPill{display:none;background:linear-gradient(135deg,#FFD37A,#FF9A5B)}
  #rushPill .val{color:#7A3608}
  .btn-ico{pointer-events:auto;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
    border:0;display:grid;place-items:center;font-size:16px;color:var(--ink);cursor:pointer;padding:0}
  .btn-ico:active{transform:scale(.94)}
  /* ---------- 遮罩层 ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:safe center;
    padding:calc(var(--sat) + 14px) 20px calc(var(--sab) + 14px);
    background:radial-gradient(120% 80% at 50% 12%,#FFFDFa 0%,#FDF3E7 60%,#F8E7D8 100%);
    text-align:center;gap:10px;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .screen.hide{display:none}
  .title{font-size:clamp(28px,8.4vw,42px);font-weight:900;letter-spacing:.06em;margin:0;
    color:#4A3B33;text-shadow:0 2px 0 #fff,0 5px 12px rgba(190,140,110,.28)}
  .title em{font-style:normal;color:var(--pink)}
  .sub{font-size:12.5px;color:var(--ink2);margin:0;line-height:1.7;font-weight:600}
  .hero{width:min(46vw,190px);height:auto;image-rendering:-webkit-optimize-contrast;filter:drop-shadow(0 8px 14px rgba(160,120,95,.22))}
  .over-img{width:min(38vw,150px);height:auto;filter:drop-shadow(0 6px 12px rgba(160,120,95,.2))}
  .cta{margin-top:2px;border:0;cursor:pointer;font-family:inherit;font-weight:900;color:#fff;
    background:linear-gradient(180deg,#FF9AA2,#F0697A);border-radius:999px;
    padding:14px 40px;font-size:18px;letter-spacing:.08em;
    box-shadow:0 6px 0 #D8546A,0 12px 22px rgba(216,84,106,.34)}
  .cta:active{transform:translateY(3px);box-shadow:0 3px 0 #D8546A,0 8px 16px rgba(216,84,106,.3)}
  .cta2{background:linear-gradient(180deg,#FFE7A8,#F5C33B);color:#7A5010;box-shadow:0 6px 0 #D9A423,0 12px 22px rgba(217,164,35,.3);
    padding:12px 30px;font-size:16px}
  .cta2:active{box-shadow:0 3px 0 #D9A423}
  .legend{background:rgba(255,255,255,.82);border-radius:16px;padding:11px 15px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:6px;max-width:min(88vw,360px);font-size:12.5px;line-height:1.5;text-align:left;font-weight:600;color:#5E4C40}
  .legend b{color:var(--pink)}
  .legend .k{display:inline-block;background:#FFF0E4;border-radius:6px;padding:1px 6px;margin-right:4px;font-size:11px;color:#96735A}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:2px}
  .stat{background:#fff;border-radius:14px;padding:9px 16px;box-shadow:var(--shadow);min-width:78px}
  .stat .n{font-size:23px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat .t{font-size:10.5px;color:var(--ink2);font-weight:700;letter-spacing:.06em}
  .stat.s1 .n{color:var(--pink)} .stat.s2 .n{color:#E0A020} .stat.s3 .n{color:#59A85E}
  .rowbtns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .tip{font-size:11px;color:#A8958A;font-weight:600}
  .newbest{font-size:12px;font-weight:900;color:#fff;background:linear-gradient(135deg,#FFB84D,#F5808A);
    border-radius:999px;padding:4px 14px;box-shadow:0 4px 10px rgba(245,128,138,.4)}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--cream);z-index:9;font-weight:800;color:var(--ink2)}
  #loading.hide{display:none}

  /* ---------- 横屏（矮屏）两栏布局 ----------
     竖屏用单列纵向 flex 居中即可；但手机横屏时高度只有 320~390px，
     单列内容（标题+图+说明卡+按钮）总有 480~500px，flex 居中会把标题顶到屏幕上方之外、
     按钮推到下方之外——而 overflow:hidden 会把它们直接吃掉（scrollHeight 还看不出来）。
     所以矮屏改成左右两栏 grid，把说明卡挪到右列，纵向压力减半。 */
  @media (orientation:landscape) and (max-height:600px){
    #scMenu:not(.hide){
      display:grid;
      grid-template-columns:minmax(0,auto) minmax(0,auto);
      grid-template-areas:"ttl legend" "hero legend" "cta legend" "tip legend";
      align-content:center;justify-content:center;align-items:center;justify-items:center;
      column-gap:min(3.4vw,30px);row-gap:6px;
      padding:calc(var(--sat) + 8px) calc(var(--sar) + 16px) calc(var(--sab) + 8px) calc(var(--sal) + 16px)}
    #scMenu .title{grid-area:ttl;font-size:clamp(19px,5.2vh,30px);margin:0}
    #scMenu .hero{grid-area:hero;width:min(22vh,120px)}
    #scMenu .cta{grid-area:cta;padding:10px 28px;font-size:16px;
      box-shadow:0 4px 0 #D8546A,0 8px 16px rgba(216,84,106,.28)}
    #scMenu .cta:active{box-shadow:0 2px 0 #D8546A,0 6px 12px rgba(216,84,106,.26)}
    #scMenu .tip{grid-area:tip;font-size:10.5px}
    #scMenu .legend{grid-area:legend;max-width:min(48vw,430px);max-height:calc(100vh - 28px);
      overflow-y:auto;font-size:11.5px;line-height:1.45;padding:9px 12px;gap:5px}
    #scMenu .legend .k{font-size:10px;padding:0 5px}

    #scPause:not(.hide),#scOver:not(.hide){
      display:grid;
      grid-template-columns:minmax(0,auto) minmax(0,auto);
      align-content:center;justify-content:center;align-items:center;justify-items:center;
      column-gap:min(4vw,34px);row-gap:5px;
      padding:calc(var(--sat) + 8px) calc(var(--sar) + 16px) calc(var(--sab) + 8px) calc(var(--sal) + 16px)}
    #scPause:not(.hide){grid-template-areas:"ttl stats" "img btns" "img tip"}
    #scOver:not(.hide){grid-template-areas:"ttl new" "img stats" "img btns" "img tip"}
    #scPause .title,#scOver .title{grid-area:ttl;font-size:clamp(18px,5vh,26px) !important;margin:0}
    #scPause .over-img,#scOver .over-img{grid-area:img;width:min(24vh,120px)}
    #scPause .stats,#scOver .stats{grid-area:stats;gap:8px}
    #scOver .newbest{grid-area:new}
    #scPause .rowbtns,#scOver .rowbtns{grid-area:btns;gap:8px}
    #scPause .tip,#scOver .tip{grid-area:tip;font-size:10.5px}
    .cta{padding:10px 26px;font-size:16px;box-shadow:0 4px 0 #D8546A,0 8px 16px rgba(216,84,106,.28)}
    .cta:active{box-shadow:0 2px 0 #D8546A}
    .cta2{padding:9px 22px;font-size:15px}
    .stat{padding:6px 13px;min-width:66px;border-radius:12px}
    .stat .n{font-size:19px}
    .stat .t{font-size:10px}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="pills">
      <div class="row">
        <div class="pill"><span class="lbl">分数</span><span class="val" id="scoreVal">0</span></div>
        <div class="pill" id="comboPill"><span class="val" id="comboVal">x1</span></div>
      </div>
      <div class="row">
        <div class="pill"><span class="lbl">最高</span><span class="val" id="bestVal" style="font-size:13px">0</span></div>
        <div class="pill" id="rushPill"><span class="val" id="rushVal">干饭冲刺 6s</span></div>
      </div>
    </div>
    <div class="row" style="align-items:center">
      <div class="pill" style="padding:5px 9px"><div id="lifeBox"></div></div>
      <button class="btn-ico" id="btnSound" aria-label="音效">🔊</button>
      <button class="btn-ico" id="btnPause" aria-label="暂停">❚❚</button>
    </div>
  </div>

  <div class="screen" id="scMenu">
    <h1 class="title">果叽<em>干饭</em></h1>
    <img class="hero" id="heroImg" alt="果叽">
    <div class="legend">
      <div><b>怎么玩</b>：手指按住屏幕左右拖动，带着盘子接住掉下来的食物。</div>
      <div><span class="k">连击</span>连续接住不断连，每 5 连分数倍率 +1（最高 x5）。</div>
      <div><span class="k">生命</span>漏接食物扣 1 颗心，每 15 连奖励 1 颗（最多 5 颗）。</div>
      <div><span class="k">寿司</span>接住「一整个果叽寿司」触发 <b>干饭冲刺</b>，6 秒内分数翻倍。</div>
    </div>
    <button class="cta" id="btnStart">开 始 干 饭</button>
    <div class="tip">有人陪吃饭，饭都变香啦 🍊</div>
  </div>

  <div class="screen hide" id="scPause">
    <h2 class="title" style="font-size:clamp(22px,6.6vw,32px)">先歇一口</h2>
    <img class="over-img" id="plainImg" alt="果叽">
    <div class="stats">
      <div class="stat s1"><div class="n" id="pScore">0</div><div class="t">当前分数</div></div>
      <div class="stat s3"><div class="n" id="pCombo">x1</div><div class="t">连击倍率</div></div>
    </div>
    <div class="rowbtns">
      <button class="cta" id="btnResume">继续干饭</button>
      <button class="cta cta2" id="btnQuit">重新开始</button>
    </div>
    <div class="tip">点右上角 🔊 可以开关音效</div>
  </div>

  <div class="screen hide" id="scOver">
    <h2 class="title" style="font-size:clamp(22px,6.6vw,32px)" id="overTitle">锅都空啦</h2>
    <img class="over-img" id="overImg" alt="果叽">
    <div class="newbest" id="newBest" style="display:none">🎉 新纪录！</div>
    <div class="stats">
      <div class="stat s1"><div class="n" id="oScore">0</div><div class="t">得分</div></div>
      <div class="stat s2"><div class="n" id="oBest">0</div><div class="t">最高分</div></div>
      <div class="stat s3"><div class="n" id="oCombo">x1</div><div class="t">最高连击</div></div>
    </div>
    <div class="tip" id="overTip">再来一次，果叽还饿着</div>
    <div class="rowbtns">
      <button class="cta" id="btnAgain">再来一局</button>
      <button class="cta cta2" id="btnMenu">回到首页</button>
    </div>
  </div>

  <div id="loading">素材加载中…</div>
</div>

async function loadAll(){
  const jobs = [ loadImg(ASSETS.char).then(im=>imgs.char=im),
                 loadImg(ASSETS.hero).then(im=>imgs.hero=im),
                 loadImg(ASSETS.over).then(im=>imgs.over=im),
                 loadImg(ASSETS.plain).then(im=>imgs.plain=im),
                 loadImg(ASSETS.music).then(im=>imgs.music=im),
                 loadImg(ASSETS.bush).then(im=>imgs.bush=im) ];
  for (const f of FOODS){ jobs.push(loadImg(ASSETS.foods[f.k]).then(im=>imgs[f.k]=im)); }
  await Promise.all(jobs);
}

/* ---------- 画布尺寸 / 布局 ---------- */
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = $('app').getBoundingClientRect();
  W = Math.max(240, Math.round(r.width));
  H = Math.max(320, Math.round(r.height));
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
function layout(){
  const hudH = 96;
  LAY.hudH = hudH;
  LAY.groundY = H - clamp(H*0.045, 14, 40);
  LAY.charW = clamp(W*0.30, 92, 168);
  LAY.charH = LAY.charW;
  LAY.plateR = LAY.charW*0.30;
  // 果叽可达范围（保证角色大体在屏内）
  LAY.charMin = LAY.charW*0.44;
  LAY.charMax = W - LAY.charW*0.60;
  const off = (PLATE_FX-0.5)*LAY.charW;
  LAY.plateMin = LAY.charMin + off;
  LAY.plateMax = LAY.charMax + off;
  LAY.baseSize = clamp(Math.min(W,H)*0.115, 34, 62);
  G.charX = clamp(G.charX || W/2, LAY.charMin, LAY.charMax);
  G.charTarget = clamp(G.charTarget || W/2, LAY.charMin, LAY.charMax);
}
function plateScreen(){
  const sx = G.charX - LAY.charW/2;
  return { x: sx + PLATE_FX*LAY.charW, y: LAY.groundY - LAY.charH + PLATE_FY*LAY.charH };
}

/* ---------- 音效（轻量 WebAudio，无素材） ---------- */
let AC = null;
function audio(){
  if (!G.sound) return null;
  if (!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(freq, dur, type, vol, slide){
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(60,slide), ac.currentTime+dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.12, ac.currentTime+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+0.03);
}
const sfx = {
  catch:(n)=>{ const f = 620 + Math.min(n,20)*26; blip(f, 0.11, 'triangle', 0.13); blip(f*1.5, 0.09, 'sine', 0.05); },
  miss:()=>{ blip(180, 0.24, 'sawtooth', 0.11, 90); },
  rush:()=>{ [0,1,2].forEach(i=>setTimeout(()=>blip(660+i*220, 0.16, 'square', 0.1), i*80)); },
  over:()=>{ [0,1,2,3].forEach(i=>setTimeout(()=>blip(520-i*90, 0.22, 'triangle', 0.12), i*130)); },
  click:()=>{ blip(880, 0.06, 'square', 0.07); }
};

/* ---------- 掉落物 ---------- */
function buildBag(){
  // 洗牌袋：按权重铺开，抽完一轮再重铺，避免短期重复
  const pool = [];
  for (const f of FOODS){
    if (f.rush){ for (let i=0;i<2;i++) pool.push(f); }
    else { for (let i=0;i<f.w;i++) pool.push(f); }
  }
  for (let i=pool.length-1;i>0;i--){ const j = (Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
  G.bag = pool;
}
function diff(){                       // 0 -> 1
  return clamp(G.score/1400, 0, 1);
}
function spawn(){
  if (!G.bag.length) buildBag();
  const f = G.bag.pop();
  const rel = f.rel * (f.rush ? 1 : 1);
  const R = LAY.baseSize*rel*0.5;
  const pad = R*0.9 + 4;
  const lo = LAY.plateMin + pad, hi = LAY.plateMax - pad;
  const x = rnd(Math.min(lo,hi), Math.max(lo,hi));
  const d = diff();
  const dur = rnd(2.35, 2.75) - d*1.25;                 // 落到底部的时间
  const fall = (LAY.groundY - (-R)) / dur;
  const item = { f, R, x, y:-R, vy:fall, sway:rnd(0,6.28), swayA:rnd(2,7),
                 rot:rnd(-0.22,0.22), rv:rnd(-0.6,0.6), alive:true };
  // 连续出现时稍微错开落点，避免叠在一起
  let guard = 0;
  while (G.items.some(it => it.alive && Math.abs(it.x-x) < R+it.R && it.y < R*3) && guard++ < 8){
    item.x = rnd(Math.min(lo,hi), Math.max(lo,hi));
  }
  G.items.push(item);
}
function drawItem(it){
  const im = imgs[it.f.k]; if (!im) return;
  ctx.save(); ctx.translate(it.x, it.y);
  const tilt = Math.sin(G.t*2.2 + it.sway)*0.07 + it.rot;
  ctx.rotate(tilt);
  const s = it.R*2/256;
  ctx.drawImage(im, -128*s, -128*s, 256*s, 256*s);
  ctx.restore();
}

/* ---------- 粒子 / 飘字 ---------- */
function burst(x,y,color,n,pow){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(0.35,1)*pow;
    G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(0.2,0.9),
      r:rnd(2.2,5.4),life:rnd(0.45,0.9),t:0,color});
  }
}
function floatText(x,y,txt,color,size){
  G.floats.push({x,y,txt,color,size:size||16,t:0,life:0.85});
}
function ring(x,y,color,r0,r1,life){
  G.rings.push({x,y,color,r0,r1,t:0,life});
}

/* ---------- 游戏流程 ---------- */
function reset(){
  G.score=0; G.combo=0; G.maxCombo=0; G.lives=3; G.rush=0;
  G.items=[]; G.parts=[]; G.floats=[]; G.rings=[];
  G.spawnT=0.55; G.shake=0; G.t=0; G.lastLifeAward=0;
  G.charX = W/2; G.charTarget = W/2; G.tilt=0; G.drag=null;
  buildBag(); syncHUD();
}
function hideScreens(){ scMenu.classList.add('hide'); scPause.classList.add('hide'); scOver.classList.add('hide'); }
function startGame(){ reset(); hideScreens(); G.state='play'; G.lastTs=0; audio(); sfx.click(); }
function toMenu(){ G.state='menu'; hideScreens(); show(scMenu,null); syncHUD(); }
function pause(){ if (G.state!=='play') return; G.state='pause'; show(scPause,null); $('pScore').textContent=G.score; $('pCombo').textContent='x'+mult(); sfx.click(); }
function resume(){ if (G.state!=='pause') return; G.state='play'; show(null,scPause); G.lastTs=0; sfx.click(); }
function gameOver(){
  G.state='over'; sfx.over();
  const isNew = G.score > (G.best||0);
  if (isNew){ G.best = G.score; try{ localStorage.setItem('guoji_ganfan_best', String(G.best)); }catch(e){} }
  $('oScore').textContent = G.score; $('oBest').textContent = G.best;
  $('oCombo').textContent = 'x'+comboMultOf(G.maxCombo);
  $('newBest').style.display = isNew ? '' : 'none';
  $('overTitle').textContent = isNew ? '干饭王！' : (G.score>=400 ? '吃饱啦' : '锅都空啦');
  $('overTip').textContent = isNew ? '刷新了自己的记录，厉害了' : '再来一次，果叽还饿着';
  show(scOver,null);
}
function show(on,off){ if(on) on.classList.remove('hide'); if(off) off.classList.add('hide'); }
function mult(){ return comboMultOf(G.combo); }
function comboMultOf(c){ return clamp(1 + Math.floor(c/5), 1, 5); }
function syncHUD(){
  $('scoreVal').textContent = G.score;
  $('bestVal').textContent = G.best||0;
  const m = mult();
  const cp = $('comboPill');
  if (m>1 && G.state==='play'){ cp.style.display='flex'; $('comboVal').textContent = 'x'+m+'  '+G.combo+'连'; }
  else cp.style.display='none';
  const rp = $('rushPill');
  if (G.rush>0 && G.state==='play'){ rp.style.display='flex'; $('rushVal').textContent = '干饭冲刺 '+Math.ceil(G.rush)+'s'; }
  else rp.style.display='none';
  // 生命图标
  const box = $('lifeBox'), maxShow = Math.max(3, G.lives);
  if (box.dataset.n != String(maxShow)+'_'+String(G.lives)){
    box.dataset.n = String(maxShow)+'_'+String(G.lives);
    let html = '';
    for (let i=0;i<maxShow;i++) html += '<img src="'+ASSETS.life+'" class="'+(i<G.lives?'':'dead')+'" alt="">';
    box.innerHTML = html;
  }
}

/* ---------- 主循环 ---------- */
function step(dt){
  G.t += dt;
  // 角色平滑跟随
  const k = 1 - Math.exp(-24*dt);
  const prevX = G.charX;
  G.charX += (G.charTarget - G.charX)*k;
  const vx = (G.charX - prevX)/Math.max(dt,1e-4);
  G.tilt += ((clamp(vx/(W*2.4), -0.16, 0.16)) - G.tilt)*Math.min(1, dt*12);

  if (G.state==='play'){
    if (G.rush>0){ G.rush = Math.max(0, G.rush-dt); }
    // 生成
    G.spawnT -= dt;
    if (G.spawnT<=0){
      spawn();
      const d = diff();
      G.spawnT = rnd(0.86, 1.12) - d*0.52;
      if (G.rush>0) G.spawnT *= 0.82;
      G.spawnT = Math.max(0.30, G.spawnT);
    }
    // 掉落
    const pt = plateScreen();
    for (const it of G.items){
      if (!it.alive) continue;
      it.y += it.vy*dt;
      it.x += Math.sin(G.t*2.2 + it.sway)*it.swayA*dt;
      it.x = clamp(it.x, it.R*0.5, W-it.R*0.5);
      const catchLine = pt.y - LAY.plateR*0.35;
      if (it.y >= catchLine - it.R*0.15){
        const dx = Math.abs(it.x - pt.x);
        if (dx <= LAY.plateR + it.R*0.42){
          catchIt(it, pt);
        } else if (it.y > pt.y + it.R*0.55){
          missIt(it, pt);
        }
      }
    }
    G.items = G.items.filter(it => it.alive);
  }
  // 粒子 / 飘字 / 光环
  for (const p of G.parts){ p.t += dt; p.vy += 26*dt; p.x += p.vx*dt*22; p.y += p.vy*dt*22; }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const f of G.floats){ f.t += dt; f.y -= 34*dt; }
  G.floats = G.floats.filter(f => f.t < f.life);
  for (const r of G.rings){ r.t += dt; }
  G.rings = G.rings.filter(r => r.t < r.life);
  if (G.shake>0) G.shake = Math.max(0, G.shake - dt*3.2);
  syncHUD();
}

function catchIt(it, pt){
  it.alive = false;
  const m = mult();
  const base = it.f.score;
  const gain = base * m * (G.rush>0 ? 2 : 1);
  G.score += gain;
  G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  burst(it.x, it.y, it.f.tint, it.f.rush?22:11, it.f.rush?1.5:1);
  ring(pt.x, pt.y, it.f.rush?'#FFC94D':'#FFFFFF', LAY.plateR*0.5, LAY.plateR*1.9, 0.4);
  floatText(pt.x, pt.y - LAY.plateR*1.1 - 6, '+'+gain, G.rush>0?'#E0722A':'#E8636F', it.f.rush?22:16);
  if (m>1) floatText(pt.x + (Math.random()*16-8), pt.y - LAY.plateR*1.1 - 26, 'x'+m, '#C9922B', 13);
  if (it.f.rush){
    G.rush = RUSH_TIME; sfx.rush();
    floatText(W/2, H*0.34, '干饭冲刺！分数翻倍', '#E0722A', 20);
    for (let i=0;i<3;i++) ring(W/2, H*0.36, '#FFD166', 10+i*30, 180+i*40, 0.7);
  } else sfx.catch(G.combo);
  if (G.combo - G.lastLifeAward >= 15){
    G.lastLifeAward = G.combo;
    if (G.lives < 5){ G.lives++; floatText(W/2, H*0.42, '+1 颗心', '#E8636F', 17); }
  }
  // 连击里程碑
  if (G.combo>0 && G.combo%10===0) floatText(W/2, H*0.30, G.combo+' 连！', '#F5A623', 22);
}
function missIt(it, pt){
  it.alive = false;
  G.combo = 0; G.lastLifeAward = 0;
  G.lives--;
  G.shake = 1;
  burst(it.x, LAY.groundY-6, '#C6AE9B', 9, 0.8);
  floatText(it.x, LAY.groundY-30, '漏了…', '#9C8A7E', 14);
  sfx.miss();
  if (G.lives <= 0){ G.lives = 0; gameOver(); }
}

/* ---------- 渲染 ---------- */
let bgStars = [];
function initDecor(){
  bgStars = [];
  for (let i=0;i<16;i++) bgStars.push({x:Math.random(),y:Math.random()*0.82,
    r:rnd(1.2,3.2),sp:rnd(0.006,0.026),ph:rnd(0,6.28),c:['#FFE1B0','#FBD3DA','#DCEFD2','#E6E1FA'][(Math.random()*4)|0]});
}
function drawBg(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#FFFCF6'); g.addColorStop(0.55,'#FDF4E9'); g.addColorStop(1,'#F9EADC');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // 柔光
  const rg = ctx.createRadialGradient(W*0.5, H*0.14, 8, W*0.5, H*0.14, Math.max(W,H)*0.72);
  rg.addColorStop(0,'rgba(255,231,190,.62)'); rg.addColorStop(1,'rgba(255,231,190,0)');
  ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
  // 飘浮小星
  for (const s of bgStars){
    const y = (s.y - (G.t*s.sp)) % 1;
    const yy = (y<0?y+1:y)*H*0.92;
    ctx.globalAlpha = 0.5 + 0.42*Math.sin(G.t*1.5+s.ph);
    ctx.fillStyle = s.c;
    ctx.beginPath(); ctx.arc(s.x*W, yy, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 地面
  const gy = LAY.groundY;
  ctx.fillStyle = '#F7E7D6'; ctx.fillRect(0, gy, W, H-gy);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(0, gy, W, 2);
  // 草丛装饰（平铺）
  if (imgs.bush){
    const bh = clamp(LAY.charW*0.30, 26, 46);
    const bw = bh*2;
    const n = Math.ceil(W/bw)+1;
    for (let i=0;i<n;i++){
      ctx.globalAlpha = 0.9;
      ctx.drawImage(imgs.bush, i*bw - (i%2?bw*0.3:0), gy-bh*0.86, bw, bh);
    }
    ctx.globalAlpha = 1;
  }
}
function drawChar(){
  const im = imgs.char; if (!im) return;
  const bob = Math.sin(G.t*3.1)*LAY.charW*0.012;
  const x = G.charX - LAY.charW/2;
  const y = LAY.groundY - LAY.charH + bob;
  // 接住区光环
  const pt = plateScreen();
  const glow = (G.rush>0) ? 'rgba(255,201,77,.55)' : 'rgba(255,255,255,.5)';
  ctx.save();
  ctx.globalAlpha = 0.55 + 0.2*Math.sin(G.t*4);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.ellipse(pt.x, pt.y+LAY.plateR*0.18, LAY.plateR*1.18, LAY.plateR*0.46, 0, 0, 6.2832); ctx.fill();
  ctx.restore();
  // 影子
  ctx.save();
  ctx.globalAlpha = .16; ctx.fillStyle = '#7A5A44';
  ctx.beginPath(); ctx.ellipse(G.charX, LAY.groundY+2, LAY.charW*0.34, LAY.charW*0.07, 0, 0, 6.2832); ctx.fill();
  ctx.restore();
  // 本体
  ctx.save();
  ctx.translate(G.charX, LAY.groundY);
  ctx.rotate(G.tilt);
  if (G.rush>0){
    ctx.globalAlpha = .5; ctx.shadowColor = 'rgba(255,190,60,.95)'; ctx.shadowBlur = 22;
  }
  ctx.drawImage(im, -LAY.charW/2, -LAY.charH + bob, LAY.charW, LAY.charH);
  ctx.restore();
  // 冲刺倒计时條
  if (G.rush>0){
    const w = LAY.charW*0.9, xx = G.charX - w/2, yy = LAY.groundY - LAY.charH - 10;
    ctx.fillStyle='rgba(255,255,255,.75)'; roundRect(xx,yy,w,5,3); ctx.fill();
    ctx.fillStyle='#F5A623'; roundRect(xx,yy,w*clamp(G.rush/RUSH_TIME,0,1),5,3); ctx.fill();
  }
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawFx(){
  for (const r of G.rings){
    const p = r.t/r.life, rad = r.r0 + (r.r1-r.r0)*p;
    ctx.save(); ctx.globalAlpha = (1-p)*0.6; ctx.strokeStyle = r.color; ctx.lineWidth = 3*(1-p)+1;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, 6.2832); ctx.stroke(); ctx.restore();
  }
  for (const p of G.parts){
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.4+a*0.6), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const f of G.floats){
    const p = f.t/f.life, a = p<0.15?p/0.15:(1-(p-0.15)/0.85);
    ctx.save(); ctx.globalAlpha = clamp(a,0,1);
    ctx.font = '900 '+f.size+'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.strokeText(f.txt, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
  }
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if (G.shake>0){
    const s = G.shake*G.shake*7;
    ctx.translate(rnd(-s,s), rnd(-s,s));
  }
  drawBg();
  for (const it of G.items) if (it.alive) drawItem(it);
  drawChar();
  drawFx();
}

function frame(ts){
  requestAnimationFrame(frame);
  if (!G.lastTs) G.lastTs = ts;
  let dt = (ts - G.lastTs)/1000; G.lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (G.state==='play' || G.state==='over') step(dt);
  else { G.t += dt; for (const it of G.items){} }
  render();
}

/* ---------- 输入 ---------- */
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function setTarget(x){ G.charTarget = clamp(x, LAY.charMin, LAY.charMax); }
cv.addEventListener('pointerdown', e=>{
  if (G.state!=='play') return;
  // 指针可能已被系统回收（合成事件 / 快速抬手），捕获失败不应中断拖动
  try { if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId); } catch(_){}
  const p = pos(e);
  G.drag = { id:e.pointerId, ox: p.x - G.charTarget };
  setTarget(p.x - G.drag.ox);
  e.preventDefault();
}, {passive:false});
cv.addEventListener('pointermove', e=>{
  if (G.state!=='play' || !G.drag || e.pointerId!==G.drag.id) return;
  const p = pos(e);
  setTarget(p.x - G.drag.ox);
  e.preventDefault();
}, {passive:false});
const endDrag = e=>{ if (G.drag && (!e || e.pointerId===G.drag.id)) G.drag=null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', ()=>{ endDrag(); if (G.state==='play') pause(); });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && G.state==='play') pause(); });

window.addEventListener('keydown', e=>{
  if (G.state!=='play'){ if (e.key===' ' && G.state==='menu') startGame(); return; }
  const st = LAY.charW*0.7;
  if (e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ setTarget(G.charTarget-st); e.preventDefault(); }
  if (e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ setTarget(G.charTarget+st); e.preventDefault(); }
  if (e.key==='p'||e.key==='P'||e.key==='Escape'){ pause(); }
});

$('btnMenu').onclick = toMenu;
$('btnResume').onclick = resume;
$('btnQuit').onclick = ()=>{ reset(); hideScreens(); G.state='play'; G.lastTs=0; sfx.click(); };
$('btnPause').onclick = ()=>{ if (G.state==='play') pause(); else if (G.state==='pause') resume(); };
$('btnSound').onclick = ()=>{
  G.sound = !G.sound; $('btnSound').textContent = G.sound ? '🔊' : '🔇';
  try{ localStorage.setItem('guoji_ganfan_sound', G.sound?'1':'0'); }catch(e){}
  if (G.sound) sfx.click();
};

/* ---------- 启动 ---------- */
window.addEventListener('resize', ()=>{ resize(); initDecor(); });
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>{ resize(); initDecor(); }, 260); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', ()=>resize());

(async function boot(){
  try{ G.best = parseInt(localStorage.getItem('guoji_ganfan_best')||'0',10)||0; }catch(e){ G.best=0; }
  try{ G.sound = localStorage.getItem('guoji_ganfan_sound')!=='0'; }catch(e){}
  $('btnSound').textContent = G.sound ? '🔊' : '🔇';
  $('heroImg').src = ASSETS.hero; $('overImg').src = ASSETS.over; $('plainImg').src = ASSETS.plain;
  try{
    await loadAll();
    resize(); initDecor(); syncHUD();
    $('loading').classList.add('hide');
    requestAnimationFrame(frame);
  }catch(err){
    $('loading').innerHTML = '<div style="text-align:center;font-weight:700;color:#8C7A6E">素材加载失败<br><span style="font-size:12px">'+err.message+'</span></div>';
  }
})();
</script>
</body>
</html>
