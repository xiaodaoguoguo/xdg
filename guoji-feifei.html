<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5FC9E8">
<title>果叽飞飞 · 果叽小游戏</title>
<!-- 内联 SVG 图标：浏览器会自动探测 /favicon.ico 与 /apple-touch-icon.png，
     不声明就各报一个 404，害得「控制台无报错」这条验收永远红着。声明 data URI 即消除。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='22' width='52' height='20' fill='%23DFF4F7'/%3E%3Crect x='20' y='0' width='18' height='16' rx='4' fill='%2346A85A'/%3E%3Crect x='16' y='15' width='26' height='8' rx='4' fill='%2386D693'/%3E%3Crect x='20' y='48' width='18' height='16' rx='4' fill='%2346A85A'/%3E%3Crect x='16' y='41' width='26' height='8' rx='4' fill='%2386D693'/%3E%3Ccircle cx='30' cy='32' r='9' fill='%23fff' stroke='%23333' stroke-width='3'/%3E%3Ccircle cx='27' cy='30' r='1.8' fill='%23333'/%3E%3Ccircle cx='33' cy='30' r='1.8' fill='%23333'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' fill='%23A6E3F2'/%3E%3Crect x='20' y='0' width='18' height='16' rx='4' fill='%2346A85A'/%3E%3Crect x='16' y='15' width='26' height='8' rx='4' fill='%2386D693'/%3E%3Crect x='20' y='48' width='18' height='16' rx='4' fill='%2346A85A'/%3E%3Crect x='16' y='41' width='26' height='8' rx='4' fill='%2386D693'/%3E%3Ccircle cx='30' cy='32' r='9' fill='%23fff' stroke='%23333' stroke-width='3'/%3E%3Ccircle cx='27' cy='30' r='1.8' fill='%23333'/%3E%3Ccircle cx='33' cy='30' r='1.8' fill='%23333'/%3E%3C/svg%3E">
<style>
/* ============================================================
   1. 设计令牌（与 guoji-dadishu.html 同一套）+ 果叽 IP 色
   ============================================================ */
:root{
  --bg-1:#FFF9F0; --bg-2:#FFEFD8;
  --surface:#FFFFFF; --surface-2:#FFF7EC;
  --line:#F0DFC4; --line-strong:#E4C9A0;

  --text:#3A2A16; --text-2:#8A7355; --text-3:#B29C7E;

  --guoji:#FFB347; --guoji-deep:#EE8A22; --sel:#FFF6E6;

  --stage-1:#EAF8FC; --stage-2:#D6EDF5;

  /* 果叽 IP 点缀色（取自《果叽IP分析与新游戏方向策划.md》2.2 配色表） */
  --ip-ink:#2E2E2E; --ip-blush:#F5A0A0; --ip-heart:#F08080;
  --ip-yellow:#F5C33B; --ip-green:#9CD46A; --ip-cream:#FDF6EE;

  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --sh-1:0 2px 10px rgba(140,95,40,.10);
  --sh-2:0 8px 28px rgba(140,95,40,.16);
  --sh-3:0 18px 48px rgba(120,80,30,.22);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,.9,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg-1:#1E1812; --bg-2:#241C14;
    --surface:#2C231A; --surface-2:#332818;
    --line:#463526; --line-strong:#5C452F;
    --text:#F6EBDC; --text-2:#BFA98C; --text-3:#8E7A60;
    --sel:#3A2C18;
    --stage-1:#1B2A30; --stage-2:#152026;
    --sh-1:0 2px 10px rgba(0,0,0,.4);
    --sh-2:0 8px 28px rgba(0,0,0,.5);
    --sh-3:0 18px 48px rgba(0,0,0,.6);
  }
}

/* ============================================================
   2. 基础
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:linear-gradient(170deg,var(--bg-1) 0%,var(--bg-2) 100%);
  color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{display:block}

.app{
  height:100%;                 /* 老内核没有 dvh 时的退路 */
  height:100dvh;               /* 移动端动态视口：躲开地址栏伸缩 */
  max-width:560px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:clamp(6px,1.4vh,12px);
  /* 左右也留出刘海安全区（横屏时刘海在侧边） */
  padding:max(8px,env(safe-area-inset-top))
          max(clamp(10px,3vw,18px),env(safe-area-inset-right))
          max(8px,env(safe-area-inset-bottom))
          max(clamp(10px,3vw,18px),env(safe-area-inset-left));
}

/* ============================================================
   3. 顶栏
   ============================================================ */
.topbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding-top:2px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;
  display:grid;place-items:center;
  font-size:17px;font-weight:800;color:#fff;
  background:linear-gradient(150deg,#8FD8EE,var(--guoji-deep));
  box-shadow:0 3px 10px rgba(238,138,34,.35), inset 0 -2px 0 rgba(0,0,0,.12);
}
.brand b{display:block;font-size:14.5px;letter-spacing:.2px;line-height:1.25;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--text-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,320px)}
.topbtns{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;font-size:16px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh-1);
  display:grid;place-items:center;
  transition:transform .15s var(--ease-out),box-shadow .15s;
}
.icon-btn:active{transform:scale(.92)}
/* 「换个角色」——带文字的胶囊按钮，比纯图标好认 */
.chip-btn{
  height:38px;border-radius:12px;padding:0 12px;gap:6px;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  box-shadow:var(--sh-1);
  display:inline-flex;align-items:center;
  transition:transform .15s var(--ease-out),color .15s,border-color .15s;
}
.chip-btn:active{transform:scale(.94)}
.chip-btn .face{width:17px;height:17px;flex:0 0 auto}

/* ============================================================
   4. 场地：画布按 360:640 等比居中，两侧留出的空档做成"机台"观感
   ============================================================ */
.stage{
  flex:1 1 auto;position:relative;min-height:0;
  border-radius:var(--r-lg);
  background:radial-gradient(ellipse 120% 80% at 50% 0%,var(--stage-1) 0%,var(--stage-2) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), var(--sh-2);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(4px,1.4vw,10px);
}
#cv{
  display:block;
  border-radius:clamp(10px,2.4vw,16px);
  box-shadow:var(--sh-3);
  background:#A6E3F2;
  cursor:pointer;
  touch-action:none;          /* 手机上别让点击变成滚动/缩放 */
  outline:none;
}
#cv:focus-visible{box-shadow:var(--sh-3),0 0 0 3px var(--guoji)}

/* ============================================================
   5. 底栏
   ============================================================ */
.bottombar{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.pill{
  flex:1 1 auto;min-width:0;
  font-size:12px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:9px 14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:var(--sh-1);
  transition:color .2s;
}
.btn{
  border-radius:99px;font-weight:700;font-size:14px;
  padding:0 20px;height:42px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:linear-gradient(180deg,#FFC46B,var(--guoji-deep));
  color:#fff;
  box-shadow:0 3px 10px rgba(238,138,34,.4), inset 0 -2px 0 rgba(0,0,0,.14);
  transition:transform .15s var(--ease-out),box-shadow .15s;
}
.btn:active{transform:scale(.94)}

/* ============================================================
   6. 角色选择面板
   ---- 参考仓库里「果叽跳一跳」的 .picks/.pick 卡片做法：
        横排卡片 + 卡片内动态预览 + 选中态描边 + 底部「出发」。
        区别是我们不复用 GIF 内嵌，而是把同一张精灵图集画进小 canvas，
        于是预览动画和游戏内用的是同一份数据，天然同步、还省几十 KB。
   ============================================================ */
.sheet{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));
  background:rgba(58,42,22,.42);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.sheet.open{display:flex}
.sheet-card{
  width:min(92vw,400px);max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);
  padding:20px 16px 16px;text-align:center;
  animation:pop .26s var(--ease-pop);
}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.sheet-card h2{font-size:21px;font-weight:800;letter-spacing:.06em}
.sheet-card .sub{font-size:12.5px;color:var(--text-3);margin-top:6px;line-height:1.6}

.picks{display:flex;gap:10px;margin-top:16px}
.pick{
  flex:1 1 0;min-width:0;
  background:var(--surface-2);border:1.5px solid var(--line);border-radius:18px;
  padding:10px 6px 11px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  box-shadow:var(--sh-1);
  transition:transform .16s var(--ease-pop),border-color .16s,background .16s,box-shadow .16s;
}
.pick:active{transform:scale(.97)}
.pick.sel{border-color:var(--guoji-deep);background:var(--sel);box-shadow:0 8px 22px rgba(238,138,34,.2)}
.pick .pimg{height:100px;display:flex;align-items:center;justify-content:center}
.pick canvas{display:block}
.pick strong{font-size:15px;font-weight:700;letter-spacing:.04em;margin-top:7px}
.pick em{font-style:normal;font-size:11.5px;color:var(--text-3)}
.pick.sel em{color:var(--guoji-deep)}
.pick .tag{
  font-style:normal;font-size:10px;color:#fff;background:var(--guoji-deep);
  border-radius:99px;padding:2px 9px;line-height:1.5;margin-top:5px;
  opacity:0;transition:opacity .16s;
}
.pick.sel .tag{opacity:1}

.sheet-acts{margin-top:16px;display:flex;gap:10px}
.sheet-acts .btn{flex:1 1 auto}
.btn.ghost{
  background:var(--surface-2);color:var(--text-2);
  border:1px solid var(--line);box-shadow:var(--sh-1);
  flex:0 0 auto;padding:0 18px;
}
.sheet-foot{margin-top:12px;font-size:11.5px;color:var(--text-3);line-height:1.6}

/* ============================================================
   7. 矮屏 / 横屏适配
   ---- 矮屏（手机横过来只剩 320~420px 高）把顶栏/底栏改成浮层，
        把高度全让给画面。★ 横屏时画布受高度限制，留着常规的上下栏
        会把它压到 157×280，果叽小得看不清。浮层只落在画布两侧的空档上，不挡游戏区。
   ============================================================ */
@media (max-height:560px){
  .brand small{display:none}
  .bottombar .pill{display:none}
}
@media (max-height:600px) and (orientation:landscape){
  .app{display:block;position:relative;padding:6px;gap:0}
  .topbar{position:absolute;left:10px;right:10px;top:8px;z-index:10;padding:0}
  .icon-btn{width:34px;height:34px;font-size:14px;border-radius:10px}
  .chip-btn{height:34px;font-size:12px;padding:0 10px;border-radius:10px}
  .bottombar{position:absolute;right:10px;bottom:8px;z-index:10}
  .btn{height:36px;font-size:13px;padding:0 16px}
  .stage{height:100%;border-radius:14px}
  /* 横屏时留白在左右两侧，面板也跟着矮一点 */
  .sheet-card{padding:14px 14px 12px}
  .pick .pimg{height:76px}
  .sheet-card h2{font-size:18px}
  .sheet-card .sub{display:none}
}
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">飞</div>
      <div>
        <b>果叽飞飞</b>
        <small id="whoami">点一下就往上飞，穿过管道得分</small>
      </div>
    </div>
    <div class="topbtns">
      <button class="chip-btn" id="btnChar" type="button" aria-haspopup="dialog">
        <!-- 果叽脸：两个豆眼 + 一个开口笑，跟素材同一套语言 -->
        <svg class="face" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.4" fill="#fff" stroke="#2E2E2E" stroke-width="1.6"/><circle cx="8.7" cy="10.6" r="1.5" fill="#2E2E2E"/><circle cx="15.3" cy="10.6" r="1.5" fill="#2E2E2E"/><path d="M9.4 14.6c.8 1.15 1.7 1.7 2.6 1.7s1.8-.55 2.6-1.7" fill="none" stroke="#2E2E2E" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="6.1" cy="13.4" rx="1.7" ry="1.1" fill="#F5A0A0" opacity=".9"/><ellipse cx="17.9" cy="13.4" rx="1.7" ry="1.1" fill="#F5A0A0" opacity=".9"/></svg>
        <span id="charName">果叽</span>
      </button>
      <a class="icon-btn" href="./" title="返回小游戏目录" aria-label="返回小游戏目录">←</a>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" tabindex="0" role="img"
            aria-label="果叽飞飞：点击或按空格让角色上升，穿过上下管道之间的空隙得分"></canvas>
  </main>

  <div class="bottombar">
    <div class="pill" id="hint">点击 / 空格 / ↑ 起飞</div>
    <button class="btn" id="btnRestart" type="button">重开</button>
  </div>

</div>

<!-- ============================================================
     角色选择浮层
     ============================================================ -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-card">
    <h2 id="sheetTitle">选个角色</h2>
    <p class="sub">选好就出发，飞的时候点一下往上飞</p>
    <div class="picks" id="picks"></div>
    <div class="sheet-acts">
      <button class="btn" id="btnGo" type="button">出发</button>
      <button class="btn ghost" id="btnSheetClose" type="button">关闭</button>
    </div>
    <p class="sheet-foot">选过的角色会记住，下次打开直接用</p>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   1. 参数 —— 与 Java 版 Config.java 逐项对应，手感完全一致
   ============================================================ */
const W = 360, H = 640;                    // 逻辑画布
const GROUND_H = 96;
const FLOOR_Y  = H - GROUND_H;             // 544

const BIRD_X = 92;
const GRAVITY = 0.38;                      // 像素/帧²（60 帧/秒）
const JUMP_V = -7.2;                       // 起跳瞬时速度（负=向上）
const MAX_FALL = 11.0;
const DIE_SPIN = 0.22;

const PIPE_W = 62;
const PIPE_GAP = 150;
const PIPE_SPEED = 2.4;
const PIPE_SPACING = 208;
const PIPE_MARGIN_TOP = 70, PIPE_MARGIN_BOTTOM = 90;
const FIRST_PIPE_OFFSET = 260;
const CAP_OVERHANG = 5, CAP_H = 26;

const STEP_MS = 1000 / 60;                 // 固定逻辑步长
const MAX_STEPS = 5;                       // 单帧最多补算步数，防卡顿穿模

const BEST_KEY = 'guoji-feifei-best';
const CHAR_KEY = 'guoji-feifei-char';

/* 配色（照搬 Java 版 GameRenderer，另按 IP 色表补了几味点缀色） */
const SKY_TOP = '#5FC9E8', SKY_MID = '#A6E3F2', SKY_LOW = '#DFF4F7';
const HILL_FAR = '#C2E9E2', HILL_NEAR = '#A4DCD0';
const PIPE_DARK = '#1E5B2E', PIPE_MAIN = '#46A85A', PIPE_LIGHT = '#86D693';
const GRASS = '#A9DD7C', GRASS_DARK = '#86BE5C';
const DIRT = '#E0D292', DIRT_DARK = '#D3C382';
const INK = '#2E2E2E', CREAM = '#FFFBF0', BLUSH = '#F5A0A0';
const IP_HEART = '#F08080', IP_YELLOW = '#F5C33B', IP_CREAM = '#FDF6EE';
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif';

/* ============================================================
   2. 素材：角色图集 + 果叽贴纸图集
   ---- ASSETS 由 web/tools/make_sprites.py 生成、build_inject 注入。
        guoji  ：4 帧 / 60ms，白色果叽扭头撒娇（并集裁剪，四帧尺寸一致）
        tangdan：30 帧 / 80ms，黄色糖蛋由远及近飞来并停住
                 —— 原图顶部带一行手写字幕，已逐帧裁掉；
                    前 19 帧本体只有 100x94 大小，第 19 帧起稳定在 178x163，
                    所以游戏内只用 settled 段，避免角色周期性忽大忽小。

/** 角色在游戏内的表现参数（尺寸 = 满尺寸帧的绘制宽度） */
const CHAR_CFG = {
  guoji:   { drawW: 74, hitRx: 17.0, hitRy: 14.0, anchor:  0.00 },
  tangdan: { drawW: 70, hitRx: 16.0, hitRy: 14.5, anchor: -0.02 }
};

const CHARS = {};
const charOrder = [];

(function initChars(){
  ['guoji', 'tangdan'].forEach(function(id){
    const a = ASSETS[id];
    const cfg = CHAR_CFG[id];
    const c = {
      id: id,
      src: a.src,
      rects: a.frames,
      cellW: a.cellW,
      cellH: a.cellH,
      /* 游戏内播放的帧段（图集内下标）；死亡定格就是冻在这套里 */
      animFrom: a.settled.length ? a.settled[0] : 0,
      animTo:   a.settled.length ? a.settled[a.settled.length - 1] : a.frames.length - 1,
      stepMs: a.delays[0] || 80,
      loopMs: a.animLoopMs,
      drawW: cfg.drawW,
      hitRx: cfg.hitRx,
      hitRy: cfg.hitRy,
      anchor: cfg.anchor,
      img: null,
      ready: false
    };
    c.img = new Image();
    c.img.onload = function(){ c.ready = true; draw(0); };
    c.img.onerror = function(){ c.ready = false; };
    c.img.src = c.src;
    CHARS[id] = c;
    charOrder.push(id);
  });
})();

const STK = ASSETS.stickers;
const STK_INDEX = {};
STK.order.forEach(function(n, i){ STK_INDEX[n] = i; });
const stickerImg = new Image();
let stickerReady = false;
stickerImg.onload = function(){ stickerReady = true; draw(0); };
stickerImg.src = STK.src;

function allReady(){
  for (let i = 0; i < charOrder.length; i++){
    if (!CHARS[charOrder[i]].ready) return false;
  }
  return stickerReady;
}

/** 角色在 ms 时刻应该画图集里的哪一格（只在自己的动画帧段里循环） */
function frameAt(c, ms){
  const n = c.animTo - c.animFrom + 1;
  if (n <= 1) return c.animFrom;
  let k = Math.floor(ms / c.stepMs) % n;
  if (k < 0) k += n;
  return c.animFrom + k;
}

/** 贴纸图集取格 */
function stickerRect(name){
  const i = STK_INDEX[name] == null ? 0 : STK_INDEX[name];
  return [(i % STK.cols) * STK.cell, Math.floor(i / STK.cols) * STK.cell];
}

/* ============================================================
   3. 游戏状态与逻辑（纯逻辑，不含绘制）
   ============================================================ */
const G = {
  state: 'READY',        // READY | PLAYING | DYING | OVER
  char: 'guoji',
  paused: false,         // 角色选择面板打开时暂停推进
  birdY: 0,
  vy: 0,
  rot: 0,
  pipes: [],
  pipeSeq: 0,
  pops: [],              // 得分贴纸弹出
  popTotal: 0,           // 累计弹过多少次（验收用，reset 不清）
  hearts: [],            // 摔地那一下溅出来的小爱心
  score: 0,
  best: 0,
  clockMs: 0,            // 动画时钟，死亡后冻结 => 角色"定格"
  worldMs: 0,            // 世界时钟，多走坠落那段 => 背景不停
  overDelay: 0,
  newRecord: false,
  lastGap: H / 2
};

function curChar(){ return CHARS[G.char] || CHARS.guoji; }

function loadBest(){
  try {
    const v = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  } catch (e) { return 0; }
}
function saveBest(v){
  try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 存不了照常玩 */ }
}
function loadChar(){
  try {
    const v = localStorage.getItem(CHAR_KEY);
    return CHARS[v] ? v : null;
  } catch (e) { return null; }
}
function saveChar(id){
  try { localStorage.setItem(CHAR_KEY, id); } catch (e) { /* 同上 */ }
}

function reset(){
  G.state = 'READY';
  G.birdY = H * 0.42;
  G.vy = 0;
  G.rot = 0;
  G.pipes.length = 0;
  G.pipeSeq = 0;
  G.pops.length = 0;
  G.hearts.length = 0;
  G.score = 0;
  G.clockMs = 0;
  G.worldMs = 0;
  G.overDelay = 0;
  G.newRecord = false;
  G.lastGap = H / 2;
}

function flap(){
  switch (G.state){
    case 'READY':
      G.state = 'PLAYING';
      G.vy = JUMP_V;
      break;
    case 'PLAYING':
      G.vy = JUMP_V;
      break;
    case 'DYING':
      break;                                  // 坠落途中不接受操作
    case 'OVER':
      if (G.overDelay > 0) return;            // 刚落地那一小会儿先别急着重开，容易误触
      reset();
      G.state = 'PLAYING';
      G.vy = JUMP_V;
      break;
  }
  syncHint();
}

function pickGapCenter(){
  const half = PIPE_GAP / 2;
  const min = PIPE_MARGIN_TOP + half;
  const max = FLOOR_Y - PIPE_MARGIN_BOTTOM - half;
  let c = min + Math.random() * (max - min);
  // 相邻开口落差不超过 120 像素，保证有时间反应
  const delta = c - G.lastGap;
  if (delta > 120) c = G.lastGap + 120;
  else if (delta < -120) c = G.lastGap - 120;
  c = Math.max(min, Math.min(max, c));
  G.lastGap = c;
  return c;
}

function spawnPipes(){
  const spawnX = W + FIRST_PIPE_OFFSET;
  if (G.pipes.length === 0){
    G.pipes.push({ id: G.pipeSeq++, x: spawnX, gap: pickGapCenter(), scored: false });
    return;
  }
  const last = G.pipes[G.pipes.length - 1];
  if (last.x <= W - PIPE_SPACING){
    G.pipes.push({ id: G.pipeSeq++, x: last.x + PIPE_SPACING, gap: pickGapCenter(), scored: false });
  }
}

function movePipes(){
  for (let i = G.pipes.length - 1; i >= 0; i--){
    const p = G.pipes[i];
    p.x -= PIPE_SPEED;
    if (!p.scored && p.x + PIPE_W < BIRD_X){ p.scored = true; G.score++; bumpScore(); }
    if (p.x + PIPE_W < -10) G.pipes.splice(i, 1);
  }
}

/** 椭圆与矩形是否相交：把圆心夹到矩形上取最近点，再代入椭圆方程 */
function ellipseHitsRect(cx, cy, rx, ry, rectX, rectY, rectW, rectH){
  const nx = Math.max(rectX, Math.min(cx, rectX + rectW));
  const ny = Math.max(rectY, Math.min(cy, rectY + rectH));
  const dx = (cx - nx) / rx, dy = (cy - ny) / ry;
  return dx * dx + dy * dy <= 1;
}

function checkCollision(){
  const c = curChar();
  // 落到地面
  if (G.birdY + c.hitRy >= FLOOR_Y){ G.birdY = FLOOR_Y - c.hitRy; die(true); return; }

  for (let i = 0; i < G.pipes.length; i++){
    const p = G.pipes[i];
    if (BIRD_X + c.hitRx < p.x || BIRD_X - c.hitRx > p.x + PIPE_W) continue;
    const gapTop = p.gap - PIPE_GAP / 2, gapBottom = p.gap + PIPE_GAP / 2;
    if (ellipseHitsRect(BIRD_X, G.birdY, c.hitRx, c.hitRy, p.x, -1000, PIPE_W, gapTop + 1000)){ die(true); return; }
    if (ellipseHitsRect(BIRD_X, G.birdY, c.hitRx, c.hitRy, p.x, gapBottom, PIPE_W, FLOOR_Y - gapBottom + 1000)){ die(true); return; }
  }
}

function die(hitGround){
  if (G.state === 'OVER' || G.state === 'DYING') return;
  G.newRecord = G.score > G.best;
  if (G.newRecord){ G.best = G.score; saveBest(G.best); }
  G.state = 'DYING';
  G.vy = Math.max(G.vy, 1.2);
  if (hitGround) splashHearts();
  // 死亡瞬间动画时钟停走 => 角色定格在当前帧
  syncHint();
}

/** 摔地上溅一圈小爱心（果叽 IP 的心脏色 #F08080） */
function splashHearts(){
  for (let i = 0; i < 5; i++){
    G.hearts.push({
      t0: G.worldMs,
      x: BIRD_X + (Math.random() - 0.5) * 46,
      vx: (Math.random() - 0.5) * 0.9,
      vy: -1.1 - Math.random() * 1.0,
      s: 7 + Math.random() * 6
    });
  }
}

/** 抬头上升、低头俯冲；一阶低通避免角度突跳 */
function updateRotation(){
  const target = G.vy < 0 ? -0.42 : Math.min(Math.PI / 2, G.vy * 0.10);
  G.rot += (target - G.rot) * 0.22;
}

function step(){
  const dt = STEP_MS;
  if (G.state !== 'DYING' && G.state !== 'OVER') G.clockMs += dt;
  if (G.state !== 'OVER') G.worldMs += dt;

  switch (G.state){
    case 'READY': {
      const t = G.clockMs / 1000;
      G.birdY = H * 0.42 + Math.sin(t * 3.2) * 11;
      G.vy = 0;
      G.rot = -0.06;                    // 微微仰头，蓄势待发
      break;
    }
    case 'PLAYING': {
      G.vy += GRAVITY;
      if (G.vy > MAX_FALL) G.vy = MAX_FALL;
      G.birdY += G.vy;
      // 撞顶只挡不杀 —— 原版就是这个手感
      const c = curChar();
      if (G.birdY < c.hitRy){ G.birdY = c.hitRy; G.vy = 0; }
      spawnPipes();
      movePipes();
      checkCollision();
      updateRotation();
      break;
    }
    case 'DYING': {
      G.vy += GRAVITY;
      if (G.vy > MAX_FALL) G.vy = MAX_FALL;
      G.birdY += G.vy;
      G.rot = Math.min(Math.PI / 2, G.rot + DIE_SPIN);
      const c = curChar();
      if (G.birdY + c.hitRy >= FLOOR_Y){
        G.birdY = FLOOR_Y - c.hitRy;
        G.state = 'OVER';
        G.overDelay = 0.35;             // 秒
        splashHearts();
        syncHint();
      }
      break;
    }
    case 'OVER': {
      if (G.overDelay > 0) G.overDelay -= dt / 1000;
      break;
    }
  }
}

/* ============================================================
   4. 画布尺寸（等比缩放，逻辑坐标恒为 360x640）
   ============================================================ */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
let baseK = 1;              // 逻辑像素 -> 设备像素
let cssW = 0, cssH = 0;

function fit(){
  const pad = 0;
  const availW = stage.clientWidth  - pad;
  const availH = stage.clientHeight - pad;
  if (availW <= 0 || availH <= 0) return;

  const k = Math.min(availW / W, availH / H);
  cssW = Math.max(1, Math.floor(W * k));
  cssH = Math.max(1, Math.floor(H * k));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  cv.style.width  = cssW + 'px';
  cv.style.height = cssH + 'px';
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);

  baseK = cv.width / W;
  ctx.setTransform(baseK, 0, 0, baseK, 0, 0);
  draw(0);
}

if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fit).observe(stage);
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });

/* ============================================================
   5. 绘制
   ============================================================ */
function roundRect(g, x, y, w, h, r){
  const rr = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + rr, y);
  g.arcTo(x + w, y,     x + w, y + h, rr);
  g.arcTo(x + w, y + h, x,     y + h, rr);
  g.arcTo(x,     y + h, x,     y,     rr);
  g.arcTo(x,     y,     x + w, y,     rr);
  g.closePath();
}

function ellipse(g, cx, cy, rx, ry){
  g.beginPath();
  g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
}

/** 带描边的居中文字 —— 卡通风格的关键，纯白字会飘在背景里看不清 */
function outlined(g, text, cx, baseline, font, fill, outline, strokeW){
  g.font = font;
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  g.lineJoin = 'round';
  g.lineCap = 'round';
  if (outline && strokeW > 0){
    g.strokeStyle = outline;
    g.lineWidth = strokeW * 2;      // strokeText 是中心描边，两侧各一半
    g.strokeText(text, cx, baseline);
  }
  g.fillStyle = fill;
  g.fillText(text, cx, baseline);
}

/** 果叽脸三件套：豆眼 + 张口笑 + 腮红。云、徽章、贴纸底都用它保持同一套语言 */
function drawGuojiFace(g, cx, cy, s, ink){
  g.save();
  g.fillStyle = ink || INK;
  ellipse(g, cx - 3.4 * s, cy - 0.6 * s, 1.25 * s, 1.5 * s); g.fill();
  ellipse(g, cx + 3.4 * s, cy - 0.6 * s, 1.25 * s, 1.5 * s); g.fill();
  g.strokeStyle = ink || INK;
  g.lineWidth = 1.05 * s;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(cx - 1.9 * s, cy + 2.5 * s);
  g.quadraticCurveTo(cx, cy + 4.0 * s, cx + 1.9 * s, cy + 2.5 * s);
  g.stroke();
  g.fillStyle = 'rgba(245,160,160,.92)';
  ellipse(g, cx - 6.4 * s, cy + 1.6 * s, 1.55 * s, 1.0 * s); g.fill();
  ellipse(g, cx + 6.4 * s, cy + 1.6 * s, 1.55 * s, 1.0 * s); g.fill();
  g.restore();
}

/** 小爱心（贴纸弹出 / 溅落用） */
function drawHeart(g, cx, cy, s, color){
  g.save();
  g.fillStyle = color || IP_HEART;
  g.beginPath();
  g.moveTo(cx, cy + s * 0.78);
  g.bezierCurveTo(cx - s * 1.25, cy - s * 0.15, cx - s * 0.5, cy - s * 1.05, cx, cy - s * 0.38);
  g.bezierCurveTo(cx + s * 0.5, cy - s * 1.05, cx + s * 1.25, cy - s * 0.15, cx, cy + s * 0.78);
  g.closePath();
  g.fill();
  g.restore();
}

/* ---- 背景装饰：固定随机布局，每帧重算会闪 ---- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const CLOUDS = (function(){
  const rnd = mulberry32(20260917);
  const n = 5, out = [];
  for (let i = 0; i < n; i++){
    out.push({
      x: rnd() * W * 1.6,
      y: 50 + rnd() * 210,
      s: 0.65 + rnd() * 0.75,
      face: rnd() < 0.6            // 六成的云有果叽脸，全都有会太挤
    });
  }
  return out;
})();

/** 天上飘的小爱心 / 小星星（慢速视差，纯装饰，不吃素材） */
const FLOATERS = (function(){
  const rnd = mulberry32(770426);
  const out = [];
  for (let i = 0; i < 9; i++){
    out.push({
      x: rnd() * W * 1.4,
      y: 34 + rnd() * 330,
      s: 3.2 + rnd() * 3.6,
      star: rnd() < 0.45,
      rot: rnd() * Math.PI * 2,
      spin: (rnd() - 0.5) * 0.9,
      a: 0.30 + rnd() * 0.34
    });
  }
  return out;
})();

/** 草地上的小花，确定性布局，跟着地面滚 */
const FLOWERS = (function(){
  const rnd = mulberry32(5310);
  const out = [];
  for (let i = 0; i < 14; i++){
    out.push({
      x: rnd() * W * 2.4,
      dy: 3 + rnd() * 11,
      s: 2.2 + rnd() * 1.9,
      c: rnd() < 0.5 ? '#FFF3F4' : (rnd() < 0.5 ? '#FFE9A8' : '#F6D5EC')
    });
  }
  return out;
})();

function drawSky(g){
  const sky = g.createLinearGradient(0, 0, 0, FLOOR_Y);
  sky.addColorStop(0, SKY_TOP);
  sky.addColorStop(0.55, SKY_MID);
  sky.addColorStop(1, SKY_LOW);
  g.fillStyle = sky;
  g.fillRect(0, 0, W, FLOOR_Y + 1);

  // 右上角一团柔和的太阳光晕
  const cx = W - 62, cy = 78;
  for (let i = 6; i >= 1; i--){
    const r = 26 + i * 11;
    g.fillStyle = 'rgba(255,250,220,' + (0.04 + (6 - i) * 0.02) + ')';
    ellipse(g, cx, cy, r, r); g.fill();
  }
  g.fillStyle = 'rgba(255,246,201,.92)';
  ellipse(g, cx, cy, 26, 26); g.fill();
  // 太阳也长一张果叽脸，构图更"贴纸"
  drawGuojiFace(g, cx, cy + 1, 1.5, '#C99A4A');
}

function drawCloud(g, x, y, s, withFace){
  g.beginPath();
  g.ellipse(x,           y,            23 * s, 17 * s, 0, 0, Math.PI * 2);
  g.ellipse(x + 22 * s,  y - 12 * s,   27 * s, 23 * s, 0, 0, Math.PI * 2);
  g.ellipse(x + 52 * s,  y + 2 * s,    20 * s, 15 * s, 0, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,.86)';
  g.fill();
  if (withFace){
    // 脸画在主团（第二个圆）上，正好落在云朵最饱满的地方
    drawGuojiFace(g, x + 22 * s, y - 12 * s, 1.35 * s);
  }
}

function drawClouds(g, offset){
  const span = W * 1.6;
  for (let i = 0; i < CLOUDS.length; i++){
    const c = CLOUDS[i];
    let x = c.x - offset;
    x = ((x % span) + span) % span - W * 0.3;   // 循环回绕，云永远不会跑光
    drawCloud(g, x, c.y, c.s, c.face);
  }
}

function drawFloaters(g, offset){
  const span = W * 1.4;
  for (let i = 0; i < FLOATERS.length; i++){
    const f = FLOATERS[i];
    let x = f.x - offset;
    x = ((x % span) + span) % span - W * 0.25;
    const y = f.y + Math.sin((G.worldMs / 1000) * 0.9 + i) * 7;
    g.save();
    g.globalAlpha = f.a;
    if (f.star){
      g.translate(x, y);
      g.rotate(f.rot + (G.worldMs / 1000) * f.spin * 0.3);
      g.fillStyle = '#FFF6C8';
      g.beginPath();
      for (let k = 0; k < 10; k++){
        const ang = (Math.PI / 5) * k - Math.PI / 2;
        const rr = (k % 2 === 0) ? f.s : f.s * 0.46;
        if (k === 0) g.moveTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
        else g.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      g.closePath(); g.fill();
    } else {
      drawHeart(g, x, y, f.s, '#FFD3D6');
    }
    g.restore();
  }
}

function drawHillLayer(g, offset, baseY, humpH, humpW, color){
  g.fillStyle = color;
  const period = humpW * 1.15;
  const count = Math.ceil(W / period) + 3;
  const start = -((offset % period) + period) % period - period;
  for (let i = 0; i < count; i++){
    const cx = start + i * period;
    ellipse(g, cx + humpW / 2, baseY + humpH, humpW / 2, humpH);
    g.fill();
  }
  const top = baseY + humpH * 0.6;
  g.fillRect(0, top, W, FLOOR_Y - top);
}

function drawHills(g, offset){
  drawHillLayer(g, offset,        388, 98, 178, HILL_FAR);
  drawHillLayer(g, offset + 92,   428, 76, 142, HILL_NEAR);
}

function drawPipes(g){
  const bodyGrad = g.createLinearGradient(0, 0, PIPE_W, 0);
  bodyGrad.addColorStop(0, PIPE_DARK);
  bodyGrad.addColorStop(0.18, PIPE_LIGHT);
  bodyGrad.addColorStop(0.62, PIPE_MAIN);
  bodyGrad.addColorStop(1, PIPE_DARK);

  const capX = -CAP_OVERHANG, capW = PIPE_W + CAP_OVERHANG * 2;
  const capGrad = g.createLinearGradient(capX, 0, capX + capW, 0);
  capGrad.addColorStop(0, PIPE_DARK);
  capGrad.addColorStop(0.18, PIPE_LIGHT);
  capGrad.addColorStop(0.62, PIPE_MAIN);
  capGrad.addColorStop(1, PIPE_DARK);

  for (let i = 0; i < G.pipes.length; i++){
    const p = G.pipes[i];
    if (p.x > W + 10 || p.x + PIPE_W < -20) continue;
    const gapTop = p.gap - PIPE_GAP / 2, gapBottom = p.gap + PIPE_GAP / 2;

    g.save();
    g.translate(p.x, 0);
    g.fillStyle = bodyGrad;
    g.strokeStyle = PIPE_DARK;
    g.lineWidth = 2.5;

    // 上管：管身从屏幕外一直到管帽，管帽贴在开口上沿
    g.fillRect(0, -CAP_H, PIPE_W, gapTop + CAP_H);
    g.strokeRect(1.25, -CAP_H, PIPE_W - 2.5, gapTop + CAP_H);
    g.fillStyle = capGrad;
    roundRect(g, capX, gapTop - CAP_H, capW, CAP_H, 7); g.fill(); g.stroke();
    drawCapFloss(g, capX, gapTop - CAP_H, capW, CAP_H);

    // 下管：管身先画，管帽压在开口下沿（顺序与 Java 版一致，管帽的描边才露得出来）
    const bh = FLOOR_Y - gapBottom;
    if (bh > 0){
      g.fillStyle = bodyGrad;
      g.fillRect(0, gapBottom, PIPE_W, bh);
      g.strokeRect(1.25, gapBottom, PIPE_W - 2.5, bh);
    }
    g.fillStyle = capGrad;
    roundRect(g, capX, gapBottom, capW, CAP_H, 7); g.fill(); g.stroke();
    drawCapFloss(g, capX, gapBottom, capW, CAP_H);
    g.restore();

    // 果叽徽章：每 3 根管道挂一枚，贴在管身上、离开口边缘 46px，不干扰读开口
    if (p.id % 3 === 1 && stickerReady){
      const name = STK.order[(p.id * 5 + 3) % STK.order.length];
      const up = (p.id % 2 === 0);
      const cy = up ? gapTop - 46 : gapBottom + 46;
      drawStickerBadge(g, p.x + PIPE_W / 2, cy, 40, name);
    }
  }
}

/** 管帽上的一条奶白高光，把原来偏"工业"的绿管拉向糖果感 */
function drawCapFloss(g, x, y, w, h){
  g.save();
  g.globalAlpha = 0.5;
  g.fillStyle = '#FFFFFF';
  roundRect(g, x + 5, y + 4.5, w - 10, 5, 2.5);
  g.fill();
  g.globalAlpha = 0.22;
  roundRect(g, x + 5, y + h - 8, w - 10, 3.4, 1.7);
  g.fill();
  g.restore();
}

/** 果叽贴纸徽章：奶油圆底 + 描边 + 一枚贴纸，贴在管身上像盖章 */
function drawStickerBadge(g, cx, cy, d, name){
  if (!stickerReady) return;
  const r = d / 2;
  g.save();
  g.fillStyle = 'rgba(0,0,0,.13)';
  ellipse(g, cx, cy + 1.6, r, r); g.fill();
  g.fillStyle = IP_CREAM;
  ellipse(g, cx, cy, r, r); g.fill();
  g.strokeStyle = INK; g.lineWidth = 2;
  ellipse(g, cx, cy, r, r); g.stroke();
  g.beginPath();                      // 裁到圆里，贴纸别溢出圆底
  g.ellipse(cx, cy, r - 1.6, r - 1.6, 0, 0, Math.PI * 2);
  g.clip();
  const rc = stickerRect(name);
  g.drawImage(stickerImg, rc[0], rc[1], STK.cell, STK.cell,
              cx - r * 1.02, cy - r * 1.02, r * 2.04, r * 2.04);
  g.restore();
}

function drawGround(g, scrollX){
  const gy = FLOOR_Y;

  g.fillStyle = DIRT;
  g.fillRect(0, gy, W, H - gy);

  // 斜纹泥土，滚动方向与管道一致
  g.fillStyle = DIRT_DARK;
  const stripe = 26;
  const shift = -scrollX % stripe;
  for (let x = shift - stripe * 2; x < W + stripe; x += stripe){
    g.beginPath();
    g.moveTo(x, gy + 18);
    g.lineTo(x + 13, gy + 18);
    g.lineTo(x + 53, H);
    g.lineTo(x + 40, H);
    g.closePath();
    g.fill();
  }

  // 草皮
  g.fillStyle = GRASS;
  g.fillRect(0, gy, W, 17);
  g.fillStyle = GRASS_DARK;
  g.fillRect(0, gy + 17, W, 5);

  // 草叶：跟着地面一起滚，形状保持一致
  g.fillStyle = GRASS_DARK;
  const tooth = 16;
  const tShift = -scrollX % tooth;
  for (let x = tShift - tooth * 2; x < W + tooth; x += tooth){
    g.beginPath();
    g.moveTo(x, gy + 5);
    g.lineTo(x + 8, gy + 17);
    g.lineTo(x + 16, gy + 5);
    g.closePath();
    g.fill();
  }

  // 草地上的小花（"可爱画风"里最便宜的一味）
  const flowerSpan = W * 2.4;
  for (let i = 0; i < FLOWERS.length; i++){
    const fl = FLOWERS[i];
    let x = fl.x - scrollX * 0.62;
    x = ((x % flowerSpan) + flowerSpan) % flowerSpan - W * 0.3;
    const y = gy + fl.dy;
    g.fillStyle = fl.c;
    for (let k = 0; k < 5; k++){
      const a = (Math.PI * 2 / 5) * k;
      ellipse(g, x + Math.cos(a) * fl.s, y + Math.sin(a) * fl.s, fl.s * 0.8, fl.s * 0.8);
      g.fill();
    }
    g.fillStyle = IP_YELLOW;
    ellipse(g, x, y, fl.s * 0.72, fl.s * 0.72); g.fill();
  }

  g.fillStyle = '#9E8F5A';
  g.fillRect(0, gy, W, 2);
}

/** 当前角色，按各自动画帧段取格、按各自尺寸绘制 */
function drawBird(g){
  const cx = BIRD_X, cy = G.birdY;
  const c = curChar();

  // 落地后贴一层淡影，让它和地面有接触感
  if (G.birdY + c.hitRy >= FLOOR_Y - 2){
    g.fillStyle = 'rgba(0,0,0,.15)';
    ellipse(g, cx, FLOOR_Y - 0.5, 26, 5.5); g.fill();
  }

  if (!c.ready) return;
  const r = c.rects[frameAt(c, G.clockMs)];
  const k = c.drawW / c.cellW;
  const w = r[2] * k, h = r[3] * k;

  g.save();
  g.translate(cx, cy);
  if (G.rot !== 0) g.rotate(G.rot);
  g.drawImage(c.img, r[0], r[1], r[2], r[3],
              -w / 2, -h / 2 + h * c.anchor, w, h);
  g.restore();
}

/** 得分贴纸：从角色身上冒出来、往上飘一点然后淡出 */
function drawPops(g){
  for (let i = G.pops.length - 1; i >= 0; i--){
    const p = G.pops[i];
    const age = G.worldMs - p.t0;
    if (age > 620 || age < 0){ G.pops.splice(i, 1); continue; }
    const t = age / 620;
    const s = 22 + 16 * Math.min(1, t * 3.2);
    g.save();
    g.globalAlpha = t < 0.6 ? 1 : (1 - (t - 0.6) / 0.4);
    drawSticker(g, p.kind, p.x, p.y - t * 34, s);
    g.restore();
  }
}

/** 把一枚贴纸画在 (cx,cy)，size = 格子边长（内容自带留白） */
function drawSticker(g, name, cx, cy, size){
  if (!stickerReady) return;
  const rc = stickerRect(name);
  g.drawImage(stickerImg, rc[0], rc[1], STK.cell, STK.cell,
              cx - size / 2, cy - size / 2, size, size);
}

/** 摔地溅出来的小爱心 */
function drawHearts(g){
  for (let i = G.hearts.length - 1; i >= 0; i--){
    const h = G.hearts[i];
    let age = (G.worldMs - h.t0) / 1000;
    if (age > 0.9){ G.hearts.splice(i, 1); continue; }
    const x = h.x + h.vx * age * 60;
    const y = h.y + h.vy * age * 60 + 110 * age * age;
    g.save();
    g.globalAlpha = 1 - age / 0.9;
    drawHeart(g, x, y, h.s, IP_HEART);
    g.restore();
  }
}

function drawHud(g){
  if (G.state === 'READY') return;
  outlined(g, String(G.score), W / 2, 96, '700 52px ' + FONT, CREAM, INK, 3);
}

function drawReady(g){
  outlined(g, '果叽飞飞', W / 2, 148, '700 46px ' + FONT, CREAM, INK, 3.5);
  outlined(g, 'Flappy 果叽', W / 2, 182, '400 17px ' + FONT, '#4A6A72', 'rgba(255,255,255,.78)', 1.5);

  const t = G.clockMs / 1000;
  const bob = Math.sin(t * 3.0) * 6;
  outlined(g, '点击 / 空格 起飞', W / 2, 466 + bob, '700 20px ' + FONT, CREAM, INK, 2.5);

  // 一只会上下点的小手，暗示「点这里」
  const hx = W / 2 + 62, hy = 496 + bob;
  g.fillStyle = '#FFD88A';
  ellipse(g, hx, hy, 11, 11); g.fill();
  g.strokeStyle = '#C99A4A'; g.lineWidth = 2.2;
  ellipse(g, hx, hy, 11, 11); g.stroke();

  // 左下角贴两枚果叽贴纸，像贴在屏幕上的实体贴纸
  const wob = Math.sin(t * 2.2) * 3;
  g.save();
  g.translate(44, 566 + wob); g.rotate(-0.13);
  drawSticker(g, 'ice', 0, 0, 58);
  g.restore();
  g.save();
  g.translate(78, 596 - wob * 0.6); g.rotate(0.11);
  drawSticker(g, 'shy', 0, 0, 44);
  g.restore();

  if (G.best > 0){
    outlined(g, '最高分 ' + G.best, W / 2, 596, '400 15px ' + FONT,
             '#4A6A72', 'rgba(255,255,255,.75)', 1.5);
  }
}

function drawGameOver(g){
  g.fillStyle = 'rgba(0,0,0,.27)';
  g.fillRect(0, 0, W, H);

  const pw = 268, ph = 216, px = (W - pw) / 2, py = 190;

  g.fillStyle = 'rgba(0,0,0,.18)';
  roundRect(g, px + 4, py + 6, pw, ph, 22); g.fill();

  g.fillStyle = '#FFFDF6';
  roundRect(g, px, py, pw, ph, 22); g.fill();
  g.strokeStyle = INK; g.lineWidth = 3;
  roundRect(g, px, py, pw, ph, 22); g.stroke();

  // 面板左上角斜贴一枚果叽贴纸当"立绘"：撞了就举旗（投降降），破纪录就抱爱心
  const portrait = G.newRecord ? 'heart' : 'anger';
  g.save();
  g.translate(px + 4, py + 2); g.rotate(-0.2);
  g.fillStyle = 'rgba(255,255,255,.94)';
  ellipse(g, 0, 0, 31, 31); g.fill();
  g.strokeStyle = INK; g.lineWidth = 2.4;
  ellipse(g, 0, 0, 31, 31); g.stroke();
  drawSticker(g, portrait, 0, 0, 60);
  g.restore();

  outlined(g, '撞啦！', W / 2 + 12, py + 54, '700 30px ' + FONT, '#FF8A8A', INK, 2.5);

  outlined(g, '本次', W / 2 - 50, py + 96,  '400 15px ' + FONT, '#77888C', null, 0);
  outlined(g, String(G.score), W / 2 - 50, py + 136, '700 38px ' + FONT, INK, null, 0);

  outlined(g, '最高', W / 2 + 62, py + 96,  '400 15px ' + FONT, '#77888C', null, 0);
  outlined(g, String(G.best), W / 2 + 62, py + 136, '700 38px ' + FONT, BLUSH, INK, 1.5);

  if (G.newRecord){
    g.fillStyle = '#FFB1B8';
    roundRect(g, W / 2 - 48, py + 152, 96, 24, 12); g.fill();
    g.strokeStyle = INK; g.lineWidth = 2;
    roundRect(g, W / 2 - 48, py + 152, 96, 24, 12); g.stroke();
    outlined(g, '新纪录！', W / 2, py + 170, '700 15px ' + FONT, CREAM, INK, 1.25);
  }

  const bob = Math.sin(G.worldMs / 1000 * 3.0) * 4;
  outlined(g, '点击 / 空格 再来一次', W / 2, py + ph + 44 + bob,
           '700 18px ' + FONT, CREAM, INK, 2.5);
  outlined(g, '想换角色就点右上角', W / 2, py + ph + 70 + bob,
           '400 13px ' + FONT, 'rgba(255,255,255,.92)', INK, 1.6);
}

function draw(){
  const g = ctx;
  const scrollX = (G.worldMs / 1000) * PIPE_SPEED * 60;

  drawSky(g);
  drawFloaters(g, scrollX * 0.10);
  drawClouds(g, scrollX * 0.18);
  drawHills(g, scrollX * 0.35);
  drawPipes(g);
  drawGround(g, scrollX);
  drawBird(g);
  drawPops(g);
  drawHearts(g);
  drawHud(g);
  if (G.state === 'READY') drawReady(g);
  else if (G.state === 'OVER') drawGameOver(g);
}

/* ============================================================
   6. 主循环：真实时间累积 -> 固定步长推进，与刷新率解耦
   ============================================================ */
let last = 0, acc = 0;

function frame(now){
  if (!last) last = now;
  let dt = now - last;
  last = now;
  if (dt > 250) dt = 250;             // 切回标签页时别一次性补算一大堆
  acc += dt;

  if (!G.paused){
    let n = 0;
    while (acc >= STEP_MS && n < MAX_STEPS){
      step();
      acc -= STEP_MS;
      n++;
    }
    if (acc >= STEP_MS) acc = 0;      // 追不上就丢掉积压，宁可慢也不要瞬移
  } else {
    acc = 0;
  }

  draw();
  if (sheetOpen) drawPreviews(now);
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', function(){
  if (!document.hidden){ last = 0; acc = 0; }
});

/* ============================================================
   7. 输入
   ============================================================ */
function onPress(e){
  if (e && e.cancelable) e.preventDefault();
  cv.focus({ preventScroll: true });
  flap();
}

cv.addEventListener('pointerdown', onPress);
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

window.addEventListener('keydown', function(e){
  if (sheetOpen){
    if (e.key === 'Escape'){ e.preventDefault(); closeSheet(); }
    else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); closeSheet(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
             e.key === 'a' || e.key === 'A' || e.key === 'd' || e.key === 'D'){
      e.preventDefault();
      const i = charOrder.indexOf(G.char);
      const dir = (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ? -1 : 1;
      selectChar(charOrder[(i + dir + charOrder.length) % charOrder.length]);
    }
    return;
  }
  if (e.repeat) return;
  const k = e.key;
  if (k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'Up' ||
      k === 'w' || k === 'W' || k === 'Enter'){
    e.preventDefault();
    flap();
  } else if (k === 'r' || k === 'R'){
    e.preventDefault();
    reset(); syncHint(); draw();
  } else if (k === 'c' || k === 'C'){
    e.preventDefault();
    openSheet();
  }
});

document.getElementById('btnRestart').addEventListener('click', function(e){
  e.preventDefault();
  reset(); syncHint(); draw();
});

/* ============================================================
   8. 角色选择面板
   ---- 参考仓库里「果叽跳一跳」的 picks 卡片：
        点卡片即时切换 + 高亮，卡片里的预览动起来，底部「出发」收起面板。
        预览用同一张图集画进小 canvas，所以和游戏内是同一份数据。
   ============================================================ */
const sheetEl = document.getElementById('sheet');
const picksEl = document.getElementById('picks');
const whoamiEl = document.getElementById('whoami');
const charNameEl = document.getElementById('charName');
let sheetOpen = false;

/** 每个角色一张卡：预览 canvas + 名字 + 副标题 + 「已选中」标签 */
const PICK_META = {
  guoji:   { name: '果叽', sub: '经典款 · 扭头撒娇' },
  tangdan: { name: '糖蛋', sub: '黄胖款 · 由远及近飞来' }
};
const pickCanvases = {};

(function buildPicks(){
  charOrder.forEach(function(id){
    const meta = PICK_META[id] || { name: id, sub: '' };
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pick';
    b.setAttribute('data-char', id);
    b.setAttribute('aria-pressed', 'false');

    const pimg = document.createElement('span');
    pimg.className = 'pimg';
    const cvs = document.createElement('canvas');
    cvs.width = 168; cvs.height = 144;          // 逻辑尺寸，CSS 再缩一半（视网膜清晰）
    cvs.style.width = '112px'; cvs.style.height = '96px';
    cvs.setAttribute('role', 'img');
    cvs.setAttribute('aria-label', meta.name + ' 角色预览动画');
    pimg.appendChild(cvs);

    const strong = document.createElement('strong');
    strong.textContent = meta.name;
    const em = document.createElement('em');
    em.textContent = meta.sub;
    const tag = document.createElement('i');
    tag.className = 'tag';
    tag.textContent = '已选中';

    b.appendChild(pimg); b.appendChild(strong); b.appendChild(em); b.appendChild(tag);
    picksEl.appendChild(b);
    pickCanvases[id] = cvs;
  });
})();

function syncPicks(){
  const nodes = picksEl.querySelectorAll('.pick');
  for (let i = 0; i < nodes.length; i++){
    const on = nodes[i].getAttribute('data-char') === G.char;
    nodes[i].classList.toggle('sel', on);
    nodes[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  const meta = PICK_META[G.char];
  if (meta){
    charNameEl.textContent = meta.name;
    whoamiEl.textContent = meta.name + ' · ' + meta.sub.split(' · ')[0] + ' · 点一下就往上飞';
  }
}

/** 预览：整段图集都放（糖蛋就是「由远及近」的登场动画），并保持各帧原生比例 */
let previewT0 = 0;
function drawPreviews(now){
  if (!previewT0) previewT0 = now;
  const t = now - previewT0;          // 用真实时间推进，别用「每帧 +16ms」，否则帧率一变速度就变
  charOrder.forEach(function(id){
    const cvs = pickCanvases[id];
    const c = CHARS[id];
    if (!cvs || !c || !c.ready) return;
    const g = cvs.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cvs.width, cvs.height);

    const boxW = cvs.width * 0.86, boxH = cvs.height * 0.94;
    const k = Math.min(boxW / c.cellW, boxH / c.cellH);
    const n = c.rects.length;
    const r = c.rects[Math.floor(t / c.stepMs) % n];
    const w = r[2] * k, h = r[3] * k;
    // 居中绘制：糖蛋那段「由远及近」就会往观众方向长大，而不是往上窜
    g.drawImage(c.img, r[0], r[1], r[2], r[3],
                (cvs.width - w) / 2, (cvs.height - h) / 2, w, h);
  });
}

function selectChar(id){
  if (!CHARS[id] || id === G.char) { syncPicks(); return; }
  G.char = id;
  saveChar(id);
  syncPicks();
  draw(0);
}

picksEl.addEventListener('click', function(e){
  const el = e.target && e.target.closest ? e.target.closest('.pick') : null;
  if (!el) return;
  selectChar(el.getAttribute('data-char'));
});

function openSheet(){
  if (sheetOpen) return;
  sheetOpen = true;
  G.paused = true;
  sheetEl.classList.add('open');
  previewT0 = 0;
  syncPicks();
  const sel = picksEl.querySelector('.pick.sel');
  if (sel && sel.focus) sel.focus({ preventScroll: true });
}
function closeSheet(){
  if (!sheetOpen) return;
  sheetOpen = false;
  sheetEl.classList.remove('open');
  G.paused = false;
  last = 0; acc = 0;                  // 别把面板打开这段时间补算成一大堆步进
  if (G.state === 'READY') reset();
  syncHint();
  draw();
}

document.getElementById('btnChar').addEventListener('click', openSheet);
document.getElementById('btnGo').addEventListener('click', closeSheet);
document.getElementById('btnSheetClose').addEventListener('click', closeSheet);
sheetEl.addEventListener('click', function(e){ if (e.target === sheetEl) closeSheet(); });

/* ============================================================
   9. 底栏提示随状态变化
   ============================================================ */
const hintEl = document.getElementById('hint');
let lastHint = '';
function syncHint(){
  const best = G.best > 0 ? '　·　最高分 ' + G.best : '';
  const s =
    G.state === 'READY'   ? '点击 / 空格 / ↑ 起飞' + best + '　·　右上角可换角色' :
    G.state === 'PLAYING' ? '别撞管道' :
    G.state === 'DYING'   ? '哎呀…' :
                            '点击 / 空格 / ↑ 再来一次';
  if (s !== lastHint){ hintEl.textContent = s; lastHint = s; }
}
setInterval(syncHint, 200);

/** 得分时的反馈：冒一枚果叽贴纸 + 把提示条点亮一下 */
const POP_KINDS = ['heart', 'peach', 'music', 'pat'];
function bumpScore(){
  G.popTotal++;
  G.pops.push({
    t0: G.worldMs,
    x: BIRD_X + 20,
    y: G.birdY - 6,
    kind: POP_KINDS[G.score % POP_KINDS.length]
  });
  hintEl.style.color = 'var(--guoji-deep)';
  setTimeout(function(){ hintEl.style.color = ''; }, 220);
}

/* ============================================================
   10. 启动
   ============================================================ */
G.best = loadBest();
const savedChar = loadChar();
if (savedChar) G.char = savedChar;
reset();
syncPicks();
fit();
syncHint();
requestAnimationFrame(function(t){ last = t; requestAnimationFrame(frame); });

/* 第一次来（没选过角色、也没成绩）：直接把选择面板弹出来，省得找不到入口 */
if (!savedChar && G.best === 0) openSheet();

/* ============================================================
   11. 只读状态快照：给自动化验收用，也方便自己排查手感
   ============================================================ */
window.__guojiFeifei = {
  get state()      { return G.state; },
  get score()      { return G.score; },
  get best()       { return G.best; },
  get birdY()      { return G.birdY; },
  get vy()         { return G.vy; },
  get rot()        { return G.rot; },
  get pipeCount()  { return G.pipes.length; },
  get clockMs()    { return G.clockMs; },
  get worldMs()    { return G.worldMs; },
  get spriteReady(){ return allReady(); },
  get stickerReady(){ return stickerReady; },
  get canvasSize() { return { w: cv.width, h: cv.height, cssW: cssW, cssH: cssH }; },
  get frameIndex() { return frameAt(curChar(), G.clockMs); },
  get loopMs()     { return curChar().loopMs; },

  /* 角色相关 */
  get char()       { return G.char; },
  get chars()      { return charOrder.slice(); },
  get charInfo()   { return charOrder.map(function(id){
    const c = CHARS[id];
    return { id: id, ready: c.ready, frames: c.rects.length,
             animFrom: c.animFrom, animTo: c.animTo, stepMs: c.stepMs,
             loopMs: c.loopMs, drawW: c.drawW, hitRx: c.hitRx, hitRy: c.hitRy,
             cellW: c.cellW, cellH: c.cellH };
  }); },
  get sheetOpen()  { return sheetOpen; },
  get paused()     { return G.paused; },
  get savedChar()  { try { return localStorage.getItem(CHAR_KEY); } catch (e) { return null; } },
  get pickCount()  { return picksEl.querySelectorAll('.pick').length; },
  get stickerCount(){ return STK.order.length; },
  get stickerNames(){ return STK.order.slice(); },
  get popTotal()   { return G.popTotal; },
  get popLive()    { return G.pops.length; },
  get heartLive()  { return G.hearts.length; },
  get pipeDeco()   { return G.pipes.map(function(p){
    return { id: p.id, hasBadge: (p.id % 3 === 1), x: p.x, gap: p.gap };
  }); },

  flap: flap,
  setChar: selectChar,
  openSheet: openSheet,
  closeSheet: closeSheet,
  reset: function(){ reset(); syncHint(); draw(); },
  /** 瞄准下一组管道开口的简易自动驾驶，用于验证关卡确实可通过 */
  autopilot: function(){
    if (G.state !== 'PLAYING') return;
    const c = curChar();
    let target = FLOOR_Y / 2, bestDx = Infinity;
    for (let i = 0; i < G.pipes.length; i++){
      const p = G.pipes[i];
      const dx = p.x + PIPE_W - BIRD_X;
      if (dx > -20 && dx < bestDx){ bestDx = dx; target = p.gap; }
    }
    // 每次拍翅膀上升 7.2²/(2×0.38) ≈ 68px，所以瞄开口中心下方一点，
    // 否则顶点会冲到开口上沿撞管
    if (G.birdY > target + 32 && G.vy > -1.5) flap();
  }
};

})();
</script>
