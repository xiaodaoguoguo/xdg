<style>
/* ============================================================
   果叽手机小游戏 · 共享皮肤（由 build_game.py 注入到每个模板的 <style> 里）
   色值全部取自果叽 IP 实测：奶油底 #FDF6EE / 非纯黑描边 #2E2E2E / 腮红 #F5A0A0
   ★ 玩法模板不要改这个文件；玩法自己的布局写在自己的 <style> 里。
   ============================================================ */
:root{
  --cream:#FDF6EE;        /* 页面奶油底 */
  --card:#FFFFFF;
  --ink:#2E2E2E;          /* 描边深灰，非纯黑 */
  --ink-soft:#8A8078;
  --pink:#F5A0A0;         /* 腮红 */
  --rose:#F08080;         /* 爱心桃粉 */
  --yellow:#F5C33B;       /* 糖蛋暖黄 */
  --orange:#E8963C;
  --red:#E4514F;          /* 危险 */
  --green:#07C160;        /* 微信绿 —— 品牌元素用 */
  --grass:#9CD46A;        /* 场景绿 */
  --shadow:0 4px 0 rgba(46,46,46,.10), 0 10px 22px rgba(46,46,46,.10);
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--cream);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
  touch-action:none;
}
#app{
  position:fixed;inset:0;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* ★ 隐藏必须同时上 visibility：只靠 opacity:0 压不住带 transform 动画的合成层
   （开始页那只上下点头的果叽会透到结算页上面去）。visibility 参与 transition 时
   是「离散」过渡：淡出走完才真正隐藏，淡入立刻可见，观感不受影响。 */
.hide{opacity:0 !important;pointer-events:none !important;visibility:hidden !important}

/* ---------------- 画布 ---------------- */
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------------- HUD ---------------- */
#hud{
  position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;
  display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:6;
}
#hud,#stage,[data-hide-on-screen]{transition:opacity .22s ease,visibility .22s ease}
.pill{
  background:rgba(255,255,255,.92);border:2px solid rgba(46,46,46,.08);
  border-radius:14px;padding:5px 11px;box-shadow:0 2px 0 rgba(46,46,46,.06);
  font-size:13px;font-weight:700;line-height:1.35;white-space:nowrap;
}
.pill b{font-size:17px;font-variant-numeric:tabular-nums}
.pill.right{margin-left:auto}
#combo{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
  font-size:34px;font-weight:900;color:var(--orange);opacity:0;pointer-events:none;z-index:7;
  text-shadow:0 3px 0 #fff,0 0 12px #fff;
}
#combo.on{animation:comboPop .62s cubic-bezier(.2,1.5,.4,1)}
@keyframes comboPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-56%) scale(1)}
}

/* ---------------- 品牌标识（果叽 IP 的水印位） ---------------- */
.brand{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.94);
  border:2px solid rgba(7,193,96,.22);border-radius:999px;
  padding:5px 6px 5px 12px;box-shadow:0 2px 0 rgba(7,193,96,.12);
}
.brand .mag{
  font-size:15px;font-weight:900;color:var(--green);line-height:1;
  display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;
}
.brand .nm{font-size:13px;font-weight:800;letter-spacing:.4px;color:#3A3A3A}
.brand .go{
  font-size:12px;font-weight:800;color:#fff;background:var(--green);
  border-radius:999px;padding:4px 11px;line-height:1;
}
.brand-tip{font-size:12px;color:var(--ink-soft);margin-top:9px;line-height:1.6}
.brand-tip b{color:var(--green);font-weight:800}

/* 果叽 IP 徽标：圆头像 + 名字 */
.ipbadge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.94);border:2px solid rgba(46,46,46,.07);
  border-radius:999px;padding:4px 13px 4px 5px;box-shadow:0 2px 0 rgba(46,46,46,.06);
}
.ipbadge img{
  width:30px;height:30px;border-radius:50%;object-fit:contain;
  background:var(--cream);border:2px solid rgba(245,195,59,.55);
}
.ipbadge .t{font-size:13px;font-weight:900;letter-spacing:.5px}
.ipbadge .s{font-size:10px;color:var(--ink-soft);letter-spacing:.3px}

/* ---------------- 全屏界面层 ---------------- */
.screen{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;
  /* 内容高于屏幕时，居中交给 .wrap 的 margin:auto，否则顶部会被推出屏幕且滚不回来 */
  justify-content:flex-start;align-items:center;
  overflow-y:auto;overflow-x:hidden;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  background:var(--cream);
  transition:opacity .28s ease,visibility .28s ease;
}
.wrap{
  margin:auto;width:100%;max-width:420px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.head{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%}

/* ---- ① 初始化界面 ---- */
#screen-load .logo{
  width:132px;height:132px;object-fit:contain;
  filter:drop-shadow(0 8px 16px rgba(46,46,46,.14));
  animation:bob 1.5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.loadbar{
  width:190px;height:12px;border-radius:999px;background:#EFE6DA;
  border:2px solid rgba(46,46,46,.07);overflow:hidden;
}
.loadbar i{display:block;height:100%;width:8%;border-radius:999px;
  background:linear-gradient(90deg,var(--yellow),var(--orange));
  transition:width .22s ease}
.loadtxt{font-size:12px;color:var(--ink-soft);letter-spacing:.4px}
h1.title{
  font-size:27px;font-weight:900;letter-spacing:1px;text-align:center;
  background:linear-gradient(180deg,#3A3A3A,#6B625B);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.3px;text-align:center;line-height:1.5}

/* ---- ② 选角色界面 ---- */
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.charcard{
  position:relative;background:var(--card);border-radius:var(--radius);
  border:2.5px solid rgba(46,46,46,.08);padding:7px 7px 5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  box-shadow:0 3px 0 rgba(46,46,46,.07);transition:transform .14s,border-color .14s;
}
.charcard:active{transform:scale(.95)}
.charcard img{width:100%;aspect-ratio:1;object-fit:contain}
.charcard .nm{
  font-size:10.5px;font-weight:700;color:var(--ink-soft);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.charcard.sel{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(245,195,59,.28),0 3px 0 rgba(46,46,46,.07)}
.charcard.sel::after{
  content:"✓";position:absolute;top:-9px;right:-9px;width:24px;height:24px;
  background:var(--yellow);color:#fff;border-radius:50%;font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;
}

/* ---- 按钮 ---- */
.btn{
  border:none;border-radius:var(--radius);font-family:inherit;font-weight:900;
  font-size:17px;letter-spacing:1px;color:#fff;cursor:pointer;
  padding:14px 30px;min-width:200px;
  background:linear-gradient(180deg,#FFC94A,#F2A93B);
  box-shadow:0 4px 0 #D98F26,0 10px 20px rgba(232,150,60,.28);
  transition:transform .1s,box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D98F26,0 4px 10px rgba(232,150,60,.24)}
.btn.ghost{
  background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(46,46,46,.10);
  border:2.5px solid rgba(46,46,46,.08);font-size:15px;padding:12px 24px;min-width:150px;
}

/* ---- ③ 开始界面 ---- */
#screen-start .hero{
  width:min(52vw,196px);object-fit:contain;
  filter:drop-shadow(0 10px 18px rgba(46,46,46,.14));
  animation:bob 2.2s ease-in-out infinite;
}
.rules{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.rule{
  background:#fff;border:2px solid rgba(46,46,46,.07);border-radius:13px;
  padding:7px 12px;font-size:12px;font-weight:700;color:#5C544E;
  display:flex;align-items:center;gap:5px;box-shadow:0 2px 0 rgba(46,46,46,.05);
}
.rule em{font-style:normal;font-size:15px}

/* ---- 结算界面 ---- */
.bigscore{
  font-size:58px;font-weight:900;line-height:1;color:var(--orange);
  font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #fff,0 8px 18px rgba(232,150,60,.22);
}
.bigscore small{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);
  letter-spacing:1px;margin-top:6px;text-shadow:none}
.stat{
  background:#fff;border-radius:var(--radius);border:2.5px solid rgba(46,46,46,.07);
  padding:14px 18px;width:100%;display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow);
}
.stat .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.stat .row span:last-child{font-variant-numeric:tabular-nums;color:var(--orange);font-size:17px;font-weight:900}
.newbest{font-size:12px;color:var(--green);font-weight:800;text-align:center}

/* ---- 矮屏 / 横屏紧凑 ---- */
@media (max-height:660px){
  h1.title{font-size:22px}
  .btn{padding:11px 24px;font-size:15px;min-width:170px}
  #screen-start .hero{width:min(38vw,140px)}
  .pickgrid{gap:7px}
  .wrap{gap:10px}
}
@media (orientation:landscape) and (max-height:520px){
  .wrap{max-width:min(560px,80vw)}
  #screen-start .hero{width:min(24vh,120px)}
}

#hud .av{width:24px;height:24px;border-radius:50%;object-fit:contain;background:var(--cream);
  border:2px solid rgba(245,195,59,.6);margin-right:2px;vertical-align:-7px}
.pill.coins b{color:var(--orange)}
.pill.coins.low b{color:var(--red)}
#btnGrab{
  position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:8;cursor:pointer;touch-action:none;
  width:94px;height:94px;border-radius:50%;border:none;padding:0;
  font-family:inherit;font-size:21px;font-weight:900;letter-spacing:3px;color:#fff;
  background:linear-gradient(180deg,#FFC94A,#F2A93B);
  box-shadow:0 6px 0 #D98F26,0 12px 24px rgba(232,150,60,.32);
  transition:transform .1s,box-shadow .1s,filter .18s,opacity .2s,visibility .2s;
}
#btnGrab:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #D98F26,0 6px 14px rgba(232,150,60,.3)}
#btnGrab.busy{filter:grayscale(.4) brightness(.95)}
#hint{
  position:absolute;left:0;right:0;bottom:calc(122px + env(safe-area-inset-bottom));
  text-align:center;font-size:12.5px;font-weight:700;color:#96897E;z-index:8;
  transition:opacity .3s,visibility .3s;
}
#hint.gone{opacity:0;pointer-events:none}
@media (max-height:660px){
  #btnGrab{width:76px;height:76px;font-size:17px;bottom:calc(12px + env(safe-area-inset-bottom))}
  #hint{bottom:calc(96px + env(safe-area-inset-bottom));font-size:11.5px}
}
@media (orientation:landscape) and (max-height:520px){
  #btnGrab{left:auto;right:18px;bottom:calc(10px + env(safe-area-inset-bottom));
    transform:none;width:62px;height:62px;font-size:14px;letter-spacing:1px}
  #btnGrab:active{transform:translateY(4px)}
  #hint{display:none}
}
</style>

<script>/* ============================================================

  }

  /* ---------------- 选角色 ----------------
     玩法在注册表里写了 "pick": false 时（只有一位主角的游戏），
     整套选角色流程都跳过：加载完直接进开始页，主角恒为 hero 槽的第一位。 */
  var PICK = META.pick !== false;
  var picked = 0;
  function heroKeys() {
    var k = (SLOTS.hero && SLOTS.hero.length) ? SLOTS.hero.slice() : Object.keys(ASSETS);
    return PICK ? k : k.slice(0, 1);
  }
  function heroSlug() { var k = heroKeys(); return k[Math.min(picked, k.length - 1)] || null }
  function buildPick(onPick) {
    var grid = $('#pickGrid'); if (!grid) return;
    grid.innerHTML = '';
    heroKeys().forEach(function (slug, i) {
      var a = ASSETS[slug]; if (!a) return;
      var d = document.createElement('div');
      d.className = 'charcard' + (i === picked ? ' sel' : '');
      d.dataset.slug = slug;
      var img = document.createElement('img');
      img.src = a.portrait.src; img.alt = a.meta.cn || slug;
      var nm = document.createElement('div');
      nm.className = 'nm'; nm.textContent = a.meta.cn || slug;
      d.appendChild(img); d.appendChild(nm);
      d.addEventListener('pointerdown', function () {
        picked = i;
        $$('.charcard', grid).forEach(function (e, j) { e.classList.toggle('sel', j === i) });
        SFX.tap();
        if (onPick) onPick(slug, i);
      });
      grid.appendChild(d);
    });
  }

  /* ---------------- 最高分 ---------------- */
  function bestKey() { return 'guoji_best_' + META.id }
  function best() { try { return +(localStorage.getItem(bestKey()) || 0) } catch (e) { return 0 } }
  function setBest(v) { try { localStorage.setItem(bestKey(), v) } catch (e) { } }

  /* ---------------- 主循环 ---------------- */
  var last = 0, errs = [];
  function note(e) { var m = String(e && e.message || e); if (errs.indexOf(m) < 0 && errs.length < 12) errs.push(m) }
  function loop(ts) {
    requestAnimationFrame(loop);
    if (!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05); last = ts;
    if (GQ.state === 'playing') {
      GQ.t += dt;
      if (!GQ.clockFrozen) GQ.clock += dt * 1000;
      if (game && game.update) { try { game.update(dt) } catch (e) { note(e) } }
    }
    if (game && game.draw) { try { game.draw(dt) } catch (e) { note(e) } }
  }

  /* ---------------- 公开 API ---------------- */
  var GQ = {
    MANIFEST: MANIFEST, SLOTS: SLOTS, BRAND: BRAND, META: META,
    cv: cv, ctx: ctx,
    W: 0, H: 0, DPR: 1, viewW: 0, viewH: 0,
    t: 0, clock: 0, clockFrozen: false,
    state: 'load', screen: null, score: 0, ready: false,
    frameAt: frameAt,
    /* 通用小工具：玩法模板可以直接用，省得各自重写一遍 */
    util: { $: $, $$: $$, setText: setText, clamp: clamp, rr: rr, ri: ri, shuffle: shuffle },
    drawFrame: function (slug, fi, x, y, h, opt) { drawFrame(slug, fi, x, y, h, opt) },
    img: function (slug) { var a = ASSETS[slug]; return a ? a.img : null },
    portrait: function (slug) { var a = ASSETS[slug]; return a ? a.portrait : null },
    meta: function (slug) { var a = ASSETS[slug]; return a ? a.meta : null },
    slot: function (name) { return (SLOTS[name] || []).slice() },
    slot1: function (name) { return (SLOTS[name] || [])[0] || null },
    pool: function (list) {
      return (list || []).filter(function (k) { return ASSETS[k] }).map(function (k) { return { slug: k, meta: ASSETS[k].meta } });
    },
    hero: heroSlug,
    heroes: heroKeys,
    picked: function () { return picked },
    show: show, screens: function () { return SCREENS.slice() },
    ipBadge: ipBadge,
    SFX: SFX,
    best: best, setBest: setBest,
    syncHud: function () {
      setText('#score', GQ.score);
      setText('#best2', best());
    },
    /* ---- 验收调试桥 ---- */
    probe: function () {
      var d = {};
      try { d = (game && game.probe) ? game.probe() : {} } catch (e) { d = { probeError: String(e && e.message) } }
      return { state: GQ.state, score: GQ.score, clock: Math.round(GQ.clock), detail: d };
    },
    forceFinish: function () { try { return game && game.forceFinish ? game.forceFinish() : GQ.endGame({ score: GQ.score }) } catch (e) { note(e) } },
    autoPlay: function (ms) { try { return (game && game.autoPlay) ? game.autoPlay(ms) : Promise.resolve(null) } catch (e) { note(e); return Promise.resolve(null) } },
    errors: function () { return errs.slice() },

    /* ---- 开局 / 收局 ---- */
    startGame: function () {
      GQ.score = 0; GQ.t = 0; GQ.clock = 0; GQ.clockFrozen = false;
      GQ.state = 'playing';
      show(null);
      GQ.syncHud();
      var r = game && game.init ? game.init(GQ) : null;
      SFX.tap();
      return r;
    },
    endGame: function (res) {
      res = res || {};
      GQ.state = 'over';
      var sc = res.score != null ? res.score : GQ.score;
      GQ.score = sc;
      var b = best(), isNew = sc > b;
      if (isNew) { b = sc; setBest(b) }
      setText('#overScore', sc);
      setText('#best2', b);
      setText('#overTitle', res.title || '果叽玩累啦');
      var st = $('#overStat');
      if (st) {
        var rows = (res.rows || []).concat([['历史最高', b]]);
        st.innerHTML = rows.map(function (r) {
          return '<div class="row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
        }).join('');
      }
      var nb = $('#newBest'); if (nb) nb.classList.toggle('hide', !isNew);
      var img = $('#overImg'); if (img) { var h = heroSlug(); if (ASSETS[h]) img.src = ASSETS[h].portrait.src; }
      SFX.lose();
      show('screen-over');
    },

    boot: function (g) {
      game = g;
      collectScreens();
      injectBrand();
      /* 玩法文案由注册表驱动：开始页三条说明 + 各界面副标题 */
      var rl = $('#rules');
      if (rl && META.rules && META.rules.length) {
        rl.innerHTML = META.rules.map(function (r) {
          return '<div class="rule"><em>' + r[0] + '</em>' + r[1] + '</div>';
        }).join('');
      }
      if (META.sub) $$('.gsub').forEach(function (e) { e.textContent = META.sub });
      show('screen-load');          // 开局先让 HUD / 棋盘收起来
      resize();
      window.addEventListener('resize', function () { resize() });
      window.addEventListener('orientationchange', function () { setTimeout(resize, 260) });

      var loadTxt = $('#loadTxt');
      function refreshHero() {
        var s = heroSlug(); if (!ASSETS[s]) return;
        var hi = $('#heroImg'); if (hi) hi.src = ASSETS[s].portrait.src;
        var lg = $('#loadLogo'); if (lg) lg.src = ASSETS[s].portrait.src;
        ipBadge($('#pickIp'), s); ipBadge($('#startIp'), s);
      }
      loadAssets().then(function () {
        var keys = Object.keys(ASSETS).filter(function (k) { return ASSETS[k].ready });
        if (!keys.length) { if (loadTxt) loadTxt.textContent = '素材没加载出来，请重新生成游戏'; return }
        var h = heroSlug() || keys[0];
        var logo = $('#loadLogo'); if (logo) logo.src = ASSETS[h].portrait.src;
        setText('#best2', best());
        if (PICK) buildPick(refreshHero);
        refreshHero();

        GQ.ready = true;
        if (loadTxt) loadTxt.textContent = '果叽准备好了！';
        setTimeout(function () { show(PICK ? 'screen-pick' : 'screen-start') }, 320);
      });

      function on(id, fn) { var e = $('#' + id); if (e) e.addEventListener('click', fn) }
      on('btnPickOk', function () { refreshHero(); show('screen-start'); SFX.tap() });
      on('btnChange', function () { show(PICK ? 'screen-pick' : 'screen-start') });
      on('btnStart', function () { GQ.startGame() });
      on('btnAgain', function () { GQ.startGame() });
      on('btnBack', function () { show(PICK ? 'screen-pick' : 'screen-start') });

      requestAnimationFrame(loop);
    }
  };
  window.GQ = GQ;
})();
</script>
<script>
/* ============================================================
   玩法：果叽夹娃娃机
   ------------------------------------------------------------
   天车横梁上坐着一只果叽（选中的那只当操作员），爪子吊在它下面。
   玩家左右拖动把爪子对准柜子里的果叽，按「抓」下爪。

   核心手感 = 对准程度：
     爪子中心与目标果叽中心的水平偏差 d（0 = 完全对中）
       d < 0.50  → 稳稳抓住
       d < 0.90  → 六成把握（会滑脱，果叽掉回堆里）
       d ≥ 0.90  → 空手而归

   难度递增不靠改版面，而是靠素材自己动起来：
     柜子里的果叽一直在播自己的 GIF 帧动画，
     抓得越多，它们左右晃得越厉害（0 → 7px），对准越来越难。
   ============================================================ */
(function () {
  'use strict';
  var U = GQ.util;
  var ctx = GQ.ctx;

  var COINS0   = 14;      /* 初始币 */
  var DOLL_N   = 33;      /* 柜内果叽数量（抓走一只立刻补一只，永远不会空） */
  var ROWS     = 3;       /* 堆几层。层数越多堆越高，但爪子能落的行程就越短 */
  var RARE_P0  = 0.06;    /* 稀有款基础概率 */
  var RARE_STEP= 0.015;   /* 每抓走一只 +1.5% */
  var RARE_CAP = 0.25;
  var WANDER_MAX = 7;     /* 摆动幅度上限（px） */

  var TINT = ['#FFF1DC', '#FFE7EA', '#EAF4FF'];

  var C = null, G = null;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v) }
  function rrect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ---------------- 素材池 ---------------- */
  function dollPool() {
    var p = GQ.slot('doll');
    if (p.length) return p;
    p = GQ.slot('face');
    return p.length ? p : GQ.heroes();
  }
  function rarePool() { return GQ.slot('rare') }

  /* ---------------- 布局 ---------------- */
  function layout() {
    var W = GQ.W, H = GQ.H;
    var padX   = clamp(W * 0.042, 12, 26);
    var ctrlH  = clamp(H * 0.155, H < 560 ? 84 : 100, 150);
    var bodyTop= clamp(H * 0.062, 44, 80);
    var bodyBot= Math.max(bodyTop + 236, H - ctrlH);
    var machineH = bodyBot - bodyTop;

    /* ★ 机身不能无限拉宽。
       桌面浏览器 / 代码预览面板是「宽而矮」的，照抄「吃满宽度」会把柜子
       拉成一条又长又扁的横带：果叽缩成小点、左右各空一大片，观感直接崩。
       所以给机身一个最大宽高比，超出去就整体居中留白 ——
       等于「把一台手机游戏摆在桌面上」，比拉伸好看得多。
       竖屏手机上 machineH * 1.6 远大于可用宽度，这条永远不会生效。 */
    var maxBodyW = Math.max(230, machineH * 1.6);
    var bodyW  = Math.min(W - padX * 2, maxBodyW);
    var bodyX  = padX + (W - padX * 2 - bodyW) / 2;

    var marqueeH = clamp(machineH * 0.085, 24, 42);
    var trayH  = clamp(machineH * 0.150, 40, 74);
    var trayY  = bodyBot - 8 - trayH;
    var cabBottom = trayY - 7;

    var cabX = bodyX + 9, cabW = bodyW - 18;

    /* 柜高按机器高的 60% 定死，多出来的那块给「今日奖品展示台」——
       真实娃娃机也有这一块。不定死的话，柜子会被拉得又高又空，
       果叽堆缩在柜底一小坨（第一版就是这个毛病）。 */
    var panelTop = bodyTop + marqueeH + 10;
    var cabTop = cabBottom - clamp(machineH * 0.60, 220, 560);
    var panel = null;
    if (cabTop - 10 >= panelTop + 36) panel = { y: panelTop, h: cabTop - 10 - panelTop };
    else cabTop = panelTop;                    /* 矮屏 / 横屏：不留展示台，柜子吃满 */
    var cabH = Math.max(150, cabBottom - cabTop);

    /* ★ 竖长屏铁律：果叽的尺寸从「竖直空间」反推，不是按宽度定死。
       取「柜高的 17%」与「柜宽的 20.5%」里更小的那个，同时满足
       ① 堆起来够高，不会缩在柜底一小坨 ② 一行至少放得下 5 只。 */
    var dollH = clamp(Math.min(cabH * 0.17, cabW * 0.205), 32, 76);

    G = {
      padX: bodyX, bodyTop: bodyTop, bodyBot: bodyBot, bodyW: bodyW,
      marqueeH: marqueeH, trayY: trayY, trayH: trayH, panel: panel,
      cabX: cabX, cabW: cabW, cabY: cabTop, cabBottom: cabBottom, cabH: cabH,
      railY: cabTop + clamp(cabH * 0.125, 24, 50),
      floorY: cabBottom - 12,
      dollH: dollH,
      rowStep: dollH * 0.46,
      clawH: clamp(cabW * 0.095, 20, 34),
      exitW: clamp(cabW * 0.145, 36, 54)
    };
    /* 出货口贴紧左下角、尽量窄 —— 它占掉的横向空间，就是果叽堆能铺开的宽度 */
    G.exitX = G.cabX + G.exitW * 0.5 + clamp(cabW * 0.030, 3, 10);
    G.dollMinX = G.cabX + G.exitW + dollH * 0.44;
    G.dollMaxX = G.cabX + cabW - dollH * 0.34;
    if (G.dollMinX > G.dollMaxX - 8) G.dollMinX = G.cabX + dollH * 0.42;
    /* ★ 爪子的活动范围要把「爪子张开时两条爪臂的跨度」算进去，
       不然拖到最边上，爪子会甩到柜子外面去。 */
    var reach = G.clawH * 1.06 + 6;
    G.clawMinX = G.cabX + reach;
    G.clawMaxX = G.cabX + cabW - reach;
    /* 爪子待机高度：挂在轨下约柜高 16% 处，留出「下落行程」这一段空气（约柜高 24%） */
    G.clawRestY = G.railY + clamp(cabH * 0.16, 40, 92);

    /* 爪子的横向活动范围跟机身走；HUD 也跟着机身收窄，
       不然宽屏上三颗药丸会被丢到屏幕最左最右，和居中的机器脱节。 */
    var hud = document.getElementById('hud');
    if (hud) { hud.style.left = bodyX + 'px'; hud.style.right = 'auto'; hud.style.width = bodyW + 'px' }

    /* ★ 视口一变必须「重铺」，不能只「夹住」。
       每只果叽的水平位置存成 0~1 的归一化坐标 nx，按当前柜宽重算；
       y 也按新的行高重算。只 clamp 的话，开机那一下画布还窄
       （代码预览面板、横屏切竖屏都会这样），22 只果叽会被整批夹进
       左侧一小条里叠成一竖列 —— 就是那个「堆叠重叠」的成因。 */
    if (C) {
      C.dolls.forEach(function (d) {
        d.h = dollSize(d.row, d.rare);
        d.baseX = G.dollMinX + d.nx * (G.dollMaxX - G.dollMinX);
        if (!d.falling) { d.y = rowY(d.row); d.x = d.baseX }
      });
      C.claw.x = clamp(C.claw.x, G.clawMinX, G.clawMaxX);
      C.claw.target = clamp(C.claw.target, G.clawMinX, G.clawMaxX);
      /* 闲着的时候按新的活动范围重新摆位；正在下落/归位就只夹住，别打断动画 */
      if (C.claw.phase === 'idle' || C.claw.phase === 'close') {
        C.claw.x = clawXOf(C.claw.nx);
        C.claw.target = clawXOf(C.claw.nx);
      }
    }
  }
  function rowY(row) { return G.floorY - row * G.rowStep }
  function dollSize(row, rare) { return G.dollH * (rare ? 1.06 : 1) * (1 - row * 0.045) }

  /* 爪子的横向位置也存成 0~1（相对活动范围）。
     跟果叽一样：视口一变按新宽度重算，否则拉宽窗口后爪子会留在最左边。 */
  function clawXOf(nx) { return G.clawMinX + clamp(nx, 0, 1) * (G.clawMaxX - G.clawMinX) }
  function clawNxOf(x) {
    return clamp((x - G.clawMinX) / Math.max(1, G.clawMaxX - G.clawMinX), 0, 1);
  }

  /* 柜内果叽实际铺开的宽度 ÷ 柜内可摆放宽度（0~1）。
     视口尺寸一变若忘了「重铺」，这个值会掉到接近 0（全部叠成一列）——
     验收脚本就盯这个数，防止那个堆叠 bug 再回来。 */
  function dollSpread() {
    var lo = 1e9, hi = -1e9, n = 0;
    C.dolls.forEach(function (d) {
      if (d.caught || d.falling) return;
      n++; if (d.baseX < lo) lo = d.baseX; if (d.baseX > hi) hi = d.baseX;
    });
    if (n < 2) return 1;
    return (hi - lo) / Math.max(1, G.dollMaxX - G.dollMinX);
  }

  /* 货堆最高点（最上一层果叽的头顶）。爪子待机的爪尖必须低于它，
     否则「下落行程」为负 —— 爪子一按就已经贴到果叽了，手感会莫名其妙。 */
  function pileTop() {
    var top = G.floorY;
    C.dolls.forEach(function (d) {
      if (d.caught || d.falling) return;      /* 补货中正在下落的算不上「堆顶」 */
      var t = d.y - d.h * 0.95;
      if (t < top) top = t;
    });
    return top;
  }

  /* ---------------- 柜内果叽 ---------------- */
  function rareP() { return Math.min(RARE_CAP, RARE_P0 + (C ? C.caught : 0) * RARE_STEP) }
  function wander() { return Math.min(WANDER_MAX, (C ? C.caught : 0) * 0.55) }

  /* 果叽的水平位置一律存成 0~1 的归一化坐标 nx（相对柜内可摆放宽度），
     baseX 由 nx 现算 —— 这样视口一变，整堆果叽会按新柜宽重新铺开，
     而不是被 clamp 到边界上叠成一列。 */
  function makeDoll(row, nx, y) {
    var rp = rarePool(), fp = dollPool();
    var rare = rp.length > 0 && Math.random() < rareP();
    var pool = rare ? rp : fp;
    var h = dollSize(row, rare);
    var n = nx == null ? Math.random() : clamp(nx, 0, 1);
    var bx = G.dollMinX + n * (G.dollMaxX - G.dollMinX);
    return {
      slug: pool[U.ri(0, pool.length - 1)],
      row: row, rare: rare, h: h, caught: false, nx: n,
      baseX: bx, x: bx,
      y: y == null ? rowY(row) : y,
      ph: Math.random() * 6.283,
      spd: 0.55 + Math.random() * 0.55,
      shake: 0
    };
  }

  function fillCabinet() {
    C.dolls = [];
    /* 先均匀铺开再抖动，比纯随机更像「一堆」：
       纯随机必然出现局部堆成一坨 + 旁边一个空洞。 */
    for (var i = 0; i < DOLL_N; i++) {
      var nx = (i + 0.5 + (Math.random() - 0.5) * 0.8) / DOLL_N;
      C.dolls.push(makeDoll(i % ROWS, nx));
    }
  }

  /* 抓走一只 → 从顶上掉一只新的下来，柜子永远是满的 */
  function refill() {
    var row = U.ri(0, ROWS - 1);
    var d = makeDoll(row, null, G.cabY + G.dollH * 0.6);
    d.falling = true;
    d.vy = 0;
    C.dolls.push(d);
    return d;
  }

  /* ---------------- 一局开始 ---------------- */
  function newGame() {
    C = {
      score: 0, coins: COINS0, caught: 0, rareCaught: 0, missed: 0, slipped: 0,
      combo: 0, bestCombo: 0, t: 0,
      claw: { nx: 0.5, x: (G.clawMinX + G.clawMaxX) / 2,
              target: (G.clawMinX + G.clawMaxX) / 2,
              y: G.clawRestY, open: 1, phase: 'idle', timer: 0, bob: 0 },
      carry: null, fall: null, tray: [], pops: [], toast: null,
      aimTarget: null, shake: 0, bgX: [0, 0, 0], over: false, amp: 0
    };
    GQ.score = 0;
    fillCabinet();
    syncHud();
    var hp = document.getElementById('hint'); if (hp) hp.classList.remove('gone');
  }

  function syncHud() {
    GQ.score = C.score;
    U.setText('#score', C.score);
    U.setText('#coins', C.coins);
    U.setText('#caught', C.caught);
    var cp = document.getElementById('coinPill');
    if (cp) cp.classList.toggle('low', C.coins <= 3);
    var gb = document.getElementById('btnGrab');
    if (gb) gb.classList.toggle('busy', C.claw.phase !== 'idle' || C.coins <= 0);
    var hp = document.getElementById('hint');
    if (hp) hp.classList.toggle('gone', C.caught > 0 || C.t > 7);
  }
  function toast(txt) { C.toast = { txt: txt, t: 1.0 } }
  function pop(x, y, txt, color) { C.pops.push({ x: x, y: y, txt: txt, c: color || '#E8963C', life: 0, max: 0.95 }) }

  /* ---------------- 抓取判定 ---------------- */
  /* 爪子垂线在 x 处、爪尖到 tipY 时，最先碰到的果叽（同一列里最靠上的那只） */
  function targetAt(x) {
    var best = null;
    for (var i = 0; i < C.dolls.length; i++) {
      var d = C.dolls[i];
      if (d.caught || d.falling) continue;
      if (Math.abs(x - d.x) > d.h * 0.44) continue;
      if (!best || d.y < best.y) best = d;
    }
    return best;
  }

  function beginGrab() {
    var cl = C.claw;
    if (cl.phase !== 'idle' || C.coins <= 0) return;
    C.coins--;
    C.aimTarget = targetAt(cl.x);
    cl.phase = 'down';
    cl.open = 1;
    syncHud();
    GQ.SFX.tap();
  }

  /* ---------------- 逻辑 ---------------- */
  function update(dt) {
    if (!C || C.over) return;
    C.t += dt;
    for (var b = 0; b < 3; b++) C.bgX[b] += dt * (7 + b * 5);
    if (C.shake > 0) C.shake = Math.max(0, C.shake - dt * 1.8);
    if (C.toast) { C.toast.t -= dt; if (C.toast.t <= 0) C.toast = null }

    var cl = C.claw, W = G.clawMaxX - G.clawMinX;

    /* --- 飘分 --- */
    for (var pi = C.pops.length - 1; pi >= 0; pi--) {
      var q = C.pops[pi];
      q.life += dt; q.y -= dt * 46;
      if (q.life > q.max) C.pops.splice(pi, 1);
    }

    /* --- 柜里的果叽：播帧 + 摆动 + 补货下落 ---
       摆动只在「待机瞄准」时进行；爪子一开始下落，果叽就被吓住不动了 ——
       难度留在瞄准阶段，判定阶段必须是公平的（否则最后一刻飘走会让人恼火）。 */
    var wantAmp = (cl.phase === 'idle' || cl.phase === 'close') ? wander() : 0;
    C.amp += (wantAmp - C.amp) * Math.min(1, dt * 14);
    var amp = C.amp;
    for (var i = 0; i < C.dolls.length; i++) {
      var d = C.dolls[i];
      if (d.caught) continue;
      if (d.falling) {
        d.vy += 1500 * dt; d.y += d.vy * dt;
        var land = rowY(d.row);
        if (d.y >= land) { d.y = land; d.falling = false; d.vy = 0; d.squash = 1 }
      }
      if (d.shake > 0) d.shake = Math.max(0, d.shake - dt * 2.6);
      if (d.squash > 0) d.squash = Math.max(0, d.squash - dt * 4.5);
      d.x = clamp(d.baseX + Math.sin(C.t * d.spd + d.ph) * amp, G.dollMinX, G.dollMaxX);
    }

    /* --- 爪子：跟手（带一点阻尼，手感更软） --- */
    if (cl.phase === 'idle' || cl.phase === 'close') {
      cl.x += (cl.target - cl.x) * Math.min(1, dt * 20);
    }
    cl.bob = Math.sin(C.t * 2.4) * 1.6;

    var tipY = function () { return cl.y + G.clawH * 1.15 };

    switch (cl.phase) {
      case 'idle':
        cl.y = G.clawRestY + cl.bob;
        cl.open = 1;
        break;

      case 'down': {
        var v = 430;
        cl.y += v * dt;
        var tg = C.aimTarget;
        var hitTop = tg && !tg.caught ? tg.y - tg.h * 0.90 : null;
        var tip = tipY();
        if (hitTop != null && tip >= hitTop + 2) {
          cl.y = hitTop + 2 - G.clawH * 1.15;
          cl.phase = 'close'; cl.timer = 0.26;
        } else if (tip >= G.floorY) {
          cl.y = G.floorY - G.clawH * 1.15;
          cl.phase = 'close'; cl.timer = 0.26;
        }
        break;
      }

      case 'close': {
        cl.timer -= dt;
        var k = 1 - clamp(cl.timer / 0.26, 0, 1);
        cl.open = 1 - k;
        if (cl.timer <= 0) resolveGrab();
        break;
      }

      case 'up': {
        cl.y -= 620 * dt;
        if (cl.y <= G.clawRestY) { cl.y = G.clawRestY; cl.phase = 'travel' }
        if (C.carry) { C.carry.x = cl.x; C.carry.y = cl.y + G.clawH * 1.5 + C.carry.h * 0.5 }
        break;
      }

      case 'travel': {
        var dx = G.exitX - cl.x;
        var step = 560 * dt;
        if (Math.abs(dx) <= step) { cl.x = G.exitX; cl.phase = 'release'; cl.timer = 0.16 }
        else cl.x += Math.sign(dx) * step;
        if (C.carry) { C.carry.x = cl.x; C.carry.y = cl.y + G.clawH * 1.5 + C.carry.h * 0.5 }
        break;
      }

      case 'release': {
        cl.timer -= dt;
        cl.open = clamp(1 - cl.timer / 0.16, 0, 1);
        if (C.carry) {
          C.carry.x = cl.x; C.carry.y = cl.y + G.clawH * 1.5 + C.carry.h * 0.5;
          if (cl.timer <= 0) {
            C.fall = { doll: C.carry, y: C.carry.y, vy: 60 };
            C.carry = null;
            cl.phase = 'settle'; cl.timer = 0.55;
          }
        } else if (cl.timer <= 0) { cl.phase = 'idle' }
        break;
      }

      case 'settle':
        cl.timer -= dt;
        if (cl.timer <= 0) cl.phase = 'idle';
        break;
    }

    /* --- 掉进出货口的果叽 --- */
    if (C.fall) {
      C.fall.vy += 1500 * dt;
      C.fall.y += C.fall.vy * dt;
      if (C.fall.y >= G.cabBottom + 10) {
        var dd = C.fall.doll;
        C.fall = null;
        collect(dd);
      }
    }

    /* --- 收工判定 --- */
    if (C.coins <= 0 && cl.phase === 'idle' && !C.fall && !C.over) {
      C.over = true;
      setTimeout(finish, 260);
    }
  }

  function resolveGrab() {
    var cl = C.claw, tg = C.aimTarget;
    if (!tg || tg.caught) {          /* 爪子底下没东西 */
      C.missed++; C.combo = 0;
      GQ.SFX.bad();
      toast('空手而归…');
      cl.phase = 'up';
      syncHud();
      return;
    }
    var d = Math.abs(cl.x - tg.x) / (tg.h * 0.5);
    var p = d < 0.50 ? 1 : (d < 0.90 ? 0.60 : 0);
    if (Math.random() < p) {
      tg.caught = true;
      C.carry = tg;
      cl.phase = 'up';
      GQ.SFX.ok();
      C.shake = 0.18;
    } else {
      C.slipped++; C.combo = 0;
      tg.shake = 1;
      cl.phase = 'up';
      GQ.SFX.bad();
      toast(d < 0.9 ? '滑掉了！' : '差一点点…');
      syncHud();
    }
  }

  function collect(d) {
    C.caught++;
    if (d.rare) C.rareCaught++;
    C.combo++;
    if (C.combo > C.bestCombo) C.bestCombo = C.combo;
    var mult = 1 + Math.min(2, Math.floor(C.combo / 2));
    var pts = 20 * (d.rare ? 3 : 1) * mult;
    C.score += pts;
    C.tray.push({ slug: d.slug, rare: d.rare, at: C.t });
    if (C.tray.length > 10) C.tray.shift();
    pop(G.exitX + 26, G.trayY + 6, '+' + pts, d.rare ? '#E8963C' : '#5FA463');
    if (d.rare) toast('稀有款！×3');
    else if (C.combo >= 3) toast(C.combo + ' 连抓！');
    GQ.SFX.combo();
    /* 从柜里摘掉，补一只新的 */
    var ix = C.dolls.indexOf(d);
    if (ix >= 0) C.dolls.splice(ix, 1);
    refill();
    syncHud();
  }

  function finish() {
    var ov = GQ.META.over || [];
    var title = C.caught >= 9 ? (ov[0] || '果叽抓了满满一兜！')
              : (C.caught >= 4 ? (ov[1] || '果叽抓得还不错') : (ov[2] || '果叽一只都没夹住…'));
    GQ.endGame({
      score: C.score, title: title,
      rows: [['抓到的果叽', C.caught], ['稀有款', C.rareCaught],
             ['最长连抓', C.bestCombo], ['空手次数', C.missed + C.slipped]]
    });
  }

  /* ---------------- 绘制 ---------------- */
  function drawDoll(d, alpha) {
    var meta = GQ.meta(d.slug); if (!meta) return;
    var fi = GQ.frameAt(meta, GQ.clock + d.ph * 640);
    var h = d.h * (d.squash > 0 ? (1 - d.squash * 0.14) : 1);
    var sx = d.x + (d.shake > 0 ? Math.sin(C.t * 46) * 5 * d.shake : 0);
    var a = alpha == null ? 1 : alpha;

    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(126,100,76,.13)';
    ctx.beginPath(); ctx.ellipse(sx, d.y - 1, d.h * 0.35, d.h * 0.075, 0, 0, 7); ctx.fill();
    if (d.rare) {
      var pulse = 1 + Math.sin(C.t * 3.2 + d.ph) * 0.06;
      var gg = ctx.createRadialGradient(sx, d.y - h * 0.45, 2, sx, d.y - h * 0.45, h * 0.74 * pulse);
      gg.addColorStop(0, 'rgba(255,214,102,.78)');
      gg.addColorStop(1, 'rgba(255,214,102,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(sx, d.y - h * 0.45, h * 0.74 * pulse, 0, 7); ctx.fill();
    }
    GQ.drawFrame(d.slug, fi, sx, d.y, h, { anchor: 'bottom' });
    ctx.globalAlpha = 1;
  }

  function drawMachine() {
    var W = GQ.W;
    /* 机身 */
    rrect(G.padX, G.bodyTop, G.bodyW, G.bodyBot - G.bodyTop, 22);
    ctx.fillStyle = '#FFF7EC'; ctx.fill();
    ctx.strokeStyle = 'rgba(46,46,46,.10)'; ctx.lineWidth = 3; ctx.stroke();

    /* 顶棚招牌 */
    var mx = G.padX + 7, my = G.bodyTop + 7, mw = G.bodyW - 14, mh = G.marqueeH;
    rrect(mx, my, mw, mh, 15);
    var mg = ctx.createLinearGradient(0, my, 0, my + mh);
    mg.addColorStop(0, '#FFD65E'); mg.addColorStop(1, '#F2A93B');
    ctx.fillStyle = mg; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    rrect(mx + 5, my + 4, mw - 10, mh * 0.36, 10); ctx.fill();

    /* 招牌：果叽小徽 + 机器名，整组居中对齐 */
    var hero = GQ.hero();
    var hh = mh * 0.78;
    ctx.save();
    ctx.font = '900 ' + Math.round(Math.min(mh * 0.46, W * 0.042)) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    var label = '果叽夹娃娃机';
    var tw2 = ctx.measureText(label).width;
    var gx = mx + (mw - (hh + 7 + tw2)) / 2;
    if (hero) GQ.drawFrame(hero, GQ.frameAt(GQ.meta(hero), GQ.clock),
                           gx + hh * 0.5, my + mh * 0.92, hh, { anchor: 'bottom' });
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(184,116,20,.42)'; ctx.lineWidth = 3;
    ctx.strokeText(label, gx + hh + 7, my + mh * 0.54);
    ctx.fillText(label, gx + hh + 7, my + mh * 0.54);
    ctx.restore();
  }

  /* 奖品展示台：真实娃娃机在玻璃柜上方也有一块。
     这里放三只「今日奖品」（取稀有款），既填掉了上方留白，
     又提前告诉玩家「今天值钱的是什么」。 */
  function drawPanel() {
    var P = G.panel; if (!P) return;
    var px = G.padX + 9, pw = G.cabW, py = P.y, ph = P.h;

    rrect(px, py, pw, ph, 14);
    var pg = ctx.createLinearGradient(0, py, 0, py + ph);
    pg.addColorStop(0, '#FFF4E0'); pg.addColorStop(1, '#FFE7C4');
    ctx.fillStyle = pg; ctx.fill();
    ctx.strokeStyle = 'rgba(46,46,46,.10)'; ctx.lineWidth = 2.5; ctx.stroke();

    /* ★ 先把「今日奖品」那条标题带整个让出来，奖品只在剩下的高度里排。
       不预留的话，面板一被压扁，标题就会被奖品糊住 —— 这就是重叠的源头。 */
    var labelH = clamp(ph * 0.26, 17, 30);
    var shelfY = py + ph - 6;                    /* 台面贴着面板下沿 */
    var sh = Math.max(16, (shelfY - (py + labelH)) * 1.02);

    var seen = {}, cand = rarePool().concat(dollPool()), pool = [];
    cand.forEach(function (s) { if (s && !seen[s]) { seen[s] = 1; pool.push(s) } });
    var n = Math.max(1, Math.min(3, pool.length));
    /* 等分列宽（不是「左右各留 10%」再除）—— 列宽相等，奖品间距才均匀 */
    var colw = pw / n;

    /* 灯带 */
    for (var li = 0; li < n; li++) {
      var lx = px + colw * (li + 0.5), ly = py + 6;
      var lgr = ctx.createRadialGradient(lx, ly, 1, lx, ly, 20);
      lgr.addColorStop(0, 'rgba(255,226,150,.9)');
      lgr.addColorStop(1, 'rgba(255,226,150,0)');
      ctx.fillStyle = lgr;
      ctx.beginPath(); ctx.arc(lx, ly, 20, 0, 7); ctx.fill();
    }

    /* 聚光锥 */
    for (var i = 0; i < n; i++) {
      var cx = px + colw * (i + 0.5);
      var top = py + labelH;
      var sg = ctx.createLinearGradient(cx, top, cx, shelfY);
      sg.addColorStop(0, 'rgba(255,214,120,.36)');
      sg.addColorStop(1, 'rgba(255,214,120,0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(cx - colw * 0.13, top);
      ctx.lineTo(cx + colw * 0.13, top);
      ctx.lineTo(cx + colw * 0.40, shelfY);
      ctx.lineTo(cx - colw * 0.40, shelfY);
      ctx.closePath(); ctx.fill();
    }

    /* 台面 */
    ctx.fillStyle = '#E7D3B4';
    rrect(px + pw * 0.06, shelfY, pw * 0.88, 6, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    rrect(px + pw * 0.06, shelfY, pw * 0.88, 2.5, 2); ctx.fill();

    for (var j = 0; j < n; j++) {
      var cx2 = px + colw * (j + 0.5);
      var slug = pool[j % pool.length];
      if (!GQ.meta(slug)) continue;
      GQ.drawFrame(slug, GQ.frameAt(GQ.meta(slug), GQ.clock + j * 480),
                   cx2, shelfY + 1, sh, { anchor: 'bottom' });
    }

    ctx.save();
    ctx.font = '900 ' + Math.round(clamp(labelH * 0.52, 10, 14)) + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(178,146,100,.92)';
    ctx.fillText('今日奖品', px + 12, py + labelH * 0.56);
    ctx.restore();
  }

  function drawCabinet() {
    /* 柜内背景 */
    var g = ctx.createLinearGradient(0, G.cabY, 0, G.cabBottom);
    g.addColorStop(0, '#F2FBFF'); g.addColorStop(0.6, '#FBFDFF'); g.addColorStop(1, '#F3F6FA');
    rrect(G.cabX, G.cabY, G.cabW, G.cabBottom - G.cabY, 14);
    ctx.fillStyle = g; ctx.fill();

    /* 背板上的小圆点底纹 —— 让空柜也不空 */
    ctx.fillStyle = 'rgba(206,224,236,.5)';
    for (var y = G.cabY + 16; y < G.cabBottom - 8; y += 26) {
      for (var x = G.cabX + 14 + ((y / 26) % 2) * 13; x < G.cabX + G.cabW - 8; x += 26) {
        ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 7); ctx.fill();
      }
    }

    /* 柜顶：暖光带 + 一串三角彩旗 —— 把上方那片留白填掉，
       但用「贴纸感」的轻元素，不抢果叽的视觉主角位置。 */
    var topGlow = ctx.createLinearGradient(0, G.cabY, 0, G.cabY + 96);
    topGlow.addColorStop(0, 'rgba(255,228,152,.32)');
    topGlow.addColorStop(1, 'rgba(255,228,152,0)');
    ctx.fillStyle = topGlow;
    rrect(G.cabX, G.cabY, G.cabW, 96, 14); ctx.fill();

    var FLAG = ['#FFC0CB', '#FFD873', '#A8DCEF', '#B6E3A8', '#F5A0A0', '#FFD873'];
    var fn = 9, fx0 = G.cabX + 14, fx1 = G.cabX + G.cabW - 14, fy0 = G.cabY + 3, sag = 26;
    var fyy = function (t) { return fy0 + sag * 4 * t * (1 - t) };
    ctx.save();
    ctx.strokeStyle = 'rgba(46,46,46,.16)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (var s = 0; s <= 30; s++) {
      var st = s / 30, sx = fx0 + (fx1 - fx0) * st;
      if (s === 0) ctx.moveTo(sx, fyy(st)); else ctx.lineTo(sx, fyy(st));
    }
    ctx.stroke();
    var fh = clamp(G.cabW * 0.038, 11, 17), fw = fh * 0.92;
    for (var fi = 0; fi < fn; fi++) {
      var ft = (fi + 0.5) / fn, fcx = fx0 + (fx1 - fx0) * ft, fcy = fyy(ft);
      ctx.beginPath();
      ctx.moveTo(fcx - fw / 2, fcy);
      ctx.lineTo(fcx + fw / 2, fcy);
      ctx.lineTo(fcx, fcy + fh);
      ctx.closePath();
      ctx.fillStyle = FLAG[fi % FLAG.length]; ctx.fill();
      ctx.strokeStyle = 'rgba(46,46,46,.13)'; ctx.lineWidth = 1.2; ctx.stroke();
    }
    ctx.restore();

    /* 柜底 */
    ctx.fillStyle = '#EADCC8';
    ctx.fillRect(G.cabX + 3, G.floorY, G.cabW - 6, G.cabBottom - G.floorY + 3);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.fillRect(G.cabX + 3, G.floorY, G.cabW - 6, 3);

    /* 出货口：真正「陷下去」的洞 —— 外圈暗边 + 深色底 + 后沿高光 */
    var hx = G.exitX - G.exitW / 2, hy = G.floorY - 4, hb = G.cabBottom + 4;
    ctx.fillStyle = 'rgba(120,96,72,.20)';
    rrect(hx - 2.5, hy - 2.5, G.exitW + 5, hb - hy + 5, 11); ctx.fill();
    rrect(hx, hy, G.exitW, hb - hy, 9);
    var hg = ctx.createLinearGradient(0, hy, 0, hb);
    hg.addColorStop(0, '#4A443C'); hg.addColorStop(0.45, '#2A2620'); hg.addColorStop(1, '#100E0C');
    ctx.fillStyle = hg; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.20)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(hx + 6, hy + 2.5); ctx.lineTo(hx + G.exitW - 6, hy + 2.5);
    ctx.stroke();

    /* 滑道区：洞口上方做一块浅色斜坡 + 「出口」小字。
       不然左边那块空地看起来像「没做完」，而不是「出货用的」。 */
    var slideH = G.exitW * 0.62;
    var rg = ctx.createLinearGradient(0, G.floorY - slideH, 0, G.floorY);
    rg.addColorStop(0, 'rgba(255,255,255,0)');
    rg.addColorStop(1, 'rgba(222,200,170,.60)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(hx - 5, G.floorY - slideH);
    ctx.lineTo(hx + G.exitW + 5, G.floorY - slideH);
    ctx.lineTo(hx + G.exitW, G.floorY);
    ctx.lineTo(hx, G.floorY);
    ctx.closePath(); ctx.fill();

    ctx.save();
    ctx.font = '900 10px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(166,140,106,.9)';
    ctx.fillText('出 口', G.exitX, G.floorY - slideH - 9);
    ctx.restore();
  }

  function drawRailAndClaw() {
    var cl = C.claw;
    /* 轨道 */
    var rz = 4;
    rrect(G.cabX + 8, G.railY - rz, G.cabW - 16, rz * 2, rz);
    ctx.fillStyle = '#C9BFB1'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    rrect(G.cabX + 8, G.railY - rz, G.cabW - 16, 2.5, 2); ctx.fill();

    /* 天车 */
    var tw = G.cabW * 0.20;
    rrect(cl.x - tw / 2, G.railY - 9, tw, 16, 6);
    ctx.fillStyle = '#B7ADA0'; ctx.fill();
    ctx.strokeStyle = 'rgba(46,46,46,.18)'; ctx.lineWidth = 2; ctx.stroke();

    /* 骑在横梁上的果叽（玩家的那只当操作员）。
       让它「跨坐」在轨道上、脚落在轨道下方一点，而不是整只站在轨道上面 ——
       这样尺寸能放大一截，又不会顶出柜顶去盖住「今日奖品」展示台。 */
    var hero = GQ.hero();
    if (hero) {
      var perch = G.railY + G.clawH * 0.55;
      var room = Math.max(16, (perch - G.cabY - 3) / 0.95);   /* 上方净空，硬上限 */
      var hh = Math.min(clamp(G.cabW * 0.13, 30, 64), room);
      GQ.drawFrame(hero, GQ.frameAt(GQ.meta(hero), GQ.clock),
                   cl.x, perch, hh, { anchor: 'bottom' });
    }

    /* 吊绳 */
    ctx.strokeStyle = '#9E9488'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cl.x, G.railY + 6);
    ctx.lineTo(cl.x, cl.y - G.clawH * 0.5);
    ctx.stroke();

    /* 瞄准辅助线 */
    if (cl.phase === 'idle') {
      ctx.save();
      ctx.setLineDash([6, 7]);
      ctx.strokeStyle = 'rgba(232,150,60,.30)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cl.x, cl.y + G.clawH * 1.2);
      ctx.lineTo(cl.x, G.floorY);
      ctx.stroke();
      ctx.restore();
    }

    /* 爪子 */
    var spread = G.clawH * (0.20 + cl.open * 0.86);
    var tip = cl.y + G.clawH * 1.15;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#8E8579'; ctx.lineWidth = Math.max(4, G.clawH * 0.19);
    [-1, 0, 1].forEach(function (k) {
      if (k === 0) return;
      ctx.beginPath();
      ctx.moveTo(cl.x + k * G.clawH * 0.12, cl.y);
      ctx.quadraticCurveTo(cl.x + k * spread * 0.55, cl.y + G.clawH * 0.68, cl.x + k * spread, tip);
      ctx.stroke();
    });
    ctx.beginPath();
    ctx.moveTo(cl.x, cl.y);
    ctx.lineTo(cl.x, tip - G.clawH * 0.18);
    ctx.stroke();

    /* 爪心连接块 */
    rrect(cl.x - G.clawH * 0.34, cl.y - G.clawH * 0.62, G.clawH * 0.68, G.clawH * 0.78, 6);
    ctx.fillStyle = '#CFC6BA'; ctx.fill();
    ctx.strokeStyle = 'rgba(46,46,46,.22)'; ctx.lineWidth = 2; ctx.stroke();

    /* 抓在手里的果叽 */
    if (C.carry) {
      ctx.fillStyle = 'rgba(126,100,76,.12)';
      var cd = C.carry;
      GQ.drawFrame(cd.slug, GQ.frameAt(GQ.meta(cd.slug), GQ.clock + cd.ph * 640),
                   cd.x, cd.y, cd.h, { anchor: 'center' });
    }
    /* 正在掉进出货口的果叽 */
    if (C.fall) {
      var f = C.fall;
      GQ.drawFrame(f.doll.slug, GQ.frameAt(GQ.meta(f.doll.slug), GQ.clock + f.doll.ph * 640),
                   G.exitX, f.y + f.doll.h * 0.4, f.doll.h,
                   { anchor: 'center', alpha: clamp(1 - Math.max(0, f.y - G.cabBottom) / 46, 0, 1) });
    }
  }

  function drawTray() {
    var tx = G.padX + 9, tw = G.bodyW - 18, th = G.trayH;
    rrect(tx, G.trayY, tw, th, 12);
    ctx.fillStyle = 'rgba(255,255,255,.72)'; ctx.fill();
    ctx.strokeStyle = 'rgba(46,46,46,.08)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    ctx.font = '900 11px "PingFang SC",sans-serif';
    ctx.fillStyle = '#B3A597'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    /* 标签宽度实测出来，果叽从标签右边再起排。
       写死 inset 的话，窄屏上「已抓到」会被第一只果叽压住。 */
    var lw = ctx.measureText('已抓到').width;
    ctx.fillText('已抓到', tx + 10, G.trayY + th * 0.5);
    ctx.restore();

    var n = C.tray.length, show = Math.min(n, 8);
    var hh = th * 0.62, cy = G.trayY + th * 0.52;
    var x0 = tx + 10 + lw + 10, x1 = tx + tw - 10;
    /* 8 个格子先各留出果叽自身宽度，再均分剩下的 —— 最后一只不会顶出托盘右边 */
    var gap = Math.max(2, (x1 - x0 - hh) / 8);
    for (var i = 0; i < show; i++) {
      var t = C.tray[n - show + i];
      GQ.drawFrame(t.slug, GQ.frameAt(GQ.meta(t.slug), GQ.clock), x0 + hh / 2 + gap * (i + 0.5),
                   cy, hh, { anchor: 'center' });
    }
    if (n > 8) {
      ctx.save();
      ctx.font = '900 12px "PingFang SC",sans-serif';
      ctx.fillStyle = '#B3A597'; ctx.textAlign = 'right';
      ctx.fillText('+' + (n - 8), tx + tw - 9, G.trayY + th * 0.55);
      ctx.restore();
    }
  }

  function draw() {
    if (!C || !G) return;
    var W = GQ.W, H = GQ.H;
    ctx.setTransform(GQ.DPR, 0, 0, GQ.DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);

    /* 背景 */
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#FFF4E8'); sky.addColorStop(0.5, '#FDF6EE'); sky.addColorStop(1, '#FBE8DF');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    for (var b = 0; b < 3; b++) {
      var cy = H * (0.18 + b * 0.27), cx = ((C.bgX[b] + b * W * 0.5) % (W + 170)) - 85;
      ctx.fillStyle = 'rgba(245,195,59,' + (0.13 - b * 0.03) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, 44 - b * 7, 0, 7); ctx.fill();
    }

    ctx.save();
    if (C.shake > 0) {
      var s = C.shake * 10;
      ctx.translate((Math.random() * 2 - 1) * s, (Math.random() * 2 - 1) * s);
    }

    drawMachine();
    drawPanel();
    drawCabinet();

    /* 柜内果叽：后排先画，前排压在上面 —— 才像一堆 */
    for (var row = ROWS - 1; row >= 0; row--) {
      for (var i = 0; i < C.dolls.length; i++) {
        var d = C.dolls[i];
        if (d.caught || d.row !== row) continue;
        if (d.falling) continue;
        drawDoll(d);
      }
    }
    /* 补货掉落的果叽画在最上面，落下来时能被看见 */
    for (var j = 0; j < C.dolls.length; j++) {
      var fd = C.dolls[j];
      if (fd.falling && !fd.caught) drawDoll(fd);
    }

    drawRailAndClaw();

    /* 玻璃罩：淡光 + 两道高光斜条 */
    rrect(G.cabX, G.cabY, G.cabW, G.cabBottom - G.cabY, 14);
    ctx.fillStyle = 'rgba(180,222,244,.13)'; ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.30)';
    ctx.beginPath();
    ctx.moveTo(G.cabX + G.cabW * 0.06, G.cabBottom);
    ctx.lineTo(G.cabX + G.cabW * 0.26, G.cabY);
    ctx.lineTo(G.cabX + G.cabW * 0.36, G.cabY);
    ctx.lineTo(G.cabX + G.cabW * 0.16, G.cabBottom);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(G.cabX + G.cabW * 0.62, G.cabY, G.cabW * 0.07, G.cabBottom - G.cabY);
    ctx.restore();

    /* 柜框 */
    rrect(G.cabX, G.cabY, G.cabW, G.cabBottom - G.cabY, 14);
    ctx.strokeStyle = 'rgba(46,46,46,.16)'; ctx.lineWidth = 3.5; ctx.stroke();

    drawTray();

    /* 飘分 */
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    C.pops.forEach(function (q) {
      ctx.globalAlpha = 1 - q.life / q.max;
      ctx.font = '900 ' + Math.round(Math.min(GQ.W * 0.052, 24)) + 'px "PingFang SC",sans-serif';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 5;
      ctx.strokeText(q.txt, q.x, q.y);
      ctx.fillStyle = q.c; ctx.fillText(q.txt, q.x, q.y);
    });
    ctx.globalAlpha = 1;

    /* 连抓徽章：贴在柜子右上角（不再用大字，否则和中间那行 toast 撞成两句一样的话） */
    if (C.combo >= 3) {
      var cw = Math.max(62, G.cabW * 0.20), ch = 22;
      var cxx = G.cabX + G.cabW - cw - 9, cyy = G.cabY + 9;
      rrect(cxx, cyy, cw, ch, 11);
      ctx.fillStyle = 'rgba(232,150,60,.94)'; ctx.fill();
      ctx.font = '900 12px "PingFang SC",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.fillText('×' + C.combo + ' 连抓', cxx + cw / 2, cyy + ch / 2 + 0.5);
    }
    /* toast */
    if (C.toast) {
      ctx.globalAlpha = Math.min(1, C.toast.t * 1.8);
      ctx.font = '900 ' + Math.round(Math.min(GQ.W * 0.072, 30)) + 'px "PingFang SC",sans-serif';
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 7;
      ctx.strokeText(C.toast.txt, GQ.W / 2, G.cabY + (G.cabBottom - G.cabY) * 0.46);
      ctx.fillStyle = '#E8963C';
      ctx.fillText(C.toast.txt, GQ.W / 2, G.cabY + (G.cabBottom - G.cabY) * 0.46);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    ctx.restore();
  }

  /* ---------------- 输入 ---------------- */
  function bind() {
    var cv = GQ.cv;
    function moveTo(clientX) {
      if (GQ.state !== 'playing' || !C) return;
      if (C.claw.phase !== 'idle') return;
      var r = cv.getBoundingClientRect();
      C.claw.nx = clawNxOf(clientX - r.left);
      C.claw.target = clawXOf(C.claw.nx);
    }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); moveTo(e.clientX) }, { passive: false });
    cv.addEventListener('pointermove', function (e) { e.preventDefault(); moveTo(e.clientX) }, { passive: false });
    window.addEventListener('keydown', function (e) {
      if (!C || GQ.state !== 'playing') return;
      if (e.key === 'ArrowLeft') { C.claw.nx = clamp(C.claw.nx - 0.045, 0, 1); C.claw.target = clawXOf(C.claw.nx) }
      if (e.key === 'ArrowRight') { C.claw.nx = clamp(C.claw.nx + 0.045, 0, 1); C.claw.target = clawXOf(C.claw.nx) }
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); beginGrab() }
    });
    var gb = document.getElementById('btnGrab');
    if (gb) gb.addEventListener('pointerdown', function (e) { e.preventDefault(); beginGrab() }, { passive: false });
  }

  GQ.boot({
    id: 'claw',
    layout: layout,

    init: function () {
      if (!G) layout();
      newGame();
      var av = document.getElementById('hudAv');
      if (av) av.src = (GQ.portrait(GQ.hero()) || {}).src || '';
      return null;
    },

    update: update,
    draw: draw,

    probe: function () {
      return {
        score: C.score, coins: C.coins, caught: C.caught, rare: C.rareCaught,
        missed: C.missed, slipped: C.slipped, combo: C.combo, bestCombo: C.bestCombo,
        phase: C.claw.phase, dolls: C.dolls.length,
        tray: C.tray.length, wander: Math.round(wander() * 10) / 10,
        clawX: Math.round(C.claw.x), clawY: Math.round(C.claw.y),
        /* 布局自检：spread = 果叽堆实际铺开宽度 / 柜内可摆放宽度。
           视口一变忘了重铺的话它会掉到接近 0（叠成一列）。 */
        spread: Math.round(dollSpread() * 100) / 100,
        geo: { W: Math.round(GQ.W), H: Math.round(GQ.H),
               bodyW: Math.round(G.bodyW), bodyX: Math.round(G.padX),
               bodyTop: Math.round(G.bodyTop),
               cabY: Math.round(G.cabY), cabH: Math.round(G.cabH), dollH: Math.round(G.dollH),
               trayY: Math.round(G.trayY), trayH: Math.round(G.trayH),
               panel: !!G.panel,
               /* 爪子待机的爪尖高度、货堆最高点、托盘底 —— 验收靠这三个数判断
                  「爪子有没有下落空间」「元素有没有互相压住」。 */
               clawRest: Math.round(G.clawRestY), clawH: Math.round(G.clawH),
               pileTop: Math.round(pileTop()), floorY: Math.round(G.floorY) }
      };
    },

    forceFinish: finish,

    /* 验收用：瞄准柜里最靠上的那只 → 等爪子到位 → 按「抓」（派发真实 pointer 事件） */
    autoPlay: function (ms) {
      return new Promise(function (resolve) {
        var t0 = Date.now(), aiming = false, aimUntil = 0;
        function done() {
          return { score: C.score, coins: C.coins, caught: C.caught, rare: C.rareCaught,
                   missed: C.missed, slipped: C.slipped };
        }
        function tick() {
          if (Date.now() - t0 > ms || GQ.state !== 'playing' || !C) return resolve(done());
          var cv = GQ.cv;
          if (C.claw.phase === 'idle' && C.coins > 0) {
            if (!aiming) {
              var list = C.dolls.filter(function (d) { return !d.caught && !d.falling });
              list.sort(function (a, b) { return a.y - b.y });
              var tg = list[0];
              if (tg) {
                var r = cv.getBoundingClientRect();
                cv.dispatchEvent(new PointerEvent('pointermove',
                  { clientX: r.left + tg.x, clientY: r.top + r.height * 0.5, bubbles: true }));
                aiming = true; aimUntil = Date.now() + 420;
              }
            } else if (Date.now() >= aimUntil) {
              aiming = false;
              var gb = document.getElementById('btnGrab');
              if (gb) gb.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            }
          }
          setTimeout(tick, 90);
        }
        tick();
      });
    }
  });
  bind();
})();
</script>
</body>
</html>
