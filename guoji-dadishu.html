<title>果叽打地鼠 · 果叽小游戏</title>
<style>
/* ============================================================
   1. 设计令牌
   ============================================================ */
:root{
  --bg-1:#FFF9F0; --bg-2:#FFEFD8;
  --surface:#FFFFFF; --surface-2:#FFF7EC;
  --line:#F0DFC4; --line-strong:#E4C9A0;

  --text:#3A2A16; --text-2:#8A7355; --text-3:#B29C7E;

  --guoji:#FFB347; --guoji-deep:#EE8A22;
  --field-1:#D4F5B8; --field-2:#A9E28C; --field-3:#7FCB63;
  --soil:#3A2717; --soil-2:#5B3D26;

  --score:#F2643C; --gold:#F5B301; --danger:#E5484D;
  --good:#2FA36B; --combo:#E85D9E;

  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --sh-1:0 2px 10px rgba(140,95,40,.10);
  --sh-2:0 8px 28px rgba(140,95,40,.16);
  --sh-3:0 18px 48px rgba(120,80,30,.22);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.22,.9,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg-1:#1E1812; --bg-2:#241C14;
    --surface:#2C231A; --surface-2:#332818;
    --line:#463526; --line-strong:#5C452F;
    --text:#F6EBDC; --text-2:#BFA98C; --text-3:#8E7A60;
    --field-1:#3E5B33; --field-2:#35502B; --field-3:#2A4022;
    --soil:#120C07; --soil-2:#2A1D12;
    --sh-1:0 2px 10px rgba(0,0,0,.4);
    --sh-2:0 8px 28px rgba(0,0,0,.5);
    --sh-3:0 18px 48px rgba(0,0,0,.6);
  }
}

/* ============================================================
   2. 基础
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  background:linear-gradient(170deg,var(--bg-1) 0%,var(--bg-2) 100%);
  color:var(--text);
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;
  -webkit-user-select:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

.app{
  height:100dvh;
  max-width:560px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:clamp(6px,1.4vh,12px);
  padding:max(8px,env(safe-area-inset-top)) clamp(10px,3vw,18px) max(8px,env(safe-area-inset-bottom));
}

/* ============================================================
   3. 顶栏
   ============================================================ */
.topbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding-top:2px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{
  width:36px;height:36px;flex:0 0 auto;border-radius:11px;
  display:grid;place-items:center;
  font-size:17px;font-weight:800;color:#fff;
  background:linear-gradient(150deg,#FFD27A,var(--guoji-deep));
  box-shadow:0 3px 10px rgba(238,138,34,.4), inset 0 -2px 0 rgba(0,0,0,.12);
}
.brand b{display:block;font-size:14.5px;letter-spacing:.2px;line-height:1.25;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--text-3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.topbtns{display:flex;gap:8px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;font-size:16px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--sh-1);
  display:grid;place-items:center;
  transition:transform .15s var(--ease-out),box-shadow .15s;
}
.icon-btn:active{transform:scale(.92)}
.icon-btn.off{opacity:.42}

/* ============================================================
   4. HUD
   ============================================================ */
.hud{
  flex:0 0 auto;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-md);
  padding:8px 14px;
  box-shadow:var(--sh-1);
}
.hud-box{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.hud-box:last-child{align-items:center}
.hud-box .k{font-size:10.5px;color:var(--text-3);letter-spacing:1px}
.hud-box .v{
  font-size:clamp(19px,5.4vw,25px);font-weight:800;line-height:1.1;
  font-variant-numeric:tabular-nums;
  transition:transform .12s var(--ease-pop);
}
.hud-box .v.bump{transform:scale(1.22)}
#uiScore{color:var(--score)}
#uiCombo{color:var(--combo)}
#uiCombo.zero{color:var(--text-3)}

.timer{position:relative;width:62px;height:62px;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--line);stroke-width:4}
.tr-fg{
  fill:none;stroke:var(--guoji);stroke-width:4;stroke-linecap:round;
  stroke-dasharray:106.81;stroke-dashoffset:0;
  transition:stroke-dashoffset .18s linear,stroke .3s;
}
.timer.low .tr-fg{stroke:var(--danger)}
.timer #uiTime{
  position:relative;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;
  color:var(--text);
}
.timer.low #uiTime{color:var(--danger);animation:pulseWarn .8s infinite}
@keyframes pulseWarn{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}

/* 难度条 */
.diffbar{
  flex:0 0 auto;position:relative;height:23px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);overflow:hidden;
}
.diffbar-fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:linear-gradient(90deg,#9BE07A,#FFD27A 42%,#FF9F45 70%,#F2643C);
  border-radius:99px;
  transition:width .3s linear;
}
.diffbar-fill.rush{animation:rushGlow .7s infinite}
@keyframes rushGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.diffbar-label{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;font-weight:700;letter-spacing:1.5px;
  color:#4A2E10;text-shadow:0 1px 0 rgba(255,255,255,.45);
}
@media (prefers-color-scheme:dark){ .diffbar-label{color:#FFF3DF;text-shadow:0 1px 2px rgba(0,0,0,.6)} }

/* ============================================================
   5. 场地
   ============================================================ */
.stage{
  flex:1 1 auto;position:relative;min-height:0;
  border-radius:var(--r-lg);
  background:
    radial-gradient(ellipse 120% 70% at 50% -10%,var(--field-1) 0%,var(--field-2) 48%,var(--field-3) 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22), var(--sh-2), inset 0 -18px 34px rgba(50,90,35,.22);
  overflow:hidden;
  display:grid;place-items:center;
  padding:clamp(8px,2.4vw,18px);
}
.stage::after{ /* 草地纹理 */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(circle at 12% 20%,rgba(255,255,255,.28) 0 1.6px,transparent 2px),
    radial-gradient(circle at 62% 74%,rgba(255,255,255,.22) 0 1.4px,transparent 2px),
    radial-gradient(circle at 86% 34%,rgba(255,255,255,.2) 0 1.2px,transparent 2px);
  background-size:56px 56px,72px 72px,44px 44px;
}
.grid{
  position:relative;z-index:2;
  display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(4px,1.4vw,10px);
  width:min(100%,420px);aspect-ratio:1/1;max-height:100%;
}
.fx{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  width:100%;height:100%;
}

/* 单个洞 */
.hole{
  position:relative;aspect-ratio:1/1;
  border-radius:18px;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.hole .mound{ /* 洞口周围的土堆 */
  position:absolute;left:3%;right:3%;bottom:9%;height:34%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.32),transparent 64%);
  z-index:1;
}
.hole .pit{ /* 洞：椭圆底边 = 10.9%，垂直中线 = 84px（与 .rim / .molewrap 严格同一条线） */
  position:absolute;left:9%;right:9%;bottom:11%;height:27%;
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 14%,var(--soil) 0%,var(--soil-2) 60%,#7A5334 100%);
  box-shadow:inset 0 7px 11px rgba(0,0,0,.6), inset 0 -2px 4px rgba(255,255,255,.1), 0 2px 0 rgba(255,255,255,.28);
  z-index:1;
}
.molewrap{ /* 裁剪容器：果叽从洞里钻出。底边 = 洞口的垂直中线 */
  position:absolute;left:0;right:0;bottom:25%;height:71%;
  overflow:hidden;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;
}
.mole{
  width:100%;height:100%;
  position:relative;
  transform:translateY(112%) scaleY(.86);
  transition:transform .24s var(--ease-pop);
  will-change:transform;
}
.mole img{
  position:absolute;left:50%;bottom:0;
  transform:translateX(-50%);
  max-width:100%;max-height:100%;
  width:auto;height:auto;
  object-fit:contain;
  filter:drop-shadow(0 5px 6px rgba(60,30,0,.3));
  pointer-events:none;
}
.hole.up .mole{transform:translateY(6%) scaleY(1)}
.rim{ /* 洞口「前壁」：与 .pit 同位置同大小的椭圆，只保留下半部分实心填充，
         刚好盖住果叽被裁切的那条边，制造"从洞里钻出来"的纵深。 */
  position:absolute;left:9%;right:9%;bottom:11%;height:27%;
  border-radius:50%;
  background:linear-gradient(180deg,#6B4A30 0%,#4A3222 55%,#33220F 100%);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.55), inset 0 -2px 3px rgba(255,255,255,.07);
  clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%);
  z-index:3;pointer-events:none;
}
.hole .ring{ /* 命中涟漪 */
  position:absolute;left:15%;right:15%;bottom:13%;height:24%;
  border-radius:50%;border:3px solid #fff;opacity:0;z-index:4;pointer-events:none;
}
.hole.hit .ring{animation:ringOut .42s var(--ease-out) forwards}
@keyframes ringOut{
  0%{opacity:.9;transform:scale(.5)}
  100%{opacity:0;transform:scale(1.6)}
}
/* 命中形变 */
.hole.hit .mole{animation:squash .34s var(--ease-out)}
@keyframes squash{
  0%{transform:translateY(6%) scale(1,1)}
  28%{transform:translateY(14%) scale(1.34,.66)}
  62%{transform:translateY(6%) scale(.88,1.14)}
  100%{transform:translateY(6%) scale(1,1)}
}
/* 点空抖动 */
.hole.empty{animation:shake .3s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  80%{transform:translateX(-3px)}
}
/* 金果叽光环 */
.hole.gold .mole::before{
  content:"";position:absolute;left:50%;bottom:6%;
  width:74%;aspect-ratio:1/1;transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,74,.85),rgba(255,190,20,.28) 55%,transparent 72%);
  filter:blur(6px);z-index:-1;
  animation:goldSpin 1.1s linear infinite;
}
@keyframes goldSpin{0%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.14)}100%{transform:translateX(-50%) scale(1)}}
.hole.gold .mole img{filter:drop-shadow(0 0 12px rgba(255,196,20,.95)) drop-shadow(0 5px 6px rgba(120,70,0,.35))}
/* 炸弹果叽：去色 + 红晕 + 危险虚线环，一眼可辨 */
.hole.bomb .mole img{
  filter:drop-shadow(0 0 13px rgba(229,72,77,.95)) drop-shadow(0 4px 6px rgba(60,0,0,.45))
         saturate(.25) brightness(.82) contrast(1.08);
}
.hole.bomb .mole::before{
  content:"";position:absolute;left:50%;bottom:0;
  width:88%;aspect-ratio:1/1;transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(229,72,77,.55) 0%,rgba(229,72,77,.2) 50%,transparent 72%);
  filter:blur(6px);z-index:-1;
  animation:bombPulse .5s ease-in-out infinite;
}
.hole.bomb .mole::after{
  content:"";position:absolute;left:50%;bottom:1%;
  width:74%;aspect-ratio:1/1;transform:translateX(-50%);
  border-radius:50%;
  border:3px dashed rgba(229,72,77,.95);
  animation:bombRing 2.6s linear infinite;
  pointer-events:none;
}
@keyframes bombRing{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
@keyframes bombPulse{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.16)}}

/* ============================================================
   6. 底栏
   ============================================================ */
.bottombar{flex:0 0 auto;display:flex;align-items:center;gap:10px}
.pill{
  flex:1 1 auto;min-width:0;
  font-size:12px;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:9px 14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:var(--sh-1);
}
.btn{
  border-radius:99px;font-weight:700;font-size:14px;
  padding:0 20px;height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .14s var(--ease-out),filter .14s,box-shadow .14s;
}
.btn:active{transform:scale(.96)}
.btn.primary{
  background:linear-gradient(150deg,#FFD27A,var(--guoji-deep));
  color:#fff;box-shadow:0 6px 18px rgba(238,138,34,.4),inset 0 -2px 0 rgba(0,0,0,.12);
}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--text-2);box-shadow:var(--sh-1)}
.btn.wide{width:100%;height:48px;font-size:15.5px}

/* ============================================================
   7. 遮罩层（用 margin:auto 居中，避免小屏顶部被切）
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;justify-content:flex-start;   /* ★ 关键 */
  overflow-y:auto;overscroll-behavior:contain;
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
  background:rgba(255,247,236,.9);
  backdrop-filter:blur(14px) saturate(1.2);
  opacity:0;visibility:hidden;
  transition:opacity .22s,visibility .22s;
}
@media (prefers-color-scheme:dark){ .overlay{background:rgba(24,18,12,.92)} }
.overlay.show{opacity:1;visibility:visible}
.scwrap{
  margin:auto;width:100%;max-width:440px;      /* ★ 居中交给 margin:auto */
  display:flex;flex-direction:column;gap:14px;
}
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:clamp(16px,4.4vw,26px);
  box-shadow:var(--sh-3);
}
.panel h2{font-size:clamp(20px,5.6vw,25px);font-weight:800;letter-spacing:-.3px;line-height:1.25}
.panel h2 .accent{color:var(--guoji-deep)}
.panel .sub{font-size:13px;color:var(--text-2);margin-top:7px;line-height:1.65}
.hero-guojis{display:flex;justify-content:center;margin:0 0 2px}
.hero-guojis img{width:min(200px,56vw);display:block}

/* 麦次元搜索卡片 */
.mc-card{width:100%;background:#F6FBF6;border:2px solid #DFF1E2;border-radius:18px;
  padding:14px 16px 12px;box-shadow:0 4px 14px rgba(120,170,130,.10)}
.mc-search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #E9E9E9;
  border-radius:999px;padding:7px 8px 7px 14px}
.mc-ic{font-size:15px;opacity:.75}
.mc-word{flex:1;font-weight:800;font-size:16px;color:#333}
.mc-btn{border:0;border-radius:999px;background:#07C160;color:#fff;font:inherit;
  font-weight:800;font-size:14px;padding:7px 22px;cursor:pointer;transition:transform .08s ease}
.mc-btn:active{transform:scale(.94)}
.mc-hint{margin-top:9px;text-align:center;font-size:12.5px;color:#8C9490;line-height:1.5}
.mc-hint b{color:#07C160;font-weight:800}

.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.mode{
  border:2px solid var(--line);border-radius:var(--r-md);
  padding:12px;text-align:left;background:var(--surface-2);
  transition:border-color .18s,background .18s,transform .14s;
}
.mode:active{transform:scale(.97)}
.mode.on{border-color:var(--guoji);background:rgba(255,179,71,.13)}
.mode b{display:block;font-size:14.5px;margin-bottom:4px}
.mode span{font-size:11.5px;color:var(--text-2);line-height:1.5;display:block}

/* 结算 */
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.res{
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px 12px;
}
.res .k{font-size:10.5px;color:var(--text-3);letter-spacing:.8px}
.res .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.res.big{grid-column:1/-1;text-align:center;padding:14px}
.res.big .v{font-size:40px;color:var(--score);line-height:1.1}
.best-tag{
  display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;
  color:#fff;background:var(--gold);border-radius:99px;padding:3px 11px;
}
.rank{font-size:14px;font-weight:800;margin-top:8px}

/* (素材面板样式已移除) */

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);z-index:99;
  background:rgba(58,42,22,.94);color:#fff;
  font-size:12.5px;font-weight:600;line-height:1.5;
  border-radius:99px;padding:10px 20px;
  max-width:88vw;text-align:center;
  opacity:0;transition:opacity .22s,transform .22s var(--ease-out);
  pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.spin{
  width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-height:680px){
  .panel{padding:15px}
  .panel h2{font-size:19px}
  .hero-guojis img{width:min(150px,52vw)}
  .timer{width:54px;height:54px}
  .timer #uiTime{font-size:17px}
  .res.big .v{font-size:32px}
}
</style>

/* 启动时装载默认表情包（内嵌的导入果叽表情，已去底统一尺寸） */
function loadBuiltin(){
  let pending = EMBED_PACK.length;
  EMBED_PACK.forEach(m => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = MAT; cv.height = MAT;
      cv.getContext('2d').drawImage(img, 0, 0);
      Lib.add(cv, { name: m.n });
      if (--pending === 0){ startIdlePreview(); }
    };
    img.onerror = () => { if (--pending === 0){ startIdlePreview(); } };
    img.src = m.d;
  });
}

/* ============================================================================
   2. 随机分配 —— 洗牌袋（Shuffle Bag）
/*
   朴素 Math.random 会有两个问题：
     ① 同一只果叽短时间反复出现，看着像卡住
     ② 稀有表情可能几十次都不出
   洗牌袋保证「每 N 次（N=池子大小）内每个素材恰好出现一次」，观感丰富得多。
   特殊角色（金/炸弹）不放进主袋，走独立概率插入，避免被"平均化"。
   ============================================================================ */
const Bag = {
  queue: [],
  last: null,

  refill(pool){
    this.queue = shuffle(pool.map((_, i) => i));
    /* 装袋后若首个与上一只相同，和随机位置交换，避免连续重复 */
    if (this.queue.length > 1 && this.last !== null){
      const first = pool[this.queue[0]];
      if (first && first.id === this.last.id){
        const j = 1 + randInt(this.queue.length - 1);
        [this.queue[0], this.queue[j]] = [this.queue[j], this.queue[0]];
      }
    }
  },

  next(){
    const pool = Lib.pool();
    if (!pool.length) return null;
    if (!this.queue.length) this.refill(pool);
    let idx = this.queue.shift();
    if (idx >= pool.length) idx = randInt(pool.length);   // 池子变小后的兜底
    const item = pool[idx];
    this.last = item;
    return item;
  },

  reset(){ this.queue = []; this.last = null; },
};

/* ============================================================================
   6. 音效 —— WebAudio 合成，不依赖任何音频文件
   ============================================================================ */
const SFX = {
  ctx: null, on: true,
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) this.ctx = new AC();
  },
  blip(freq0, freq1, dur, type, gain){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || .18, t + .012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + .02);
  },
  hit(combo){
    const f = 720 + Math.min(combo, 14) * 46;
    this.blip(f, f * 1.6, .11, 'triangle', .17);
  },
  gold(){ this.blip(880, 1320, .10, 'square', .13); setTimeout(() => this.blip(1320, 1760, .13, 'square', .12), 80); },
  bomb(){ this.blip(220, 60, .32, 'sawtooth', .22); },
  miss(){ this.blip(200, 120, .13, 'sine', .11); },
  over(){ this.blip(660, 180, .55, 'triangle', .18); },
};

  { at: 0.20, name: '渐入' },
  { at: 0.52, name: '压力' },
  { at: 0.80, name: '疯狂' },
];

const G = {
  state: 'idle',        // idle | playing | paused | over
  mode: 'timed',
  duration: 60,
  t: 0,
  score: 0, combo: 0, maxCombo: 0,
  hits: 0, misses: 0, goldHits: 0, bombHits: 0, emptyClicks: 0,
  lives: 3,
  spawnTimer: 0,
  scoreMul: 1,
  holes: [],
  best: 0,
};

/* --- 7.1 难度曲线：连续插值，不用 4 档跳变，避免突兀 --- */
function diffAt(t){
  const p = clamp(t / G.duration, 0, 1);
  const e = smooth(p);
  return {
    p, e,
    interval : lerp(0.95, 0.34, e),    // 冒头间隔（秒）
    upTime   : lerp(1.25, 0.55, e),    // 停留时长（秒）
    maxAlive : p < .32 ? 1 : (p < .72 ? 2 : 3),
    goldP    : lerp(.05, .12, p),
    bombP    : p < .22 ? 0 : lerp(0, .19, (p - .22) / .78),   // 前 13 秒无炸弹
  };
}
function phaseName(p){
  let n = PHASES[0].name;
  for (const ph of PHASES) if (p >= ph.at) n = ph.name;
  return n;
}

/* --- 7.2 建洞 --- */
function buildGrid(){
  const grid = $('#grid');
  grid.innerHTML = '';
  G.holes = [];
  for (let i = 0; i < HOLES; i++){
    const el = document.createElement('div');
    el.className = 'hole';
    el.innerHTML =
      '<div class="mound"></div>' +
      '<div class="pit"></div>' +
      '<div class="molewrap"><div class="mole"><img alt=""></div></div>' +
      '<div class="rim"></div>' +
      '<div class="ring"></div>';
    grid.appendChild(el);
    const h = {
      el,
      img: $('img', el),
      state: 'idle',       // idle | up | down
      kind: 'normal',
      appearAt: 0,
      upTime: 1,
      item: null,
      hideTimer: null,
    };
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); onHoleTap(h); }, { passive: false });
    G.holes.push(h);
  }
}

/* --- 7.3 冒头 --- */
function aliveCount(){ return G.holes.filter(h => h.state === 'up').length; }

function spawn(){
  const idle = G.holes.filter(h => h.state === 'idle');
  if (!idle.length) return;
  const h = idle[randInt(idle.length)];
  const D = diffAt(G.t);

  /* 特殊角色：独立概率，不进洗牌袋 */
  const r = Math.random();
  h.kind = 'normal';
  if (D.bombP > 0 && r < D.bombP) h.kind = 'bomb';
  else if (r < D.bombP + D.goldP) h.kind = 'gold';

  const item = Bag.next();
  if (!item) return;

  h.item = item;
  h.img.src = item.url;
  h.upTime = D.upTime * rand(.9, 1.1);
  h.appearAt = G.t;
  h.state = 'up';
  h.smugged = false;
  h.el.classList.remove('hit', 'empty');
  h.el.classList.toggle('gold', h.kind === 'gold');
  h.el.classList.toggle('bomb', h.kind === 'bomb');
  h.el.classList.add('up');
}

/* --- 7.4 收回 --- */
function retract(h, timedOut){
  if (h.state !== 'up') return;
  h.state = 'down';
  h.el.classList.remove('up');
  const el = h.el;
  setTimeout(() => {
    el.classList.remove('gold', 'bomb');
    if (h.state === 'down') h.state = 'idle';
  }, 260);

  if (timedOut && h.kind === 'normal'){
    G.misses++;
    breakCombo();
    SFX.miss();
    if (G.mode === 'survival'){
      G.lives--;
      if (G.lives <= 0){ endGame(); return; }
    }
  }
}

/* 逃掉前悄悄换上一张「得意」脸 —— 给玩家一点情绪反馈 */
function smugTease(h){
  if (h.kind !== 'normal' || h.smugged) return;
  h.smugged = true;
  const ex = h.item && h.item.expr;
  const smug = Lib.items.find(i => i.expr === 'smug' && i.on && i !== h.item);
  if (smug && ex !== 'smug') h.img.src = smug.url;
}

function breakCombo(){
  if (G.combo >= 5) SFX.miss();
  G.combo = 0;
  $('#uiCombo').classList.add('zero');
}

/* --- 7.5 命中判定 --- */
function onHoleTap(h){
  if (G.state !== 'playing') return;

  if (h.state !== 'up'){
    /* 点空：不扣分，只断连击，避免无脑连点 */
    if (h.state === 'idle'){
      G.emptyClicks++;
      h.el.classList.remove('empty');
      void h.el.offsetWidth;
      h.el.classList.add('empty');
      setTimeout(() => h.el.classList.remove('empty'), 320);
      if (G.combo > 0) breakCombo();
    }
    return;
  }

  /* 命中：先压扁，再缩回洞里 */
  h.state = 'down';
  h.el.classList.add('hit');
  const r = h.el.getBoundingClientRect();
  setTimeout(() => {
    h.el.classList.remove('hit', 'up', 'gold', 'bomb');
    h.state = 'idle';
  }, 330);

  if (h.kind === 'bomb'){
    G.bombHits++;
    G.score = Math.max(0, G.score - 30);
    breakCombo();
    SFX.bomb();
    burst(r.left + r.width/2, r.top + r.height*.62, ['#E5484D', '#7A2E2E', '#FFB4B4'], 16);
    floatText(r.left + r.width/2, r.top + r.height*.34, '−30', '#E5484D', 22);
    $('#stage').animate?.([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' },
                           { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 240 });
  } else {
    G.hits++;
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    const mul = h.kind === 'gold' ? 3 : 1;
    const comboBonus = Math.min(G.combo - 1, 10) * 2;      // 连击加成封顶 +20
    const gain = Math.round((10 + comboBonus) * mul * G.scoreMul);
    G.score += gain;

    const c = h.kind === 'gold' ? ['#FFD54A', '#F5B301', '#FFF3C4']
                                : ['#FFB347', '#EE8A22', '#FFE7B4'];
    if (h.kind === 'gold'){ G.goldHits++; SFX.gold(); } else SFX.hit(G.combo);
    burst(r.left + r.width/2, r.top + r.height*.55, c, h.kind === 'gold' ? 20 : 12);
    floatText(r.left + r.width/2, r.top + r.height*.32,
              '+' + gain, h.kind === 'gold' ? '#F5B301' : '#F2643C', h.kind === 'gold' ? 26 : 19);
    if (G.combo >= 5 && G.combo % 5 === 0) floatText(r.left + r.width/2, r.top + r.height*.18, G.combo + ' 连击!', '#E85D9E', 17);
    bump('#uiScore'); $('#uiCombo').classList.remove('zero');
  }

  setTimeout(() => h.el.classList.remove('hit'), 340);
  syncHUD();
}

function bump(sel){ const e = $(sel); e.classList.add('bump'); setTimeout(() => e.classList.remove('bump'), 130); }

/* ============================================================================
   8. 渲染 / 粒子
   ============================================================================ */
const FX = { parts: [], texts: [], cv: null, c: null, dpr: 1, ro: null };

function initFX(){
  FX.cv = $('#fx');
  FX.c = FX.cv.getContext('2d');
  resizeFX();
  if (window.ResizeObserver){
    FX.ro = new ResizeObserver(resizeFX);
    FX.ro.observe($('#stage'));
  } else {
    window.addEventListener('resize', resizeFX);
  }
}
function resizeFX(){
  const st = $('#stage');
  const w = st.clientWidth, h = st.clientHeight;
  FX.dpr = Math.min(window.devicePixelRatio || 1, 2);
  FX.cv.width = Math.round(w * FX.dpr);
  FX.cv.height = Math.round(h * FX.dpr);
}

/* 屏幕坐标 → fx canvas 内部坐标 */
function toFX(clientX, clientY){
  const r = FX.cv.getBoundingClientRect();
  return { x: (clientX - r.left) * (FX.cv.width / r.width), y: (clientY - r.top) * (FX.cv.height / r.height) };
}

function burst(clientX, clientY, colors, n){
  const p = toFX(clientX, clientY);
  for (let i = 0; i < n; i++){
    const a = rand(0, TAU), sp = rand(60, 340) * FX.dpr;
    FX.parts.push({
      x: p.x, y: p.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(40, 180) * FX.dpr,
      r: rand(2.5, 6.5) * FX.dpr,
      life: rand(.45, .85), age: 0,
      c: colors[randInt(colors.length)],
    });
  }
}
function floatText(clientX, clientY, str, color, size){
  const p = toFX(clientX, clientY);
  FX.texts.push({ x: p.x, y: p.y, str, color, size: size * FX.dpr, life: .9, age: 0 });
}

function stepFX(dt){
  const c = FX.c, W = FX.cv.width, H = FX.cv.height;
  c.clearRect(0, 0, W, H);

  for (let i = FX.parts.length - 1; i >= 0; i--){
    const p = FX.parts[i];
    p.age += dt;
    if (p.age >= p.life){ FX.parts.splice(i, 1); continue; }
    p.vy += 900 * FX.dpr * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const k = 1 - p.age / p.life;
    c.globalAlpha = k;
    c.beginPath(); c.arc(p.x, p.y, p.r * k, 0, TAU);
    c.fillStyle = p.c; c.fill();
  }

  for (let i = FX.texts.length - 1; i >= 0; i--){
    const t = FX.texts[i];
    t.age += dt;
    if (t.age >= t.life){ FX.texts.splice(i, 1); continue; }
    const k = t.age / t.life;
    c.globalAlpha = k < .15 ? k / .15 : (1 - k) / .85;
    c.font = '800 ' + t.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.lineWidth = t.size * .18; c.strokeStyle = 'rgba(255,255,255,.92)';
    c.strokeText(t.str, t.x, t.y - k * 46 * FX.dpr);
    c.fillStyle = t.color;
    c.fillText(t.str, t.x, t.y - k * 46 * FX.dpr);
  }
  c.globalAlpha = 1;
}

/* 首页待机预览：探头果叽动图 */
function startIdlePreview(){
  const el = $('#heroPeek');
  if (el && !el.src) el.src = HERO_PEEK;
}

/* ============================================================================
   9. 游戏流程
   ============================================================================ */
let rafId = null, lastTs = 0;

function startGame(){
  SFX.init();
  G.state = 'playing';
  G.t = 0; G.score = 0; G.combo = 0; G.maxCombo = 0;
  G.hits = 0; G.misses = 0; G.goldHits = 0; G.bombHits = 0; G.emptyClicks = 0;
  G.lives = 3; G.scoreMul = 1; G.spawnTimer = .5;
  Bag.reset();
  G.holes.forEach(h => {
    clearTimeout(h.hideTimer);
    h.state = 'idle'; h.kind = 'normal'; h.smugged = false;
    h.el.classList.remove('up', 'gold', 'bomb', 'hit', 'empty');
  });
  FX.parts.length = 0; FX.texts.length = 0;

  hide('#ovStart'); hide('#ovEnd');
  $('#btnPause').textContent = '暂停';
  syncHUD();

  lastTs = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function loop(ts){
  rafId = requestAnimationFrame(loop);
  const dt = Math.min(.05, (ts - lastTs) / 1000);
  lastTs = ts;

  if (G.state === 'playing'){
    G.t += dt;
    const D = diffAt(G.t);

    /* 终局冲刺 */
    G.scoreMul = (G.t > G.duration - 12) ? 1.5 : 1;

    /* 冒头调度 */
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0 && aliveCount() < D.maxAlive){
      spawn();
      G.spawnTimer = D.interval * rand(.82, 1.15);
    }

    /* 超时收回（在最后 1/3 时间换上得意脸） */
    for (const h of G.holes){
      if (h.state !== 'up') continue;
      const age = G.t - h.appearAt;
      if (age >= h.upTime * .66) smugTease(h);
      if (age >= h.upTime) retract(h, h.kind === 'normal');
    }

    /* 计时结束 */
    if (G.t >= G.duration){ endGame(); }

    syncHUD();
  }
  stepFX(dt);
}

function endGame(){
  G.state = 'over';
  G.holes.forEach(h => { if (h.state === 'up'){ h.state = 'down'; h.el.classList.remove('up'); } });
  SFX.over();

  const isBest = G.score > G.best;
  if (isBest){ G.best = G.score; try { localStorage.setItem('guoji_wam_best', String(G.best)); } catch(e){} }

  const total = G.hits + G.misses + G.bombHits;
  const acc = total ? Math.round(G.hits / total * 100) : 0;

  $('#endTitle').textContent = G.mode === 'survival' && G.lives <= 0 ? '被果叽逃掉了！' : '时间到！';
  $('#endSub').textContent = isBest ? '新纪录！这只果叽打得很准。' : '再来一局试试更高的连击。';
  $('#rScore').textContent = G.score;
  $('#rBest').innerHTML = isBest ? '<span class="best-tag">🏆 新纪录</span>' : '历史最高 ' + G.best;
  $('#rCombo').textContent = G.maxCombo;
  $('#rAcc').textContent = acc + '%';
  $('#rHit').innerHTML = G.hits + ' / ' + G.misses;
  $('#rGold').textContent = G.goldHits;

  const rank = G.score >= 1400 ? 'S · 果叽克星' : G.score >= 1000 ? 'A · 手速在线'
             : G.score >= 650  ? 'B · 稳扎稳打' : G.score >= 350 ? 'C · 还需练习' : 'D · 先熟悉节奏';
  $('#rRank').textContent = '评级 ' + rank;

  show('#ovEnd');
  syncHUD();
}

function pauseGame(on){
  if (on && G.state === 'playing'){
    G.state = 'paused';
    $('#btnPause').textContent = '继续';
    toast('已暂停');
  } else if (!on && G.state === 'paused'){
    G.state = 'playing';
    lastTs = performance.now();
    $('#btnPause').textContent = '暂停';
    toast('继续游戏');
  }
}

/* --- HUD --- */
function syncHUD(){
  $('#uiScore').textContent = G.score;
  $('#uiCombo').textContent = G.combo;
  $('#uiCombo').classList.toggle('zero', G.combo === 0);

  const left = Math.max(0, G.duration - G.t);
  $('#uiTime').textContent = G.mode === 'survival'
    ? '❤️'.repeat(Math.max(0, G.lives))
    : Math.ceil(left);
  $('#uiTimerBox').classList.toggle('low', G.mode === 'timed' && left <= 10);
  const C = 2 * Math.PI * 17;
  $('#uiRing').style.strokeDashoffset = String(C * (1 - left / G.duration));

  const p = clamp(G.t / G.duration, 0, 1);
  $('#uiDiff').style.width = (p * 100) + '%';
  $('#uiDiff').classList.toggle('rush', G.scoreMul > 1);
  $('#uiPhase').textContent = G.state === 'idle'
    ? '点击开始'
    : (G.scoreMul > 1 ? '⚡ 终局冲刺 ×1.5' : phaseName(p) + (G.mode === 'survival' ? ' · 生存' : ''));
}

/* --- 面板开合 --- */
const show = sel => $(sel).classList.add('show');
const hide = sel => $(sel).classList.remove('show');

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================================
   11. 绑定
   ============================================================================ */
function bind(){
  /* 模式切换 */
  $$('.mode').forEach(m => m.addEventListener('click', () => {
    $$('.mode').forEach(x => x.classList.remove('on'));
    m.classList.add('on');
    G.mode = m.dataset.mode;
  }));

  /* 开始 / 结算 */
  $('#btnStart').addEventListener('click', startGame);
  $('#btnAgain').addEventListener('click', startGame);
  $('#btnHome').addEventListener('click', () => { hide('#ovEnd'); G.state = 'idle'; G.t = 0; syncHUD(); show('#ovStart'); });
  $('#btnPause').addEventListener('click', () => pauseGame(G.state === 'playing'));

  /* 音效 */
  $('#btnSound').addEventListener('click', () => {
    SFX.on = !SFX.on;
    $('#btnSound').textContent = SFX.on ? '🔊' : '🔇';
    $('#btnSound').classList.toggle('off', !SFX.on);
    if (SFX.on) SFX.init();
  });

  /* 麦次元搜索卡片 */
  const mcBtn = $('#btnMaiciyuan');
  if (mcBtn) mcBtn.addEventListener('click', () => toast('去微信里搜索公众号「麦次元」吧 🍊'));

  /* 键盘：空格暂停 / 回车开始 */
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && (G.state === 'playing' || G.state === 'paused')){
      e.preventDefault(); pauseGame(G.state === 'playing');
    }
    if (e.code === 'Enter' && (G.state === 'idle' || G.state === 'over')){
      e.preventDefault(); startGame();
    }
  });

  /* 切后台自动暂停 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.state === 'playing') pauseGame(true);
  });

  /* 阻止移动端双击缩放 */
  document.addEventListener('gesturestart', e => e.preventDefault());
}

/* ============================================================================
   12. 启动
   ============================================================================ */
function boot(){
  try { G.best = parseInt(localStorage.getItem('guoji_wam_best') || '0', 10) || 0; } catch(e){ G.best = 0; }
  $('#uiBest').textContent = G.best ? '历史最高分：' + G.best : '还没有记录，第一局就是新纪录';

  loadBuiltin();
  buildGrid();
  initFX();
  startIdlePreview();
  bind();
  syncHUD();
}
boot();
</script>
